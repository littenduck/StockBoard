<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules · Stock Benchmark</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<style>
  #explanation { margin-bottom:var(--space-5); } #explanation ul { display:flex; flex-wrap:wrap; gap:var(--space-1) var(--space-4); }
  #explanation > div { margin-top:var(--space-3); }
</style>
</head>
<body data-title-key="rules_title">
<main class="catalog">
  <div class="top-row"><nav id="page-nav"></nav>
    <button class="icon-button" id="language-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-language"/></svg></button></div>
  <header class="page-header">
    <h1 id="page-heading"></h1>
    <small id="summary"></small>
  </header>
  <details id="explanation"><summary id="explanation-title"></summary><div id="explanation-body"></div></details>
  <div class="filter-row">
    <small><label for="filter-select" id="filter-label"></label></small>
    <span class="field"><select id="filter-select"><option value="all"></option><option value="used"></option><option value="built"></option><option value="backtest"></option></select><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron"/></svg></span>
  </div>
  <div id="group-list"><small id="loading"></small></div>
</main>
<script src="/language.js"></script>
<script src="/rule-text.js"></script>
<script src="/page.js"></script>
<script>
let ruleCatalog = null, loadFailed = false;
const allRuleList = () => ruleCatalog.group_list.flatMap(group => group.rule_list);

function renderStaticText() {
  pageRenderNav('/rules');
  document.getElementById('page-heading').innerHTML = languageRenderText(languageLocalize('rule_catalog'));
  document.getElementById('filter-label').textContent = languageText('show');
  [...document.getElementById('filter-select').options].forEach(option =>
    option.textContent = languageText({ all:'all_rules', used:'used_rules', built:'built_rules', backtest:'backtest_rules' }[option.value]));
  document.getElementById('explanation-title').textContent = languageText('how_to_read');
  document.getElementById('explanation-body').innerHTML = ['id_explanation', 'gap_explanation', 'backtest_explanation'].map(key => languageRenderParagraphs(languageLocalize(key))).join('')
    + `<small>${languageRenderText(languageLocalize('status_label'))}</small><ul>`
    + Object.keys(PAGE_STATUS_COLOR).map(key => `<li><small><span class="${PAGE_STATUS_COLOR[key]}">${languageEscape(languageText(key))}</span>: ${languageEscape(languageText(key + '_explanation'))}</small></li>`).join('') + '</ul>';
  const loading = document.getElementById('loading');
  if (loading) loading.textContent = languageText('loading_rules');
}

function renderSummary() {
  const ruleList = allRuleList();
  document.getElementById('summary').textContent = languageText('rule_summary', { total:ruleList.length, built:ruleList.filter(rule => rule.status === 'built').length,
    backtest:ruleList.filter(rule => rule.backtestable === 'yes').length, used:ruleList.filter(rule => rule.used_by.length).length });
}

function renderRuleCatalog(shouldScrollToTarget = true) {
  const filter = document.getElementById('filter-select').value;
  const keepRule = rule => filter === 'all' || (filter === 'used' ? rule.used_by.length > 0 : filter === 'backtest' ? rule.backtestable === 'yes' : rule.status === 'built');
  document.getElementById('group-list').innerHTML = ruleCatalog.group_list.map(group => {
    const ruleList = group.rule_list.filter(keepRule);
    if (!ruleList.length) return '';
    const topicName = Object.fromEntries(group.topic_list.map(topic => [topic.topic_id, topic.display_name]));
    return `<section class="entry-group"><header><h2>${languageRenderText(group.display_name)}</h2><small>${languageRenderText(group.description)}</small></header>
      ${ruleList.map((rule, index) => (index && ruleList[index - 1].topic === rule.topic || !topicName[rule.topic] ? '' : `<h3>${languageRenderText(topicName[rule.topic])}</h3>`) + pageRenderRuleEntry(rule)).join('')}</section>`;
  }).join('');
  const target = pageMarkTarget();
  if (target && shouldScrollToTarget) target.scrollIntoView({ block:'center' });
}

function handleLanguageChange() {
  renderStaticText();
  if (loadFailed) { document.getElementById('group-list').innerHTML = `<small class="negative">${languageEscape(languageText('rules_failed'))}</small>`; return; }
  if (ruleCatalog) { renderSummary(); renderRuleCatalog(false); }
}

try { if (localStorage.getItem('stock-benchmark-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (error) { /* storage blocked: light theme */ }
languageInitialize('en');
languageBindSwitch(handleLanguageChange);
renderStaticText();
document.getElementById('filter-select').onchange = () => renderRuleCatalog(false);
fetch('/api/v1/rules').then(response => response.json()).then(data => {
  ruleCatalog = data; languageApplyServerDefault(data.default_language, handleLanguageChange); renderSummary(); renderRuleCatalog();
}).catch(() => { loadFailed = true; handleLanguageChange(); });
</script>
</body>
</html>
