<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rule catalog · StockBoard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<style>
  main { max-width:960px; margin:0 auto; padding:var(--space-6); }
  .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-2); }
  .page-header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:var(--space-2) var(--space-6);
    padding-bottom:var(--space-5); margin-bottom:var(--space-5); border-bottom:1px solid var(--separator); }
  #explanation { margin-bottom:var(--space-5); }
  #explanation ul { display:flex; flex-wrap:wrap; gap:var(--space-1) var(--space-4); }
  .filter-row { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4); }
  .rule-group { margin-bottom:var(--space-6); }
  .rule-group > header { margin-bottom:var(--space-2); }
  .rule-group .row { display:grid; grid-template-columns:72px 1fr minmax(0, 320px); gap:var(--space-3); align-items:baseline; margin:0;
    border-top:1px solid var(--separator); scroll-margin-top:var(--space-6); }
  .rule-group > header > small, .rule-group .row > div > small { display:block; }
  .rule-group .row > div > small { margin-top:var(--space-1); }
  .rule-group > header + .row { border-top:0; padding-top:0; padding-bottom:var(--space-1); }
  .rule-meta { display:grid; grid-template-columns:104px 1fr; gap:var(--space-1) var(--space-3); }
  .usage { display:flex; flex-wrap:wrap; gap:var(--space-1); }
  @media (max-width:899px) {
    main { padding:var(--space-5) var(--space-4); }
    .rule-group .row { grid-template-columns:72px 1fr; row-gap:var(--space-1); }
    .rule-meta { grid-column:2 / 3; grid-template-columns:auto 1fr; }
    .rule-group > header + .row { display:none; }
  }
</style>
</head>
<body data-title-key="rules_title">
<main>
  <div class="top-row"><small><a id="back-link" href="/"></a></small>
    <button class="icon-button" id="language-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-language"/></svg></button></div>
  <header class="page-header">
    <h1 id="page-heading"></h1>
    <small id="summary"></small>
  </header>
  <section class="box" id="explanation"></section>
  <div class="filter-row">
    <small><label for="filter-select" id="filter-label"></label></small>
    <span class="field"><select id="filter-select"><option value="all"></option><option value="used"></option><option value="built"></option></select><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron"/></svg></span>
  </div>
  <div id="rule-group-list"><small id="loading-rules"></small></div>
</main>
<script src="/language.js"></script>
<script>
const STATUS_COLOR = { built:'positive', todo:'caution', no_data:'muted' };
const escapeText = languageEscape;
const primaryText = localizedText => localizedText[languageGetActive()];
let ruleCatalog = null, loadFailed = false;

function markTargetRow() {
  document.querySelectorAll('.is-target').forEach(row => row.classList.remove('is-target'));
  const row = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (row) row.classList.add('is-target');
  return row;
}
window.addEventListener('hashchange', markTargetRow);
function renderRuleRow(rule) {
  const bandLink = rule.band_of ? `<small><a href="#rule-${rule.band_of}">${escapeText(languageText('band_of', { id:rule.band_of }))}</a></small>` : '';
  return `<div class="row" id="rule-${rule.rule_id}"><small>${rule.rule_id}</small>
    <div>${languageRenderText(rule.name)}<small>${languageRenderText(rule.description)}</small>${rule.note ? `<small>${languageRenderText(rule.note)}</small>` : ''}${bandLink}</div>
    <div class="rule-meta"><small class="${STATUS_COLOR[rule.status]}">${escapeText(languageText(rule.status))} · ${escapeText(languageText(rule.method))}</small>
      <div class="usage">${rule.used_by.length ? rule.used_by.map(usage => `<small class="box">${escapeText(primaryText(usage.display_name))} · W${usage.weight}${usage.veto ? ' · ' + escapeText(languageText('veto')) : ''}</small>`).join('') : `<small>${escapeText(languageText('not_used'))}</small>`}</div></div></div>`;
}

function renderStaticText() {
  document.getElementById('back-link').textContent = languageText('back_to_dashboard');
  document.getElementById('page-heading').innerHTML = languageRenderText(languageLocalize('rule_catalog'));
  document.getElementById('filter-label').textContent = languageText('show');
  [...document.getElementById('filter-select').options].forEach(option =>
    option.textContent = languageText({ all:'all_rules', used:'used_rules', built:'built_rules' }[option.value]));
  document.getElementById('explanation').innerHTML = languageRenderParagraphs(languageLocalize('id_explanation'))
    + languageRenderParagraphs(languageLocalize('gap_explanation'))
    + `<small>${languageRenderText(languageLocalize('status_label'))}</small><ul>`
    + Object.keys(STATUS_COLOR).map(key => `<li><small><span class="${STATUS_COLOR[key]}">${escapeText(languageText(key))}</span>: ${escapeText(languageText(key + '_explanation'))}</small></li>`).join('') + '</ul>';
  const loading = document.getElementById('loading-rules');
  if (loading) loading.textContent = languageText('loading_rules');
}

function renderSummary() {
  if (!ruleCatalog) return;
  const ruleList = ruleCatalog.group_list.flatMap(group => group.rule_list);
  document.getElementById('summary').textContent = languageText('rule_summary', { total:ruleList.length,
    built:ruleList.filter(rule => rule.status === 'built').length, used:ruleList.filter(rule => rule.used_by.length).length });
}

function handleLanguageChange() {
  renderStaticText();
  if (loadFailed) { renderLoadFailure(); return; }
  if (ruleCatalog) { renderSummary(); renderRuleCatalog(false); }
}

function renderLoadFailure() {
  document.getElementById('rule-group-list').innerHTML = `<small class="negative">${escapeText(languageText('rules_failed'))}</small>`;
}

function renderRuleCatalog(shouldScrollToTarget = true) {
  const filter = document.getElementById('filter-select').value;
  const keepRule = rule => filter === 'all' || (filter === 'used' ? rule.used_by.length > 0 : rule.status === 'built');
  document.getElementById('rule-group-list').innerHTML = ruleCatalog.group_list.map(group => {
    const ruleList = group.rule_list.filter(keepRule);
    if (!ruleList.length) return '';
    return `<section class="rule-group"><header><h2>${languageRenderText(group.display_name)}</h2><small>${languageRenderText(group.description)}</small></header>
      <div class="row"><small>${escapeText(languageText('column_id'))}</small><small>${escapeText(languageText('column_rule'))}</small>
        <div class="rule-meta"><small>${escapeText(languageText('status_label'))}</small><small>${escapeText(languageText('column_used_by'))}</small></div></div>
      ${ruleList.map(renderRuleRow).join('')}</section>`;
  }).join('');
  const target = markTargetRow();
  if (target && shouldScrollToTarget) target.scrollIntoView({ block:'center' });
}

async function loadRuleCatalog() {
  ruleCatalog = await (await fetch('/api/v1/rules')).json();
  languageApplyServerDefault(ruleCatalog.default_language, handleLanguageChange);
  renderSummary();
  renderRuleCatalog();
}

try { if (localStorage.getItem('stockboard-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (error) { /* storage blocked: light theme */ }
languageInitialize('en');
languageBindSwitch(handleLanguageChange);
renderStaticText();
document.getElementById('filter-select').onchange = () => renderRuleCatalog(false);
loadRuleCatalog().catch(() => { loadFailed = true; renderLoadFailure(); });
</script>
</body>
</html>
