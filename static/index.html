<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockBoard</title>
<style>
  :root { --bg:#fff; --fg:#000; --mute:#6e7781; --line:#e6e8ea; --hover:#f5f6f7; --up:#00c805; --down:#ff5000; --mid:#d9a400; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#fff; --mute:#8d9399; --line:#23272b; --hover:#14171a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  .caption { font-size:12px; color:var(--mute); }
  .big { font-size:28px; font-weight:600; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .up { color:var(--up); } .down { color:var(--down); } .gray { color:var(--mute); }
  .layout { display:grid; min-height:100vh; }
  @media (min-width:900px) { .layout { grid-template-columns:280px 1fr; } aside { position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--line); } }
  aside { padding:16px 0; }
  aside h2 { font-size:12px; font-weight:400; color:var(--mute); margin:16px 16px 8px; }
  .indicator-item, .symbol-item { padding:8px 16px; display:grid; grid-template-columns:1fr auto; gap:0 8px; }
  .symbol-item { cursor:pointer; }
  .symbol-item:hover { background:var(--hover); }
  .symbol-item.selected { background:var(--hover); box-shadow:inset 2px 0 var(--fg); }
  main { padding:16px 24px; max-width:880px; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px; width:calc(100% - 32px); margin:0 16px; }
  .results { display:flex; gap:32px; margin:16px 0; }
  .strategy-gate { border-left:1px solid var(--line); padding:0 0 16px 16px; margin-left:8px; }
  .strategy-gate > .row { margin-left:-25px; }
  .strategy-rule-row { display:grid; grid-template-columns:48px 24px 1fr auto; gap:8px; padding:4px 0; border-top:1px solid var(--line); }
  .not_applicable { opacity:.4; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="row" style="padding:0 16px"><b>StockBoard</b><span class="caption" id="updated"></span></div>
    <h2>策略</h2>
    <select id="strategy-select"></select>
    <h2>市场指标</h2>
    <div id="indicator-list"></div>
    <h2>标的</h2>
    <div id="symbol-list"></div>
  </aside>
  <main id="strategy-panel"><span class="caption">点击左侧一个标的</span></main>
</div>
<script>
const statusMark = { pass:'✅', fail:'❌', unknown:'❓', not_applicable:'➖' };
const passMark = value => value === true ? '✅' : value === false ? '❌' : '❓';
const valueText = value => typeof value === 'number' ? Math.round(value * 100) / 100 : value ?? '';
const percentText = value => value == null ? '' : (value >= 0 ? '+' : '') + value.toFixed(2) + '%';
const changeClass = (value, isRisky) => value == null ? 'gray' : (value >= 0) !== !!isRisky ? 'up' : 'down';
const scoreClass = score => score == null ? 'gray' : score >= 75 ? 'up' : score >= 60 ? '' : 'down';
const scoreColor = score => score != null && score >= 60 && score < 75 ? 'style="color:var(--mid)"' : '';
let selectedSymbol = null;
let maxUnknownWeightRatio = 0.2;
const strategySelect = document.getElementById('strategy-select');

async function loadStrategyList() {
  const data = await (await fetch('/api/strategy_list')).json();
  strategySelect.innerHTML = data.strategy_list.map(s => `<option value="${s.strategy_id}">${s.display_name}</option>`).join('');
  strategySelect.value = data.default_strategy_id;
}

async function loadDashboardSnapshot() {
  const snapshot = await (await fetch('/api/snapshot?strategy_id=' + strategySelect.value)).json();
  maxUnknownWeightRatio = snapshot.max_unknown_weight_ratio;
  document.getElementById('updated').textContent = (snapshot.updated || '等待数据…').slice(5, 16);
  renderIndicatorList(snapshot.market_indicator_card_list);
  renderSymbolList(snapshot.symbol_card_list);
  if (!selectedSymbol && snapshot.symbol_card_list.length) selectedSymbol = snapshot.symbol_card_list[0].symbol;
  if (selectedSymbol) loadStrategyEvaluationForSymbol(selectedSymbol);
}

function renderIndicatorList(indicatorList) {
  document.getElementById('indicator-list').innerHTML = indicatorList.map(i => `
    <div class="indicator-item"><span>${i.display_name}</span><b>${i.value ?? '❓'}</b>
      <span></span><span class="caption ${changeClass(i.change_percent, i.is_higher_value_risky)}">${percentText(i.change_percent)}</span></div>`).join('');
}

function renderSymbolList(symbolList) {
  document.getElementById('symbol-list').innerHTML = symbolList.map(s => {
    const lowData = s.unknown_weight_ratio > maxUnknownWeightRatio;
    return `<div class="symbol-item ${s.symbol === selectedSymbol ? 'selected' : ''}" data-symbol="${s.symbol}">
      <b>${s.symbol}</b><span>${passMark(s.is_pass)} <b class="${lowData ? 'gray' : scoreClass(s.score_percent)}" ${lowData ? '' : scoreColor(s.score_percent)}>${s.score_percent == null ? '❓' : Math.round(s.score_percent)}</b></span>
      <span class="caption">$${s.price}</span><span class="caption ${changeClass(s.change_percent)}">${percentText(s.change_percent)}</span></div>`;
  }).join('');
  document.querySelectorAll('.symbol-item').forEach(item => item.onclick = () => {
    selectedSymbol = item.dataset.symbol;
    document.querySelectorAll('.symbol-item').forEach(i => i.classList.toggle('selected', i === item));
    loadStrategyEvaluationForSymbol(selectedSymbol);
    if (window.innerWidth < 900) document.getElementById('strategy-panel').scrollIntoView();
  });
}

async function loadStrategyEvaluationForSymbol(symbol) {
  const response = await fetch(`/api/evaluation/${strategySelect.value}/${symbol}`);
  if (response.ok) renderStrategyTree(symbol, await response.json());
}

function renderRuleRows(ruleList) {
  return ruleList.map(r => `<div class="strategy-rule-row ${r.status}"><span class="gray">${r.rule_id}</span>
    <span>${statusMark[r.status]}</span><span>${r.description}</span><span class="gray">${valueText(r.measured_value)}</span></div>`).join('');
}

function renderStrategyTree(symbol, evaluation) {
  const gates = evaluation.gate_result_list.map(g => `
    <div class="strategy-gate"><div class="row"><b>${passMark(g.is_pass)} ${g.display_name}</b>
      <span class="caption">${g.expiration_window_label ? '到期窗口 ' + g.expiration_window_label + ' 天（最佳）' : ''}</span></div>
      ${renderRuleRows(g.rule_result_list)}
      ${g.alternative_window_result_list.map(a => `<details><summary class="caption">其他窗口 ${a.expiration_window_label}</summary>${renderRuleRows(a.rule_result_list)}</details>`).join('')}
    </div>`).join('');
  const lowData = evaluation.unknown_weight_ratio > maxUnknownWeightRatio;
  document.getElementById('strategy-panel').innerHTML = `
    <div class="row"><h1 style="margin:0">${symbol}</h1><span class="caption">未知权重 ${Math.round(evaluation.unknown_weight_ratio * 100)}%${lowData ? ' · 数据不足' : ''}</span></div>
    <div class="results"><div><div class="caption">通过</div><div class="big">${passMark(evaluation.is_pass)}</div></div>
      <div><div class="caption">分数</div><div class="big ${scoreClass(evaluation.score_percent)}" ${scoreColor(evaluation.score_percent)}>${evaluation.score_percent ?? '❓'}</div></div></div>${gates}`;
}

strategySelect.onchange = loadDashboardSnapshot;
loadStrategyList().then(loadDashboardSnapshot);
setInterval(loadDashboardSnapshot, 60000);
</script>
</body>
</html>
