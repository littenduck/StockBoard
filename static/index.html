<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockBoard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAF9F5">
<link rel="stylesheet" href="/base.css">
<style>
  .layout { display:grid; min-height:100vh; }
  .layout > * { min-width:0; }
  aside { background:var(--surface); padding:var(--space-4) 0 var(--space-5); }
  aside > header { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); padding:0 var(--space-2) 0 var(--space-4); }
  aside > header > div { display:flex; align-items:center; }
  .status-bar { display:flex; align-items:center; gap:var(--space-2); margin:var(--space-2) var(--space-4) var(--space-4); }
  .status-bar.is-loading .status-dot { animation:pulse 1s ease-in-out infinite; }
  aside .field { width:calc(100% - var(--space-6)); margin:0 var(--space-4); }
  aside > small, .strategy-gate > small { display:block; }
  aside > small { margin:var(--space-5) var(--space-4) var(--space-2); }
  #indicator-list > .row { display:grid; grid-template-columns:1fr auto 72px; align-items:baseline; column-gap:var(--space-3); padding:var(--space-1) var(--space-2); }
  #indicator-list > .row > :nth-child(n+2) { text-align:right; }
  #symbol-list .row { display:grid; grid-template-columns:1fr 64px 64px; column-gap:var(--space-3); align-items:center; }
  #symbol-list .sparkline { grid-row:span 2; }
  #symbol-list .row > :nth-child(3) { grid-row:span 2; justify-self:end; display:flex; align-items:center; gap:var(--space-1); }
  .row[aria-disabled="true"] { color:var(--text-secondary); cursor:default; }
  #catalog-link { margin-top:var(--space-5); color:var(--text-secondary); } #catalog-link small { color:inherit; }

  main { padding:var(--space-6); max-width:880px; width:100%; justify-self:center; } main > nav { display:none; margin-bottom:var(--space-2); }
  .symbol-header { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:var(--space-3); }
  .detail-header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:var(--space-2) var(--space-6);
    padding-bottom:var(--space-5); margin-bottom:var(--space-6); border-bottom:1px solid var(--separator); }
  .detail-header > small { flex-basis:100%; text-align:right; }
  .result-row { display:flex; gap:var(--space-6); }
  .result-row > div { display:grid; grid-template-columns:auto auto; justify-content:start; align-items:baseline; }
  .result-row h1 { grid-column:1 / -1; display:flex; align-items:center; gap:var(--space-2); } .result-row small.box { margin-left:var(--space-1); }
  .strategy-gate { border-left:1px solid var(--separator); margin-left:var(--space-2); padding:0 0 var(--space-5) var(--space-4); } .strategy-gate:last-child { border-left-color:transparent; }
  .strategy-gate > header { position:relative; display:flex; align-items:flex-start; gap:var(--space-2); margin-bottom:var(--space-2); }
  .strategy-gate > header > svg { position:absolute; left:calc(-1 * (var(--space-4) + var(--space-2))); top:2px; background:var(--background); border-radius:50%; }
  .strategy-gate > header > small { margin-top:2px; white-space:nowrap; }
  .strategy-gate > header h3 { min-width:0; }
  .strategy-gate .row { display:grid; grid-template-columns:76px 1fr 72px 88px; gap:var(--space-3); align-items:baseline; margin:0; border-top:1px solid var(--separator); }
  .strategy-gate .row[data-status="not_applicable"] { color:var(--text-secondary); }
  .strategy-gate .row > :first-child { display:flex; align-items:center; gap:var(--space-1); white-space:nowrap; } .strategy-gate .row > :nth-child(3) { text-align:right; color:var(--text-secondary); } .strategy-gate .row > :last-child { justify-self:end; }
  .strategy-gate > small { margin:var(--space-2) 0 var(--space-1); }
  .strategy-line { flex-basis:100%; display:flex; align-items:center; gap:var(--space-1); } .strategy-line strong { margin-left:var(--space-1); }
  #strategy-help { width:min(520px, calc(100vw - var(--space-6))); max-height:calc(100vh - 2 * var(--space-6)); overflow-y:auto; padding:var(--space-5); color:var(--text); }
  #rule-card { position:fixed; inset:auto; margin:0; width:min(420px, calc(100vw - var(--space-4))); max-height:calc(100vh - var(--space-5)); overflow-y:auto; padding:var(--space-3) var(--space-4);
    color:var(--text); pointer-events:none; box-shadow:0 4px 16px rgb(20 20 19 / 0.12); }
  #strategy-help::backdrop { background:rgb(20 20 19 / 0.24); }   #strategy-help > header { display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-3); }
  .panel-enter { animation:panel-enter 160ms ease-out; }  @keyframes panel-enter { from { opacity:0; transform:translateY(4px); } }  @keyframes pulse { 50% { opacity:0.3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  @media (min-width:900px) {
    .layout { grid-template-columns:300px 1fr; }
    aside { position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--separator); }
  }
  @media (max-width:899px) {
    #indicator-list { display:flex; gap:var(--space-2); overflow-x:auto; padding:0 var(--space-4); }
    #indicator-list > .row { flex:none; grid-template-columns:auto auto auto; margin:0; border:1px solid var(--separator); padding:var(--space-2) var(--space-3); }
    main { padding:var(--space-5) var(--space-4); } .strategy-gate .row { grid-template-columns:76px 1fr auto auto; gap:var(--space-2); }
    .detail-header > small { text-align:left; }
    main > nav { display:block; }
  }
</style>
</head>
<body data-title-key="dashboard_title">
<div class="layout">
  <aside>
    <header><h2>StockBoard</h2>
      <div><button class="icon-button" id="language-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-language"/></svg></button>
      <button class="icon-button" id="theme-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-theme"/></svg></button></div></header>
    <div class="status-bar" id="status-bar" role="status" aria-live="polite"><span class="status-dot"></span><small></small></div>
    <small id="strategy-heading"></small>
    <span class="field"><select id="strategy-select" aria-labelledby="strategy-heading"></select><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron"/></svg></span>
    <small id="market-heading"></small>
    <ul id="indicator-list"></ul>
    <small id="symbols-heading"></small>
    <ul id="symbol-list"><li class="row placeholder"></li><li class="row placeholder"></li><li class="row placeholder"></li></ul>
    <a class="row" id="catalog-link" href="/rules"><small></small></a>
  </aside>
  <main id="strategy-panel" tabindex="-1"><small id="select-symbol-hint"></small></main>
</div>
<div id="strategy-help" class="box" popover aria-labelledby="strategy-help-title"></div>
<script src="/language.js"></script>
<script src="/rule-card.js"></script>
<script>
const STATUS_STYLE = {
  pass: { icon:'icon-pass', color:'positive' },
  fail: { icon:'icon-fail', color:'negative' },
  veto: { icon:'icon-fail', color:'negative' },
  unknown: { icon:'icon-unknown', color:'muted' },
  not_applicable: { icon:'icon-not-applicable', color:'muted' },
};
const priceFormat = new Intl.NumberFormat('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const valueFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits:2 });
const strategySelect = document.getElementById('strategy-select');
const symbolList = document.getElementById('symbol-list');
const strategyPanel = document.getElementById('strategy-panel');
strategyPanel.addEventListener('click', event => { if (event.target.closest('main > nav a')) { event.preventDefault(); document.querySelector('aside').scrollIntoView({ behavior:'smooth' }); } });
const statusBar = document.getElementById('status-bar');
let selectedSymbol = decodeURIComponent(location.hash.slice(1)) || null;
let latestSnapshot = null, statusReceivedAt = 0, connectionError = false;
let evaluationRequestNumber = 0, renderedEvaluationKey = '', maxUnknownWeightRatio = 0.2, strategyList = [], strategyById = {};
let lastEvaluation = null, lastEvaluationSymbol = null;

const escapeText = languageEscape;
const primaryText = localizedText => localizedText[languageGetActive()];
const signText = value => (value > 0 ? '+' : value < 0 ? '−' : '');
const summaryStatus = isPass => isPass === true ? 'pass' : isPass === false ? 'veto' : 'unknown';
const scoreColor = score => score == null ? 'muted' : score >= 75 ? 'positive' : score >= 60 ? 'caution' : 'negative';

function formatChange(value, unit) {
  if (value == null) return '';
  return unit === 'basis_points' ? `${signText(value)}${Math.abs(value).toFixed(1)} bp` : `${signText(value)}${Math.abs(value).toFixed(2)}%`;
}
function formatMeasuredValue(value) {
  if (value == null) return '';
  if (typeof value === 'boolean') return languageText(value ? 'yes' : 'no');
  return typeof value === 'number' ? valueFormat.format(value) : escapeText(value);
}
function formatExchangeTime(isoText, isFull) {
  return isFull ? `${isoText.slice(0, 10)} ${isoText.slice(11, 19)} ET` : `${isoText.slice(5, 7)}/${isoText.slice(8, 10)} ${isoText.slice(11, 16)} ET`;
}
function formatAge(minutes) {
  if (minutes < 1) return languageText('just_now');
  return minutes < 60 ? languageText('minutes_ago', { count:Math.floor(minutes) }) : languageText('hours_ago', { count:Math.floor(minutes / 60) });
}
function renderStatusBadge(status, showText = true) {
  const style = STATUS_STYLE[status], text = languageText(status);
  return `<span class="status-badge ${style.color}" ${showText ? '' : `aria-label="${escapeText(text)}"`}><svg class="icon" aria-hidden="true"><use href="/icons.svg#${style.icon}"/></svg>${showText ? escapeText(text) : ''}</span>`;
}
function renderSparkline(closePriceList) {
  if (!closePriceList || closePriceList.length < 2) return '<span class="sparkline"></span>';
  const lowest = Math.min(...closePriceList), range = (Math.max(...closePriceList) - lowest) || 1;
  const points = closePriceList.map((price, index) =>
    `${(index / (closePriceList.length - 1) * 64).toFixed(1)},${(18 - (price - lowest) / range * 16).toFixed(1)}`).join(' ');
  const color = closePriceList[closePriceList.length - 1] >= closePriceList[0] ? 'var(--positive)' : 'var(--negative)';
  return `<svg class="sparkline" viewBox="0 0 64 20" width="64" height="20" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function renderStatusBar() {
  const status = latestSnapshot && latestSnapshot.status;
  let text = languageText('loading_data'), color = 'muted', title = '';
  if (connectionError) { text = languageText('disconnected'); color = 'negative'; }
  else if (status && status.generated_at) {
    const ageMinutes = (Date.parse(status.server_time) - Date.parse(status.prices_as_of) + Date.now() - statusReceivedAt) / 60000;
    const shortTime = formatExchangeTime(status.prices_as_of, false);
    title = languageText('generated_at', { time:formatExchangeTime(status.prices_as_of, true) });
    if (!status.market_is_open) text = languageText('market_closed', { time:shortTime });
    else if (ageMinutes > status.stale_after_minutes) { text = languageText('data_stale', { time:shortTime }); color = 'caution'; }
    else { text = languageText('market_open', { age:formatAge(ageMinutes) }); color = 'positive'; }
  }
  statusBar.className = `status-bar ${color}` + (statusBar.classList.contains('is-loading') ? ' is-loading' : '');
  statusBar.lastElementChild.className = color;
  statusBar.title = title;
  statusBar.lastElementChild.textContent = text;
}

function renderIndicatorList(indicatorList) {
  document.getElementById('indicator-list').innerHTML = indicatorList.map(indicator => {
    const isRising = indicator.change_value > 0;
    const color = indicator.change_value ? ((isRising !== indicator.is_higher_value_risky) ? 'positive' : 'negative') : 'muted';
    return `<li class="row"><span>${escapeText(primaryText(indicator.display_name))}</span>
      <strong>${indicator.value == null ? '—' : valueFormat.format(indicator.value)}</strong>
      <small class="${color}">${formatChange(indicator.change_value, indicator.change_unit)}</small></li>`;
  }).join('');
}

function renderSymbolList(symbolCardList, failedSymbolList) {
  const focusedSymbol = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.symbol : null;
  symbolList.innerHTML = symbolCardList.map(card => {
    const isInsufficient = card.unknown_weight_ratio > maxUnknownWeightRatio;
    const score = card.score_percent == null ? '—' : Math.round(card.score_percent);
    const status = summaryStatus(card.is_pass);
    return `<li><button class="row" data-symbol="${escapeText(card.symbol)}" aria-current="${card.symbol === selectedSymbol}"
        aria-label="${escapeText(languageText('symbol_summary', { symbol:card.symbol, status:languageText(status), score }))}${isInsufficient ? ' · ' + escapeText(languageText('insufficient_data')) : ''}">
      <strong>${escapeText(card.symbol)}</strong>${renderSparkline(card.sparkline_close_price_list)}
      <span>${renderStatusBadge(status, false)}<strong class="${isInsufficient ? 'muted' : scoreColor(card.score_percent)}">${score}</strong></span>
      <small>$${priceFormat.format(card.price)} <span class="${card.change_value >= 0 ? 'positive' : 'negative'}">${formatChange(card.change_value, card.change_unit)}</span></small>
    </button></li>`;
  }).join('') + failedSymbolList.map(symbol => `<li><div class="row" aria-disabled="true"><strong>${escapeText(symbol)}</strong><span></span><span></span><small>${escapeText(languageText('unavailable'))}</small></div></li>`).join('');
  symbolList.querySelectorAll('button').forEach(button => button.onclick = () => selectSymbol(button.dataset.symbol, true));
  if (focusedSymbol) { const button = symbolList.querySelector(`[data-symbol="${focusedSymbol}"]`); if (button) button.focus(); }
}

async function loadStrategyList() {
  const data = await (await fetch('/api/v1/strategies')).json();
  strategyList = data.strategy_list;
  strategyById = Object.fromEntries(strategyList.map(strategy => [strategy.strategy_id, strategy]));
  renderStrategyOptions();
  strategySelect.value = data.default_strategy_id;
  renderStrategyHelp();
  languageApplyServerDefault(data.default_language, handleLanguageChange);
}

function renderStrategyOptions() {
  const selectedStrategyId = strategySelect.value;
  strategySelect.innerHTML = strategyList.map(strategy => `<option value="${escapeText(strategy.strategy_id)}">${escapeText(primaryText(strategy.display_name))}</option>`).join('');
  if (selectedStrategyId) strategySelect.value = selectedStrategyId;
}

function renderStaticText() {
  document.getElementById('strategy-heading').innerHTML = languageRenderText(languageLocalize('strategy'));
  document.getElementById('market-heading').innerHTML = languageRenderText(languageLocalize('market'));
  document.getElementById('symbols-heading').innerHTML = languageRenderText(languageLocalize('symbols'));
  document.querySelector('#catalog-link small').textContent = languageText('rule_catalog');
  document.getElementById('theme-button').setAttribute('aria-label', languageText('switch_theme'));
  const hint = document.getElementById('select-symbol-hint');
  if (hint) hint.textContent = languageText('select_symbol');
}

function handleLanguageChange() {
  renderStaticText();
  renderStrategyOptions();
  renderStrategyHelp();
  renderStatusBar();
  if (latestSnapshot) {
    renderIndicatorList(latestSnapshot.market_indicator_card_list);
    if (latestSnapshot.symbol_card_list.length || latestSnapshot.status.generated_at) renderSymbolList(latestSnapshot.symbol_card_list, latestSnapshot.failed_symbol_list);
  }
  if (lastEvaluation) renderStrategyTree(lastEvaluationSymbol, lastEvaluation, false);
}

function renderStrategyHelp() {
  const strategy = strategyById[strategySelect.value];
  if (!strategy) return;
  document.getElementById('strategy-help').innerHTML = `<header><h2 id="strategy-help-title">${languageRenderText(strategy.display_name)}</h2>
      <button class="icon-button" popovertarget="strategy-help" popovertargetaction="hide" aria-label="${escapeText(languageText('close'))}"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-close"/></svg></button></header>
    <h3>${languageRenderText(strategy.summary)}</h3>${languageRenderParagraphs(strategy.help_text)}
    <small>${escapeText(languageText('source', { source:primaryText(strategy.source) }))}</small>
    <p><a href="/rules">${escapeText(languageText('see_all_rules'))}</a></p>`;
}

async function loadDashboardSnapshot() {
  statusBar.classList.add('is-loading');
  try {
    const response = await fetch('/api/v1/snapshot?strategy_id=' + encodeURIComponent(strategySelect.value));
    if (!response.ok) throw new Error('HTTP ' + response.status);
    latestSnapshot = await response.json();
    statusReceivedAt = Date.now();
    connectionError = false;
    maxUnknownWeightRatio = latestSnapshot.max_unknown_weight_ratio;
    renderIndicatorList(latestSnapshot.market_indicator_card_list);
    const symbolCardList = latestSnapshot.symbol_card_list;
    if (symbolCardList.length || latestSnapshot.status.generated_at) renderSymbolList(symbolCardList, latestSnapshot.failed_symbol_list);
    if (!symbolCardList.some(card => card.symbol === selectedSymbol)) selectedSymbol = symbolCardList.length ? symbolCardList[0].symbol : null;
    if (selectedSymbol) selectSymbol(selectedSymbol, false);
  } catch (error) {
    connectionError = true;
  } finally {
    statusBar.classList.remove('is-loading');
    renderStatusBar();
  }
}

function selectSymbol(symbol, isUserAction) {
  const isNewSymbol = symbol !== selectedSymbol || isUserAction;
  selectedSymbol = symbol;
  history.replaceState(null, '', '#' + encodeURIComponent(symbol));
  symbolList.querySelectorAll('button').forEach(button => button.setAttribute('aria-current', String(button.dataset.symbol === symbol)));
  loadStrategyEvaluationForSymbol(symbol, isNewSymbol && isUserAction);
  if (isUserAction && window.innerWidth < 900) strategyPanel.scrollIntoView({ behavior:'smooth' });
}

async function loadStrategyEvaluationForSymbol(symbol, shouldAnimate) {
  const requestNumber = ++evaluationRequestNumber;
  try {
    const response = await fetch(`/api/v1/evaluations/${encodeURIComponent(strategySelect.value)}/${encodeURIComponent(symbol)}`);
    if (!response.ok || requestNumber !== evaluationRequestNumber) return;
    lastEvaluation = await response.json();
    lastEvaluationSymbol = symbol;
    renderStrategyTree(symbol, lastEvaluation, shouldAnimate);
  } catch (error) {
    if (requestNumber === evaluationRequestNumber) { connectionError = true; renderStatusBar(); }
  }
}

function calculateScoreText(ruleResultList) {
  const judgedList = ruleResultList.filter(rule => rule.status === 'pass' || rule.status === 'fail');
  const judgedWeight = judgedList.reduce((total, rule) => total + rule.weight, 0);
  const passedWeight = judgedList.filter(rule => rule.status === 'pass').reduce((total, rule) => total + rule.weight, 0);
  return judgedWeight ? Math.round(passedWeight / judgedWeight * 100) : '—';
}

function renderRuleRows(ruleResultList) {
  return ruleResultList.map(rule => `<div class="row" data-status="${rule.status}">
    <small><a href="/rules#rule-${encodeURIComponent(rule.rule_id)}" title="${escapeText(languageText('open_rule', { id:rule.rule_id }))}">${escapeText(rule.rule_id)}</a>
      <a href="/rules#rule-${encodeURIComponent(rule.rule_id)}" data-rule="${escapeText(rule.rule_id)}" aria-label="${escapeText(languageText('rule_details', { id:rule.rule_id }))}"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-help"/></svg></a></small>
    <span>${languageRenderText(rule.name)}</span><span>${formatMeasuredValue(rule.measured_value)}</span>${renderStatusBadge(rule.status)}</div>`).join('');
}

function renderStrategyTree(symbol, evaluation, shouldAnimate) {
  const evaluationKey = languageGetActive() + strategySelect.value + JSON.stringify(evaluation);
  if (evaluationKey === renderedEvaluationKey && !shouldAnimate) return;
  renderedEvaluationKey = evaluationKey;
  const isInsufficient = evaluation.unknown_weight_ratio > maxUnknownWeightRatio;
  const score = evaluation.score_percent == null ? '—' : Math.round(evaluation.score_percent);
  const strategyName = (strategyById[strategySelect.value] || {}).display_name || { en:strategySelect.value, zh:strategySelect.value };
  const symbolCard = latestSnapshot && latestSnapshot.symbol_card_list.find(card => card.symbol === symbol);
  const gates = evaluation.gate_result_list.map(gate => `<section class="strategy-gate">
      <header><svg class="icon ${STATUS_STYLE[summaryStatus(gate.is_pass)].color}" aria-hidden="true"><use href="/icons.svg#${STATUS_STYLE[summaryStatus(gate.is_pass)].icon}"/></svg>
        <h3>${languageRenderText(gate.display_name)}</h3><small class="${STATUS_STYLE[summaryStatus(gate.is_pass)].color}">${escapeText(languageText(summaryStatus(gate.is_pass)))}</small></header>
      ${gate.expiration_window_label ? `<small>${languageRenderText(languageLocalize('best_window', { label:gate.expiration_window_label, score:calculateScoreText(gate.rule_result_list) }))}</small>` : ''}
      ${renderRuleRows(gate.rule_result_list)}
      ${gate.alternative_window_result_list.map(window => `<small>${languageRenderText(languageLocalize('alternative_window', { label:window.expiration_window_label, score:calculateScoreText(window.rule_result_list) }))}</small>
        ${renderRuleRows(window.rule_result_list)}`).join('')}
    </section>`).join('');
  strategyPanel.innerHTML = `<nav><small><a href="#${encodeURIComponent(symbol)}">${escapeText(languageText('back_to_list'))}</a></small></nav>
    <header class="detail-header"><p class="strategy-line"><small>${escapeText(languageText('strategy'))}</small><strong>${languageRenderText(strategyName)}</strong>
      <button class="icon-button" popovertarget="strategy-help" aria-label="${escapeText(languageText('about_strategy', { name:primaryText(strategyName) }))}"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-help"/></svg></button></p>
      <div class="symbol-header"><h1>${escapeText(symbol)}</h1>${symbolCard ? `<small>$${priceFormat.format(symbolCard.price)}
      <span class="${symbolCard.change_value >= 0 ? 'positive' : 'negative'}">${formatChange(symbolCard.change_value, symbolCard.change_unit)}</span></small>` : ''}</div>
    <div class="result-row">
      <div><small>${languageRenderText(languageLocalize('verdict'))}</small><h1>${renderStatusBadge(summaryStatus(evaluation.is_pass))}</h1></div>
      <div><small>${languageRenderText(languageLocalize('score'))}</small>${isInsufficient ? `<small class="box">${escapeText(languageText('insufficient_data'))}</small>` : ''}
        <h1 class="${isInsufficient ? 'muted' : scoreColor(evaluation.score_percent)}">${score}</h1></div>
      </div><small>${escapeText(languageText('missing_weight', { percent:Math.round(evaluation.unknown_weight_ratio * 100) }))}</small>
    </header>${gates}`;
  if (shouldAnimate) { strategyPanel.classList.remove('panel-enter'); void strategyPanel.offsetWidth; strategyPanel.classList.add('panel-enter'); }
}

function handleSymbolListKeydown(event) {
  if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
  const buttonList = [...symbolList.querySelectorAll('button')];
  const nextButton = buttonList[buttonList.indexOf(document.activeElement) + (event.key === 'ArrowDown' ? 1 : -1)];
  if (!nextButton) return;
  event.preventDefault();
  nextButton.focus();
  selectSymbol(nextButton.dataset.symbol, true);
}

function applyTheme(themeName) {
  document.documentElement.dataset.theme = themeName;
  document.querySelector('meta[name="theme-color"]').content = themeName === 'dark' ? '#262624' : '#FAF9F5';
  try { localStorage.setItem('stockboard-theme', themeName); } catch (error) { /* storage blocked: theme lasts this visit only */ }
}

try { applyTheme(localStorage.getItem('stockboard-theme') === 'dark' ? 'dark' : 'light'); } catch (error) { applyTheme('light'); }
languageInitialize('en');
languageBindSwitch(handleLanguageChange);
renderStaticText();
renderStatusBar();
document.getElementById('theme-button').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
symbolList.addEventListener('keydown', handleSymbolListKeydown);
ruleCardBind(strategyPanel); ruleCardLoadRules();
strategySelect.onchange = () => { renderedEvaluationKey = ''; renderStrategyHelp(); loadDashboardSnapshot(); };
loadStrategyList().then(loadDashboardSnapshot, () => { connectionError = true; renderStatusBar(); });
setInterval(loadDashboardSnapshot, 60000);
setInterval(renderStatusBar, 30000);
</script>
</body>
</html>
