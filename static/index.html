<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockBoard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAF9F5">
<link rel="stylesheet" href="/base.css">
<style>

  .layout { display:grid; min-height:100vh; }
  .layout > * { min-width:0; }
  aside { background:var(--surface); padding:var(--space-4) 0 var(--space-5); }
  aside > header { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); padding:0 var(--space-4); }
  .header-controls { display:flex; align-items:center; margin-right:calc(-1 * var(--space-3)); }
  .status-bar { display:flex; align-items:center; gap:var(--space-2); margin:var(--space-2) var(--space-4) var(--space-4); }
  .status-dot { width:8px; height:8px; border-radius:50%; background:currentColor; flex:none; }
  .status-bar.is-loading .status-dot { animation:pulse 1s ease-in-out infinite; }
  select { width:calc(100% - var(--space-6)); margin:0 var(--space-4); min-height:44px; padding:var(--space-3); font:inherit; color:var(--text); background:var(--background); border:1px solid var(--separator); border-radius:8px; }
  aside h2 { margin:var(--space-5) var(--space-4) var(--space-2); }
  .indicator-item { display:grid; grid-template-columns:1fr auto 72px; align-items:baseline; column-gap:var(--space-3); padding:var(--space-1) var(--space-4); }
  .indicator-item > :nth-child(n+2) { text-align:right; }
  .symbol-item { width:100%; display:grid; grid-template-columns:1fr 64px 64px; column-gap:var(--space-3); align-items:center; padding:var(--space-2) var(--space-4); border-radius:0; transition:background-color 120ms ease; }
  .symbol-item:hover, .symbol-item[aria-current="true"] { background:var(--fill); }
  .symbol-item[aria-current="true"] { box-shadow:inset 3px 0 var(--accent); }
  .symbol-item .sparkline { grid-row:span 2; }
  .symbol-item .score { grid-row:span 2; justify-self:end; display:flex; align-items:center; gap:var(--space-1); }
  .symbol-item.is-failed { cursor:default; opacity:0.6; }
  .placeholder { height:36px; margin:var(--space-2) var(--space-4); border-radius:8px; background:var(--separator); }

  main { padding:var(--space-6); max-width:880px; width:100%; justify-self:center; }
  .back-link { display:none; padding:14px 0; margin:-14px 0 var(--space-2); color:var(--text-secondary); }
  .symbol-header { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:var(--space-3); }
  .detail-header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:var(--space-2) var(--space-6);
    padding-bottom:var(--space-5); margin-bottom:var(--space-6); border-bottom:1px solid var(--separator); }
  .detail-note { flex-basis:100%; text-align:right; }
  .result-row { display:flex; gap:var(--space-6); }
  .result-row .display { display:flex; align-items:center; gap:var(--space-2); }
  .tag { display:inline-block; padding:0 var(--space-2); border:1px solid var(--separator); border-radius:8px; }
  .strategy-gate { border-left:1px solid var(--separator); margin-left:var(--space-2); padding:0 0 var(--space-5) var(--space-4); }
  .strategy-gate:last-child { border-left-color:transparent; }
  .strategy-gate > header { display:flex; align-items:flex-start; gap:var(--space-2); margin-left:-24px; }
  .strategy-gate > header .icon { background:var(--background); border-radius:50%; margin-top:4px; }
  .strategy-gate > header > span { margin-top:4px; }
  .strategy-gate > header h3 { min-width:0; }
  .strategy-gate > header > span { white-space:nowrap; }
  .gate-note { margin-top:var(--space-1); }
  .strategy-gate > header + * { margin-top:var(--space-2); }
  .strategy-rule-row { display:grid; grid-template-columns:40px 88px 1fr auto; gap:var(--space-3); align-items:start; padding:var(--space-2) 0; border-top:1px solid var(--separator); }
  .strategy-rule-row > .caption, .strategy-rule-row .status-badge { line-height:20px; min-height:20px; }
  .strategy-rule-row.not_applicable, .strategy-rule-row.not_applicable .caption { color:var(--text-secondary); }
  .strategy-rule-row > :last-child { text-align:right; color:var(--text-secondary); }
  .window-title { margin:var(--space-4) 0 var(--space-1); }
  .rule-link { text-decoration:none; padding:12px 8px; margin:-12px -8px; } .rule-link:hover { color:var(--text); text-decoration:underline; }
  .catalog-link { display:inline-block; padding:12px 0; margin-bottom:-12px; color:var(--text); text-decoration:underline; text-underline-offset:3px; }
  .sidebar-footer-link { display:block; margin:var(--space-5) var(--space-4) 0; padding:14px 0; color:var(--text-secondary); text-decoration:none; border-top:1px solid var(--separator); }
  .sidebar-footer-link:hover { color:var(--text); }
  .strategy-line { flex-basis:100%; display:flex; align-items:center; gap:var(--space-1); margin-bottom:var(--space-1); }
  .help-button { width:44px; height:44px; margin:-12px -12px -12px -8px; display:grid; place-items:center; border-radius:50%; color:var(--text-secondary); transition:background-color 120ms ease; }
  .strategy-name { font-size:15px; line-height:20px; font-weight:600; color:var(--text); margin-left:var(--space-1); }
  .help-button:hover { background:var(--fill); color:var(--text); }
  .help-popover { width:min(520px, calc(100vw - var(--space-6))); max-height:calc(100vh - 2 * var(--space-6)); overflow-y:auto; padding:var(--space-5);
    border:1px solid var(--separator); border-radius:12px; background:var(--surface); color:var(--text); }
  .help-popover::backdrop { background:rgb(20 20 19 / 0.24); }
  .help-popover > header { display:flex; justify-content:space-between; align-items:center; margin:-8px -12px var(--space-3) 0; }
  .help-popover p + p { margin-top:var(--space-3); }
  .help-popover .summary { font-weight:600; }
  .panel-enter { animation:panel-enter 160ms ease-out; }
  @keyframes panel-enter { from { opacity:0; transform:translateY(4px); } }
  @keyframes pulse { 50% { opacity:0.3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  @media (min-width:900px) {
    .layout { grid-template-columns:300px 1fr; }
    aside { position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--separator); }
  }
  @media (max-width:899px) {
    #indicator-list { display:flex; gap:var(--space-2); overflow-x:auto; padding:0 var(--space-4); }
    #indicator-list .indicator-item { flex:none; grid-template-columns:auto auto auto; border:1px solid var(--separator); border-radius:12px; padding:var(--space-2) var(--space-3); }
    main { padding:var(--space-5) var(--space-4); }
    .detail-note { text-align:left; }
    .back-link { display:inline-block; }
  }
</style>
</head>
<body data-title-key="dashboard_title">
<div class="layout">
  <aside>
    <header><h1 class="title">StockBoard</h1>
      <div class="header-controls"><button class="icon-button" id="language-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-language"/></svg></button>
      <button class="icon-button" id="theme-button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-theme"/></svg></button></div></header>
    <div class="status-bar caption" id="status-bar" role="status" aria-live="polite"><span class="status-dot"></span><span></span></div>
    <h2 class="caption" id="strategy-heading"></h2>
    <select id="strategy-select" aria-labelledby="strategy-heading"></select>
    <h2 class="caption" id="market-heading"></h2>
    <ul id="indicator-list"></ul>
    <h2 class="caption" id="symbols-heading"></h2>
    <ul id="symbol-list"><li class="placeholder"></li><li class="placeholder"></li><li class="placeholder"></li></ul>
    <a class="sidebar-footer-link caption" id="catalog-link" href="/rules"></a>
  </aside>
  <main id="strategy-panel" tabindex="-1"><p class="caption" id="select-symbol-hint"></p></main>
</div>
<div id="strategy-help" class="help-popover" popover aria-labelledby="strategy-help-title"></div>
<script src="/language.js"></script>
<script>
const STATUS_STYLE = {
  pass: { icon:'icon-pass', color:'positive' },
  fail: { icon:'icon-fail', color:'negative' },
  veto: { icon:'icon-fail', color:'negative' },
  unknown: { icon:'icon-unknown', color:'muted' },
  not_applicable: { icon:'icon-not-applicable', color:'muted' },
};
const priceFormat = new Intl.NumberFormat('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const valueFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits:2 });
const strategySelect = document.getElementById('strategy-select');
const symbolList = document.getElementById('symbol-list');
const strategyPanel = document.getElementById('strategy-panel');
const statusBar = document.getElementById('status-bar');
let selectedSymbol = decodeURIComponent(location.hash.slice(1)) || null;
let latestSnapshot = null, statusReceivedAt = 0, connectionError = false;
let evaluationRequestNumber = 0, renderedEvaluationKey = '', maxUnknownWeightRatio = 0.2, strategyList = [], strategyById = {};
let lastEvaluation = null, lastEvaluationSymbol = null;

const escapeText = languageEscape;
const primaryText = localizedText => localizedText[languageGetActive()];
const signText = value => (value > 0 ? '+' : value < 0 ? '−' : '');
const summaryStatus = isPass => isPass === true ? 'pass' : isPass === false ? 'veto' : 'unknown';
const scoreColor = score => score == null ? 'muted' : score >= 75 ? 'positive' : score >= 60 ? 'caution' : 'negative';

function formatChange(value, unit) {
  if (value == null) return '';
  return unit === 'basis_points' ? `${signText(value)}${Math.abs(value).toFixed(1)} bp` : `${signText(value)}${Math.abs(value).toFixed(2)}%`;
}
function formatMeasuredValue(value) {
  if (value == null) return '';
  if (typeof value === 'boolean') return languageText(value ? 'yes' : 'no');
  return typeof value === 'number' ? valueFormat.format(value) : escapeText(value);
}
function formatExchangeTime(isoText, isFull) {
  return isFull ? `${isoText.slice(0, 10)} ${isoText.slice(11, 19)} ET` : `${isoText.slice(5, 7)}/${isoText.slice(8, 10)} ${isoText.slice(11, 16)} ET`;
}
function formatAge(minutes) {
  if (minutes < 1) return languageText('just_now');
  return minutes < 60 ? languageText('minutes_ago', { count:Math.floor(minutes) }) : languageText('hours_ago', { count:Math.floor(minutes / 60) });
}
function renderStatusBadge(status, showText = true) {
  const style = STATUS_STYLE[status], text = languageText(status);
  return `<span class="status-badge ${style.color}" ${showText ? '' : `aria-label="${escapeText(text)}"`}><svg class="icon" aria-hidden="true"><use href="/icons.svg#${style.icon}"/></svg>${showText ? escapeText(text) : ''}</span>`;
}
function renderSparkline(closePriceList) {
  if (!closePriceList || closePriceList.length < 2) return '<span class="sparkline"></span>';
  const lowest = Math.min(...closePriceList), range = (Math.max(...closePriceList) - lowest) || 1;
  const points = closePriceList.map((price, index) =>
    `${(index / (closePriceList.length - 1) * 64).toFixed(1)},${(18 - (price - lowest) / range * 16).toFixed(1)}`).join(' ');
  const color = closePriceList[closePriceList.length - 1] >= closePriceList[0] ? 'var(--positive)' : 'var(--negative)';
  return `<svg class="sparkline" viewBox="0 0 64 20" width="64" height="20" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function renderStatusBar() {
  const status = latestSnapshot && latestSnapshot.status;
  let text = languageText('loading_data'), color = 'muted', title = '';
  if (connectionError) { text = languageText('disconnected'); color = 'negative'; }
  else if (status && status.generated_at) {
    const ageMinutes = (Date.parse(status.server_time) - Date.parse(status.generated_at) + Date.now() - statusReceivedAt) / 60000;
    const shortTime = formatExchangeTime(status.generated_at, false);
    title = languageText('generated_at', { time:formatExchangeTime(status.generated_at, true) });
    if (!status.market_is_open) text = languageText('market_closed', { time:shortTime });
    else if (ageMinutes > status.stale_after_minutes) { text = languageText('data_stale', { time:shortTime }); color = 'caution'; }
    else { text = languageText('market_open', { age:formatAge(ageMinutes) }); color = 'positive'; }
  }
  statusBar.className = `status-bar caption ${color}` + (statusBar.classList.contains('is-loading') ? ' is-loading' : '');
  statusBar.title = title;
  statusBar.lastElementChild.textContent = text;
}

function renderIndicatorList(indicatorList) {
  document.getElementById('indicator-list').innerHTML = indicatorList.map(indicator => {
    const isRising = indicator.change_value > 0;
    const color = indicator.change_value ? ((isRising !== indicator.is_higher_value_risky) ? 'positive' : 'negative') : 'muted';
    return `<li class="indicator-item"><span>${escapeText(primaryText(indicator.display_name))}</span>
      <span class="strong">${indicator.value == null ? '—' : valueFormat.format(indicator.value)}</span>
      <span class="caption ${color}">${formatChange(indicator.change_value, indicator.change_unit)}</span></li>`;
  }).join('');
}

function renderSymbolList(symbolCardList, failedSymbolList) {
  const focusedSymbol = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.symbol : null;
  symbolList.innerHTML = symbolCardList.map(card => {
    const isInsufficient = card.unknown_weight_ratio > maxUnknownWeightRatio;
    const score = card.score_percent == null ? '—' : Math.round(card.score_percent);
    const status = summaryStatus(card.is_pass);
    return `<li><button class="symbol-item" data-symbol="${escapeText(card.symbol)}" aria-current="${card.symbol === selectedSymbol}"
        aria-label="${escapeText(languageText('symbol_summary', { symbol:card.symbol, status:languageText(status), score }))}${isInsufficient ? ' · ' + escapeText(languageText('insufficient_data')) : ''}">
      <span class="strong">${escapeText(card.symbol)}</span>${renderSparkline(card.sparkline_close_price_list)}
      <span class="score">${renderStatusBadge(status, false)}<span class="strong ${isInsufficient ? 'muted' : scoreColor(card.score_percent)}">${score}</span></span>
      <span class="caption">$${priceFormat.format(card.price)} <span class="${card.change_value >= 0 ? 'positive' : 'negative'}">${formatChange(card.change_value, card.change_unit)}</span></span>
    </button></li>`;
  }).join('') + failedSymbolList.map(symbol => `<li><div class="symbol-item is-failed" aria-disabled="true"><span class="strong">${escapeText(symbol)}</span><span></span><span></span><span class="caption">${escapeText(languageText('unavailable'))}</span></div></li>`).join('');
  symbolList.querySelectorAll('button.symbol-item').forEach(button => button.onclick = () => selectSymbol(button.dataset.symbol, true));
  if (focusedSymbol) { const button = symbolList.querySelector(`[data-symbol="${focusedSymbol}"]`); if (button) button.focus(); }
}

async function loadStrategyList() {
  const data = await (await fetch('/api/v1/strategies')).json();
  strategyList = data.strategy_list;
  strategyById = Object.fromEntries(strategyList.map(strategy => [strategy.strategy_id, strategy]));
  renderStrategyOptions();
  strategySelect.value = data.default_strategy_id;
  renderStrategyHelp();
  languageApplyServerDefault(data.default_language, handleLanguageChange);
}

function renderStrategyOptions() {
  const selectedStrategyId = strategySelect.value;
  strategySelect.innerHTML = strategyList.map(strategy => `<option value="${escapeText(strategy.strategy_id)}">${escapeText(primaryText(strategy.display_name))}</option>`).join('');
  if (selectedStrategyId) strategySelect.value = selectedStrategyId;
}

function renderStaticText() {
  document.getElementById('strategy-heading').innerHTML = languageRenderText(languageLocalize('strategy'), true);
  document.getElementById('market-heading').innerHTML = languageRenderText(languageLocalize('market'), true);
  document.getElementById('symbols-heading').innerHTML = languageRenderText(languageLocalize('symbols'), true);
  document.getElementById('catalog-link').textContent = languageText('rule_catalog');
  document.getElementById('theme-button').setAttribute('aria-label', languageText('switch_theme'));
  const hint = document.getElementById('select-symbol-hint');
  if (hint) hint.textContent = languageText('select_symbol');
}

function handleLanguageChange() {
  renderStaticText();
  renderStrategyOptions();
  renderStrategyHelp();
  renderStatusBar();
  if (latestSnapshot) {
    renderIndicatorList(latestSnapshot.market_indicator_card_list);
    if (latestSnapshot.symbol_card_list.length || latestSnapshot.status.generated_at) renderSymbolList(latestSnapshot.symbol_card_list, latestSnapshot.failed_symbol_list);
  }
  if (lastEvaluation) renderStrategyTree(lastEvaluationSymbol, lastEvaluation, false);
}

function renderStrategyHelp() {
  const strategy = strategyById[strategySelect.value];
  if (!strategy) return;
  document.getElementById('strategy-help').innerHTML = `<header><h2 class="title" id="strategy-help-title">${languageRenderText(strategy.display_name)}</h2>
      <button class="help-button" popovertarget="strategy-help" popovertargetaction="hide" aria-label="${escapeText(languageText('close'))}"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-close"/></svg></button></header>
    <p class="summary">${languageRenderText(strategy.summary)}</p>${languageRenderParagraphs(strategy.help_text)}
    <p class="caption">${escapeText(languageText('source', { source:primaryText(strategy.source) }))}</p>
    <p><a class="catalog-link" href="/rules">${escapeText(languageText('see_all_rules'))}</a></p>`;
}

async function loadDashboardSnapshot() {
  statusBar.classList.add('is-loading');
  try {
    const response = await fetch('/api/v1/snapshot?strategy_id=' + encodeURIComponent(strategySelect.value));
    if (!response.ok) throw new Error('HTTP ' + response.status);
    latestSnapshot = await response.json();
    statusReceivedAt = Date.now();
    connectionError = false;
    maxUnknownWeightRatio = latestSnapshot.max_unknown_weight_ratio;
    renderIndicatorList(latestSnapshot.market_indicator_card_list);
    const symbolCardList = latestSnapshot.symbol_card_list;
    if (symbolCardList.length || latestSnapshot.status.generated_at) renderSymbolList(symbolCardList, latestSnapshot.failed_symbol_list);
    if (!symbolCardList.some(card => card.symbol === selectedSymbol)) selectedSymbol = symbolCardList.length ? symbolCardList[0].symbol : null;
    if (selectedSymbol) selectSymbol(selectedSymbol, false);
  } catch (error) {
    connectionError = true;
  } finally {
    statusBar.classList.remove('is-loading');
    renderStatusBar();
  }
}

function selectSymbol(symbol, isUserAction) {
  const isNewSymbol = symbol !== selectedSymbol || isUserAction;
  selectedSymbol = symbol;
  history.replaceState(null, '', '#' + encodeURIComponent(symbol));
  symbolList.querySelectorAll('button.symbol-item').forEach(button => button.setAttribute('aria-current', String(button.dataset.symbol === symbol)));
  loadStrategyEvaluationForSymbol(symbol, isNewSymbol && isUserAction);
  if (isUserAction && window.innerWidth < 900) strategyPanel.scrollIntoView({ behavior:'smooth' });
}

async function loadStrategyEvaluationForSymbol(symbol, shouldAnimate) {
  const requestNumber = ++evaluationRequestNumber;
  try {
    const response = await fetch(`/api/v1/evaluations/${encodeURIComponent(strategySelect.value)}/${encodeURIComponent(symbol)}`);
    if (!response.ok || requestNumber !== evaluationRequestNumber) return;
    lastEvaluation = await response.json();
    lastEvaluationSymbol = symbol;
    renderStrategyTree(symbol, lastEvaluation, shouldAnimate);
  } catch (error) {
    if (requestNumber === evaluationRequestNumber) { connectionError = true; renderStatusBar(); }
  }
}

function calculateScoreText(ruleResultList) {
  const judgedList = ruleResultList.filter(rule => rule.status === 'pass' || rule.status === 'fail');
  const judgedWeight = judgedList.reduce((total, rule) => total + rule.weight, 0);
  const passedWeight = judgedList.filter(rule => rule.status === 'pass').reduce((total, rule) => total + rule.weight, 0);
  return judgedWeight ? Math.round(passedWeight / judgedWeight * 100) : '—';
}

function renderRuleRows(ruleResultList) {
  return ruleResultList.map(rule => `<div class="strategy-rule-row ${rule.status}">
    <a class="caption rule-link" href="/rules#rule-${encodeURIComponent(rule.rule_id)}" title="${escapeText(languageText('open_rule', { id:rule.rule_id }))}">${escapeText(rule.rule_id)}</a>${renderStatusBadge(rule.status)}
    <span>${languageRenderText(rule.description)}</span><span>${formatMeasuredValue(rule.measured_value)}</span></div>`).join('');
}

function renderStrategyTree(symbol, evaluation, shouldAnimate) {
  const evaluationKey = languageGetActive() + strategySelect.value + JSON.stringify(evaluation);
  if (evaluationKey === renderedEvaluationKey && !shouldAnimate) return;
  renderedEvaluationKey = evaluationKey;
  const isInsufficient = evaluation.unknown_weight_ratio > maxUnknownWeightRatio;
  const score = evaluation.score_percent == null ? '—' : Math.round(evaluation.score_percent);
  const strategyName = (strategyById[strategySelect.value] || {}).display_name || { en:strategySelect.value, zh:strategySelect.value };
  const symbolCard = latestSnapshot && latestSnapshot.symbol_card_list.find(card => card.symbol === symbol);
  const gates = evaluation.gate_result_list.map(gate => `<section class="strategy-gate">
      <header><svg class="icon ${STATUS_STYLE[summaryStatus(gate.is_pass)].color}" aria-hidden="true"><use href="/icons.svg#${STATUS_STYLE[summaryStatus(gate.is_pass)].icon}"/></svg>
        <h3 class="title">${languageRenderText(gate.display_name)}</h3><span class="caption ${STATUS_STYLE[summaryStatus(gate.is_pass)].color}">${escapeText(languageText(summaryStatus(gate.is_pass)))}</span></header>
      ${gate.expiration_window_label ? `<p class="caption gate-note">${languageRenderText(languageLocalize('best_window', { label:gate.expiration_window_label, score:calculateScoreText(gate.rule_result_list) }), true)}</p>` : ''}
      ${renderRuleRows(gate.rule_result_list)}
      ${gate.alternative_window_result_list.map(window => `<h4 class="caption window-title">${languageRenderText(languageLocalize('alternative_window', { label:window.expiration_window_label, score:calculateScoreText(window.rule_result_list) }), true)}</h4>
        ${renderRuleRows(window.rule_result_list)}`).join('')}
    </section>`).join('');
  strategyPanel.innerHTML = `<a class="back-link caption" href="#${encodeURIComponent(symbol)}" onclick="document.querySelector('aside').scrollIntoView({behavior:'smooth'}); return false;">${escapeText(languageText('back_to_list'))}</a>
    <header class="detail-header"><p class="strategy-line caption">${escapeText(languageText('strategy'))}<span class="strategy-name">${languageRenderText(strategyName)}</span>
      <button class="help-button" popovertarget="strategy-help" aria-label="${escapeText(languageText('about_strategy', { name:primaryText(strategyName) }))}"><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-help"/></svg></button></p>
      <div class="symbol-header"><h2 class="display">${escapeText(symbol)}</h2>${symbolCard ? `<p class="caption">$${priceFormat.format(symbolCard.price)}
      <span class="${symbolCard.change_value >= 0 ? 'positive' : 'negative'}">${formatChange(symbolCard.change_value, symbolCard.change_unit)}</span></p>` : ''}</div>
    <div class="result-row">
      <div><p class="caption">${languageRenderText(languageLocalize('verdict'), true)}</p><p class="display">${renderStatusBadge(summaryStatus(evaluation.is_pass))}</p></div>
      <div><p class="caption">${languageRenderText(languageLocalize('score'), true)}${isInsufficient ? ` <span class="tag">${escapeText(languageText('insufficient_data'))}</span>` : ''}</p>
        <p class="display ${isInsufficient ? 'muted' : scoreColor(evaluation.score_percent)}">${score}</p></div>
      </div><p class="caption detail-note">${escapeText(languageText('missing_weight', { percent:Math.round(evaluation.unknown_weight_ratio * 100) }))}</p>
    </header>${gates}`;
  if (shouldAnimate) { strategyPanel.classList.remove('panel-enter'); void strategyPanel.offsetWidth; strategyPanel.classList.add('panel-enter'); }
}

function handleSymbolListKeydown(event) {
  if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
  const buttonList = [...symbolList.querySelectorAll('button.symbol-item')];
  const nextButton = buttonList[buttonList.indexOf(document.activeElement) + (event.key === 'ArrowDown' ? 1 : -1)];
  if (!nextButton) return;
  event.preventDefault();
  nextButton.focus();
  selectSymbol(nextButton.dataset.symbol, true);
}

function applyTheme(themeName) {
  document.documentElement.dataset.theme = themeName;
  document.querySelector('meta[name="theme-color"]').content = themeName === 'dark' ? '#262624' : '#FAF9F5';
  try { localStorage.setItem('stockboard-theme', themeName); } catch (error) { /* storage blocked: theme lasts this visit only */ }
}

try { applyTheme(localStorage.getItem('stockboard-theme') === 'dark' ? 'dark' : 'light'); } catch (error) { applyTheme('light'); }
languageInitialize('en');
languageBindSwitch(handleLanguageChange);
renderStaticText();
renderStatusBar();
document.getElementById('theme-button').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
symbolList.addEventListener('keydown', handleSymbolListKeydown);
strategySelect.onchange = () => { renderedEvaluationKey = ''; renderStrategyHelp(); loadDashboardSnapshot(); };
loadStrategyList().then(loadDashboardSnapshot, () => { connectionError = true; renderStatusBar(); });
setInterval(loadDashboardSnapshot, 60000);
setInterval(renderStatusBar, 30000);
</script>
</body>
</html>
