strategy_id: momentum_breakout
display_name: {en: "Momentum breakout (52-week high)", zh: "动量突破（52 周新高）"}
source: {en: "Common 52-week-high breakout and price momentum rules; thresholds are common rules of thumb", zh: "常见的 52 周新高突破与价格动量规则（强者恒强），阈值为常用经验值"}
thresholds: {max_unknown_weight_ratio: 0.20}
summary:
  en: "Find strong stocks making new highs: within 5% of the 52-week high, up more than 10% over 6 months, on higher volume."
  zh: "找正在创新高的强势股：价格离 52 周高点不到 5%，过去 6 个月涨幅超过 10%，并且放量。"
help:
  en: |
    Momentum strategies rest on a long-observed effect: stocks that did well over the past months tend to keep outperforming for a while. A stock near its 52-week high has no trapped sellers overhead and breaks out more easily.

    The core condition is a price within 5% of the 52-week high; it is the veto rule. On top of that, a 6-month gain above 10% confirms real momentum, volume at 1.5 times the 20-day average shows money behind the move, the 50-day above the 200-day average shows a rising medium-term trend, and RSI(14) below 80 avoids chasing an extreme.

    Breakouts fail more often when the market backdrop is weak (SPX below its 200-day average, VIX in panic).

    The risk is a fast drop after a failed breakout; real trades usually use a stop, for example exiting when the price falls back below the breakout level. This page screens only; it gives no exit signals. Not investment advice.
  zh: |
    动量策略基于一个长期被观察到的现象：过去一段时间涨得好的股票，接下来一段时间往往继续跑赢。接近 52 周新高的股票上方没有套牢盘，更容易突破。

    核心条件是价格距离 52 周高点不超过 5%，这是一票否决条件。在此基础上，过去 6 个月涨幅超过 10% 说明动量真实存在，成交量达到 20 日均量的 1.5 倍说明突破有资金推动，50 日线高于 200 日线说明中期趋势向上，RSI(14) 低于 80 则避免追在极度超买的位置。

    市场环境（SPX 在 200 日线上方、VIX 不处于恐慌区）不好时，突破更容易失败。

    动量策略的风险是突破失败后回落很快，实际交易时通常配合止损，例如跌回突破位下方就离场。本页面只做筛选，不给出离场信号。不构成投资建议。
gates:
  - gate_id: gate_0_market
    display_name: {en: "GATE 0 Market", zh: "GATE 0 市场环境"}
    rules:
      - {rule_id: TRD-01, weight: 3}   # Market above 200-day
      - {rule_id: SEN-12, weight: 2}   # VIX below 25
  - gate_id: gate_1_momentum
    display_name: {en: "GATE 1 Trend and momentum", zh: "GATE 1 趋势与动量"}
    rules:
      - {rule_id: TRD-08, weight: 4}   # 6-month gain
      - {rule_id: TRD-04, weight: 4}   # Golden cross state
  - gate_id: gate_2_breakout
    display_name: {en: "GATE 2 Breakout", zh: "GATE 2 突破确认"}
    rules:
      - {rule_id: TRD-06, weight: 5, veto: true}   # Within 5% of 52-week high
      - {rule_id: TRD-10, weight: 3}   # Volume surge
      - {rule_id: TRD-19, weight: 2}   # RSI(14) below 80
