strategy_id: sell_put_four_in_one
display_name: {en: "Sell Put 4-in-1", zh: "Sell Put 四合一"}
source: {en: "Notion: Sell Put 4-in-1 decision skill + stock option scorecard (gates 0-2 only)", zh: "Notion: Sell Put 四合一决策Skill + 个股期权评分卡 (gates 0-2 only)"}
thresholds: {max_unknown_weight_ratio: 0.20}
summary:
  en: "Sell a cash-secured Put: when the macro backdrop is safe and the stock is sound, sell an out-of-the-money Put with 30-45 days left and a Delta near 0.25 to collect the premium."
  zh: "卖出现金担保看跌期权（Cash-Secured Put）：在宏观环境安全、标的质量好时，卖出 30-45 天、Delta 约 0.25 的虚值 Put 收取权利金。"
help:
  en: |
    This is an option-selling strategy: you sell a Put and collect the premium. If the stock ends above the strike, you keep the whole premium; if it falls below, you buy 100 shares at the strike, so only pick stocks you are willing to hold.

    It merges four sources (Notion "Sell Put 4-in-1 decision skill"): #1 the five-layer framework handles the macro and sentiment switch; #2 the CSP parameters handle Delta, days to expiration and return; #5 the Wheel cycle; #6 wheel stock selection and tail risk.

    Order of evaluation: GATE 0 macro and sentiment (rates, credit spread, VIX, market trend) → GATE 1 stock screen (no earnings before expiration, 52-week position, 200-day average) → GATE 2 contract (in each expiration window, take the out-of-the-money Put with Delta closest to 0.25, then check Delta, DTE, annualized return and whether IV is above realized volatility).

    A veto rule (currently EVT-01, no earnings before expiration) forces a fail when it fails. Capital structure (GATE 3) and position limits (GATE 4) need account data and are not built yet.

    Option quotes are live only while the US market is open; while it is closed GATE 2 shows Unknown. Not investment advice.
  zh: |
    这是一个卖方期权策略：你卖出一张看跌期权（Put）并收取权利金。到期时股价高于行权价，权利金全部归你；跌破行权价，你以行权价买入 100 股，所以要选自己愿意长期持有的标的。

    它合并了四条来源（Notion「Sell Put 四合一决策 Skill」）：#1 五层决策框架负责宏观与情绪开关；#2 CSP 执行参数负责 Delta、到期天数和收益；#5 Wheel 循环；#6 车轮选股与尾部风险。

    评估顺序：GATE 0 宏观/情绪开关（利率、信用利差、VIX、大盘趋势）→ GATE 1 标的筛选（到期前无财报、52 周位置、200 日均线）→ GATE 2 合约选择（在每个到期窗口里选 Delta 最接近 0.25 的虚值 Put，再看 Delta、DTE、年化收益、IV 是否高于实际波动）。

    一票否决规则（目前是 EVT-01「到期前无财报」）不通过时，结果就是不通过。资金结构（GATE 3）和仓位上限（GATE 4）需要账户数据，这一版没有接入。

    期权数据只在美股开盘时有实时报价，休市时 GATE 2 显示「未知」。不构成投资建议。
# Not built yet (need account data or manual answers): GATE 3 capital structure,
# GATE 4 position limits, rules tagged ASK / PLAN, Fed / FOMC / CPI / oil rules.
# Rules are defined in config/rules.yaml; here only the id, this strategy's weight and an optional veto flag.
# A measure with several lines (VIX, Delta, DTE ...) is listed as several rules; each line the value passes adds its weight.
gates:
  - gate_id: gate_0_macro
    display_name: {en: "GATE 0 Macro and sentiment", zh: "GATE 0 宏观/情绪开关"}
    rules:
      - {rule_id: MAC-13, weight: 2}   # 10Y below 5.0%
      - {rule_id: MAC-03, weight: 2}   # 10Y below 4.5%
      - {rule_id: MAC-04, weight: 3}   # 10Y 20-day rise below 25bp
      - {rule_id: MAC-05, weight: 4}   # HY spread below 400bp
      - {rule_id: SEN-17, weight: 1}   # Fear and Greed at most 55
      - {rule_id: SEN-16, weight: 1}   # Fear and Greed below 45
      - {rule_id: SEN-10, weight: 1}   # VIX at least 12
      - {rule_id: SEN-01, weight: 2}   # VIX at least 15
      - {rule_id: TRD-01, weight: 4}   # Market above 200-day
      - {rule_id: SEN-02, weight: 3}   # VIX term structure
  - gate_id: gate_1_underlying
    display_name: {en: "GATE 1 Stock screen", zh: "GATE 1 标的筛选"}
    rules:
      - {rule_id: EVT-01, weight: 5, veto: true}   # No earnings
      - {rule_id: TRD-18, weight: 1}   # 52-week position at most 50
      - {rule_id: TRD-07, weight: 2}   # 52-week position at most 25
      - {rule_id: TRD-03, weight: 3}   # Stock above 200-day
  - gate_id: gate_2_contract
    display_name: {en: "GATE 2 Contract", zh: "GATE 2 合约选择"}
    per_expiration_window: true   # evaluated once per window in settings.yaml, best window wins
    rules:
      - {rule_id: CTR-11, weight: 3}   # Delta 0.15 to 0.30
      - {rule_id: CTR-01, weight: 1}   # Delta 0.15 to 0.20
      - {rule_id: CTR-02, weight: 4}   # DTE 30 to 45
      - {rule_id: RET-06, weight: 2}   # Annualized return at least 8%
      - {rule_id: RET-01, weight: 1}   # Annualized return at least 20%
      - {rule_id: VOL-03, weight: 4}   # IV vs realized
