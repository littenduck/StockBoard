# ------------------------------------------------------------------------------
# Symbols the dashboard follows
# ------------------------------------------------------------------------------
# The second row of the page, in the order written here. One symbol per line: a Yahoo Finance ticker, then a free-text # comment.
# Add a line to follow a symbol, remove or comment out a line to stop. US-listed only; long, 2x and 3x long funds only (no inverse funds).
# Read when the server starts: restart after a change. A changed list makes the next refresh start at once.
# Delete a symbol's folder in data/symbols/ to forget what was downloaded for it.

symbol_list:
  # ----------------------------------------------------------------------------
  # ETFs
  # ----------------------------------------------------------------------------
  # An ETF has no company figures, so its rules on earnings, margins and so on read unknown; that is normal.
  # S&P 500
  - SPY    # SPDR S&P 500 ETF
  - VOO    # Vanguard S&P 500 ETF
  - SPXL   # Direxion Daily S&P 500 Bull 3x
  - SPMO   # Invesco S&P 500 Momentum ETF

  # Nasdaq-100 and growth
  - QQQ    # Invesco QQQ
  - TQQQ   # ProShares UltraPro QQQ, 3x long
  - VGT    # Vanguard Information Technology ETF

  # Semiconductors, memory, space
