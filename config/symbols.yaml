# The symbols the dashboard follows, in the order of the second row of the page: ETFs first, then stocks, each grouped by theme
# (the # headings are only for you). One symbol per line; a comment after # is free text. Add a Yahoo Finance ticker to follow it,
# remove a line to stop. Long only: plain, 2x and 3x long funds. The file is read when the server starts, so restart the server after a change.
# An ETF has no company figures, so its rules on earnings, margins and so on read unknown; that is normal.
