strategy_id: connors_rsi_two_pullback
display_name: {en: "RSI(2) pullback (Connors)", zh: "RSI(2) 回调（Connors）"}
source: {en: "RSI(2) mean-reversion idea from Larry Connors and Cesar Alvarez, Short Term Trading Strategies That Work (2008); thresholds are common values from secondary sources", zh: "Larry Connors 与 Cesar Alvarez《Short Term Trading Strategies That Work》(2008) 中的 RSI(2) 均值回归思路，参数取二手资料的常用值"}
thresholds: {max_unknown_weight_ratio: 0.20}
summary:
  en: "Buy short-term dips inside a long-term uptrend: the close is above the 200-day average and the 2-day RSI has fallen below 10."
  zh: "在长期上升趋势里买短期超跌：收盘价在 200 日线上方，同时 2 日 RSI 跌到 10 以下。"
help:
  en: |
    This is a short-term mean-reversion strategy: stocks in an uptrend that are briefly pushed down often bounce within a few days. It uses the very sensitive 2-day RSI to find moments when the stock has fallen too far.

    The core condition is a close above the 200-day average; it is the veto rule, so you only buy inside a long-term uptrend and never catch a falling knife. On top of that, a 2-day RSI below 10 counts as oversold, below 5 is the strict tier, and a close below the 5-day average shows a short-term pullback is under way.

    The usual exit is a close back above the 5-day average, or the 2-day RSI rising above 70. Sources differ on exact thresholds; the most common values are used here.

    These signals are rare, so most of the time scores will be low; that is expected. This page screens only; it gives no exit signals. Not investment advice.
  zh: |
    这是一个短线均值回归策略：上升趋势里的股票被短暂打压后，往往会在几天内反弹。它用 2 日 RSI 这种非常敏感的指标来找「跌过头」的时刻。

    核心条件是收盘价必须高于 200 日均线，这是一票否决条件，用来保证只在长期上升趋势里买入，不去接下跌趋势里的飞刀。在此基础上，2 日 RSI 低于 10 视为超跌，低于 5 是更严格的一档；收盘价低于 5 日均线说明正处于短期回调中。

    资料里的常见离场方式是收盘价回到 5 日均线上方，或 2 日 RSI 回升到 70 以上。各资料的具体阈值不完全一致，这里用的是最常见的数值。

    这类信号出现得比较少，大部分时间分数会偏低，这是正常的。本页面只做筛选，不给出离场信号。不构成投资建议。
gates:
  - gate_id: gate_0_market
    display_name: {en: "GATE 0 Market", zh: "GATE 0 市场环境"}
    rules:
      - {rule_id: TRD-01, weight: 3}   # Market above 200-day
  - gate_id: gate_1_trend
    display_name: {en: "GATE 1 Long-term trend", zh: "GATE 1 长期趋势"}
    rules:
      - {rule_id: TRD-03, weight: 5, veto: true}   # Stock above 200-day
  - gate_id: gate_2_pullback
    display_name: {en: "GATE 2 Short-term oversold", zh: "GATE 2 短期超跌"}
    rules:
      - {rule_id: TRD-20, weight: 3}   # RSI(2) below 10
      - {rule_id: TRD-12, weight: 1}   # RSI(2) below 5
      - {rule_id: TRD-13, weight: 3}   # Below 5-day
