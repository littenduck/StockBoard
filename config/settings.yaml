# ------------------------------------------------------------------------------
# Stock Benchmark settings
# ------------------------------------------------------------------------------
# Everything the app reads at start-up. Restart the server after a change.
# Other config files: indicators.yaml (what is measured), rules.yaml (lines to test), strategies/*.yaml (weights), symbols.yaml (symbols).

# ------------------------------------------------------------------------------
# Refresh and server
# ------------------------------------------------------------------------------
# Minutes between refreshes while the US market is open. A source that is not due is not downloaded again (see fetch_every in indicators.yaml).
refresh_interval_minutes: 10
# The page marks data older than this as stale while the market is open.
stale_after_minutes: 60
# Other web origins allowed to call the API (CORS). Empty: same-origin page and native apps only.
allowed_origin_list: []
# Most requests the whole server answers per second; the rest get HTTP 429. Raise it on a bigger machine, 0 turns it off.
max_requests_per_second: 30

# ------------------------------------------------------------------------------
# The page
# ------------------------------------------------------------------------------
# Language on first visit: en or zh. A choice made in the page is remembered and wins.
default_language: en
# The strategy shown first; the id of a file in config/strategies/.
default_strategy_id: fundamentals
# First row of the page: the indicators to show, in order, by indicator_id. Their names and whether a higher value is risky are in indicators.yaml.
market_indicator_list: [I-051, I-052, I-053, I-003, I-007]  # vix_level, vxn_level, vvix_level, treasury_ten_year_yield, high_yield_credit_spread_basis_points
# The symbols of the second row of the page are in config/symbols.yaml.

# ------------------------------------------------------------------------------
# Options
# ------------------------------------------------------------------------------
# Put contracts are picked once per expiration window (days to expiration, both ends included). The first window is the standard one.
option_expiration_window_list:
  - {minimum_days: 30, maximum_days: 45}
  - {minimum_days: 14, maximum_days: 30}
  - {minimum_days: 45, maximum_days: 60}
  - {minimum_days: 60, maximum_days: 90}
# The put chosen in each window is the out-of-the-money one whose absolute Delta is closest to this.
target_absolute_delta: 0.25

# ------------------------------------------------------------------------------
# Data sources
# ------------------------------------------------------------------------------
# The IV history (I-100 IV percentile, I-101 IV against a month ago) comes from the free DoltHub database, which is slow and often times out.
# No strategy uses it yet, so it is off: those two indicators read unknown. Set true to fetch it again.
fetch_dolthub_iv_history: false

# ------------------------------------------------------------------------------
# Backtest (scripts/backtest_fundamentals.py reads these)
# ------------------------------------------------------------------------------
# Cost of one trade in basis points (1 bp = 0.01%). A monthly rebalance of the top bucket is charged this cost twice (buy and sell).
backtest_cost_basis_points_per_trade: 10
# Newey-West lags for the t-statistics: monthly returns overlap over 12 months, so 12 is the matching lag.
backtest_newey_west_lag_count: 12

# ------------------------------------------------------------------------------
# Market calendar
# ------------------------------------------------------------------------------
# Kept by hand. Add the next year before the last listed day passes.
# NYSE full-day closures. Check https://www.nyse.com/markets/hours-calendars each year.
market_holiday_list: [
  2026-01-01, 2026-01-19, 2026-02-16, 2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07, 2026-11-26, 2026-12-25,
  2027-01-01, 2027-01-18, 2027-02-15, 2027-03-26, 2027-05-31, 2027-06-18, 2027-07-05, 2027-09-06, 2027-11-25, 2027-12-24,
]
# NYSE days that close at 13:00 ET. 2027 not yet listed: add from the NYSE calendar.
market_early_close_list: [2026-11-27, 2026-12-24]

# ------------------------------------------------------------------------------
# Release calendar for the event rules (R-EVT-05 to R-EVT-07)
# ------------------------------------------------------------------------------
# Kept by hand from the official schedules: Fed federalreserve.gov/monetarypolicy/fomccalendars.htm, CPI and jobs bls.gov/schedule/news_release,
# PCE bea.gov/news/schedule. The 2027 FOMC dates are tentative until the Fed confirms them.
# An event rule reads unknown when its window reaches past this day for its event, so add the next year's dates before then.
macro_event_covered_until: {FOMC: 2027-12-31, CPI: 2027-12-31, JOBS: 2027-12-31, PCE: 2026-12-31}
# One line per release: event_name (FOMC, CPI, JOBS or PCE), event_date and, for a meeting of two days, event_end_date.
