  # EXT · Management and exit
  - rule_id: EXT-01
    rule_name: "seller_take_profit"
    description: {en: "Sellers buy the option back once half (50%) or 70% of the premium is earned, to lock in the profit and free the capital. Source: a trade plan, with prices from the option chain. It could be backtested later in a trade simulator.", zh: "卖方赚到一半（50%）或七成权利金时买回平仓，把利润落袋，释放资金。数据来源：交易计划，价格来自期权链。将来可以在交易模拟器中回测。"}
