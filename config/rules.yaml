rule_list:
  # MAC · Macro
  - rule_id: MAC-01
    rule_name: "fed_target_not_raised"
    description: {en: "Passes when the Fed has not raised its federal funds target rate (upper bound) in the last 182 days.", zh: "美联储在最近 182 天内没有上调联邦基金目标利率（上限）时通过。"}
    indicator: "I-001"
    operator: "is_true"
    legacy_id: ["A01"]
  - rule_id: MAC-02
    rule_name: "hike_not_priced"
    description: {en: "Passes when the market is not pricing a rate hike: the 6-month Treasury bill yield minus the effective federal funds rate is below 0.25 percentage points.", zh: "市场没有在定价加息时通过：6 个月国债收益率减有效联邦基金利率，低于 0.25 个百分点。"}
    indicator: "I-002"
    operator: "less_than"
    value: 0.25
    legacy_id: ["A06"]
  - rule_id: MAC-03
    rule_name: "ten_year_below_4_5pct"
    description: {en: "Passes when the 10-year Treasury yield is below 4.5%.", zh: "10 年期美债收益率低于 4.5% 时通过。"}
    indicator: "I-003"
    operator: "less_than"
    value: 4.5
    legacy_id: ["A02"]
  - rule_id: MAC-13
    rule_name: "ten_year_below_5_0pct"
    description: {en: "Passes when the 10-year Treasury yield is below 5.0%.", zh: "10 年期美债收益率低于 5.0% 时通过。"}
    indicator: "I-003"
    operator: "less_than"
    value: 5.0
    band_of: "MAC-03"
    legacy_id: ["A07"]
  - rule_id: MAC-04
    rule_name: "ten_year_20_day_rise_below_25bp"
    description: {en: "Passes when the 10-year Treasury yield has risen less than 25bp over the last 20 trading days.", zh: "10 年期国债收益率在最近 20 个交易日里的升幅小于 25bp 时通过。"}
    indicator: "I-004"
    operator: "less_than"
    value: 25
    legacy_id: ["A03"]
  - rule_id: MAC-14
    rule_name: "ten_year_20_day_rise_below_50bp"
    description: {en: "Passes when the 10-year yield has risen less than 50bp over 20 days.", zh: "10Y 收益率 20 日升幅低于 50bp 时通过。"}
    indicator: "I-004"
    operator: "less_than"
    value: 50
    band_of: "MAC-04"
    legacy_id: []
  - rule_id: MAC-05
    rule_name: "hy_spread_below_400bp"
    description: {en: "Passes when the HY credit spread is below 400bp.", zh: "HY 信用利差低于 400bp 时通过。"}
    indicator: "I-007"
    operator: "less_than"
    value: 400
    legacy_id: ["A04"]
  - rule_id: MAC-15
    rule_name: "hy_spread_below_500bp"
    description: {en: "Passes when the HY credit spread is below 500bp.", zh: "HY 信用利差低于 500bp 时通过。"}
    indicator: "I-007"
    operator: "less_than"
    value: 500
    band_of: "MAC-05"
    legacy_id: []
  - rule_id: MAC-06
    rule_name: "credit_spread_20_day_change"
    description: {en: "Passes when the HY credit spread has widened by less than 50bp over the last 20 trading days.", zh: "HY 信用利差在最近 20 个交易日里的走阔幅度小于 50bp 时通过。"}
    indicator: "I-008"
    operator: "less_than"
    value: 50
    legacy_id: ["A04"]
  - rule_id: MAC-22
    rule_name: "baa_spread_below_2_8"
    description: {en: "Passes when Moody's seasoned Baa corporate bond yield minus the 10-year Treasury yield is below 2.8 percentage points.", zh: "穆迪 Baa 级公司债收益率减 10 年期国债收益率，低于 2.8 个百分点时通过。"}
    indicator: "I-009"
    operator: "less_than"
    value: 2.8
    legacy_id: []
  - rule_id: MAC-23
    rule_name: "baa_spread_below_3_3"
    description: {en: "Passes when the Baa minus 10-year Treasury spread is below 3.3 percentage points, the 95th percentile since 1986 (measured).", zh: "Baa 减 10 年期国债利差低于 3.3 个百分点时通过，这是 1986 年以来的第 95 百分位（实测）。"}
    indicator: "I-009"
    operator: "less_than"
    value: 3.3
    band_of: "MAC-22"
    legacy_id: []
  - rule_id: MAC-07
    rule_name: "ten_year_minus_2y_above_0"
    description: {en: "Passes when the 10-year Treasury yield is above the 2-year yield, meaning the yield curve is not inverted.", zh: "10 年期国债收益率高于 2 年期，即收益率曲线没有倒挂时通过。"}
    indicator: "I-005"
    operator: "greater_than"
    value: 0
  - rule_id: MAC-17
    rule_name: "ten_year_minus_3m_above_0"
    description: {en: "Passes when the 10-year Treasury yield is above the 3-month yield.", zh: "10 年期国债收益率高于 3 个月期时通过。"}
    indicator: "I-006"
    operator: "greater_than"
    value: 0
    legacy_id: []
  - rule_id: MAC-08
    rule_name: "cpi_below_3pct"
    description: {en: "Passes when CPI (Consumer Price Index) inflation is below 3.0% year over year.", zh: "CPI（消费者物价指数）同比低于 3.0% 时通过。"}
    indicator: "I-010"
    operator: "less_than"
    value: 3.0
  - rule_id: MAC-18
    rule_name: "core_pce_below_2_5pct"
    description: {en: "Passes when core PCE (Personal Consumption Expenditures price index excluding food and energy, the Fed's preferred gauge) inflation is below 2.5% year over year.", zh: "核心 PCE（剔除食品和能源的个人消费支出物价指数，美联储偏好的指标）同比低于 2.5% 时通过。"}
    indicator: "I-011"
    operator: "less_than"
    value: 2.5
    legacy_id: []
  - rule_id: MAC-09
    rule_name: "sahm_rule_below_0_5"
    description: {en: "Passes when the Sahm rule recession indicator is below 0.5.", zh: "Sahm 衰退指标低于 0.5 时通过。"}
    indicator: "I-012"
    operator: "less_than"
    value: 0.5
  - rule_id: MAC-19
    rule_name: "jobless_claims_below_300k"
    description: {en: "Passes when the 4-week average of initial jobless claims (weekly new unemployment filings) is below 300,000.", zh: "初请失业金人数（每周新增失业申请）的 4 周均值低于 30 万时通过。"}
    indicator: "I-013"
    operator: "less_than"
    value: 300000
    legacy_id: []
  - rule_id: MAC-20
    rule_name: "activity_index_above_minus_0_7"
    description: {en: "Passes when the 3-month average of the CFNAI (Chicago Fed National Activity Index, a broad gauge of US economic activity) is above -0.7, the level the Chicago Fed links to recession risk (from its documentation, not verified here).", zh: "CFNAI（芝加哥联储全国活动指数，衡量美国经济整体活动）的 3 个月均值高于 -0.7 时通过，芝加哥联储把这个水平与衰退风险联系起来（来自其文档，这里没有验证）。"}
    indicator: "I-014"
    operator: "greater_than"
    value: -0.7
    legacy_id: []
  - rule_id: MAC-10
    rule_name: "dollar_20_day_rise_below_2pct"
    description: {en: "Passes when the US dollar index (DXY) rose less than 2% over the last 20 trading days.", zh: "美元指数（DXY）最近 20 个交易日涨幅小于 2% 时通过。"}
    indicator: "I-015"
    operator: "less_than"
    value: 2
  - rule_id: MAC-11
    rule_name: "wti_below_usd_100"
    description: {en: "Passes when WTI crude oil (West Texas Intermediate, the US oil benchmark) is below $100 a barrel.", zh: "WTI 原油（西德州中质原油，美国原油基准）低于每桶 $100 时通过。"}
    indicator: "I-016"
    operator: "less_than"
    value: 100
    legacy_id: ["Z12"]
  - rule_id: MAC-16
    rule_name: "wti_1_month_rise_below_15pct"
    description: {en: "Passes when the one-month rise in WTI crude oil is below 15%.", zh: "WTI 原油月涨幅低于 15% 时通过。"}
    indicator: "I-017"
    operator: "less_than"
    value: 15
    legacy_id: ["Z12"]
  - rule_id: MAC-12
    rule_name: "m2_growing"
    description: {en: "Passes when M2 (a broad measure of money in the economy) is higher than a year ago.", zh: "M2（广义货币供应）比一年前高时通过。"}
    indicator: "I-018"
    operator: "greater_than"
    value: 0
  - rule_id: MAC-21
    rule_name: "fed_assets_not_shrinking"
    description: {en: "Passes when the Fed's total assets did not fall over the last 13 weeks, meaning its balance sheet is not shrinking.", zh: "美联储总资产在最近 13 周没有下降，即资产负债表没有缩小时通过。"}
    indicator: "I-019"
    operator: "greater_or_equal"
    value: 0
    legacy_id: []
  # IND · Industry
  - rule_id: IND-01
    rule_name: "sector_beats_spy"
    description: {en: "Passes when the sector ETF of the stock's industry beat SPY over the last 126 trading days.", zh: "该股所属行业的 ETF 在最近 126 个交易日跑赢 SPY 时通过。"}
    indicator: "I-020"
    operator: "greater_than"
    value: 0
  - rule_id: IND-02
    rule_name: "industry_estimates_rising"
    description: {en: "Passes when the median 4-week change of next-year EPS (earnings per share) estimates across the industry's S&P 500 stocks is above 0.", zh: "该行业的标普 500 成分股，下一年 EPS（每股收益）预期的 4 周变化中位数大于 0 时通过。"}
    indicator: "I-021"
    operator: "greater_than"
    value: 0
    note: {en: "Difficulty 5, not planned yet: it needs the next-year EPS estimates of every stock in the sector, hundreds of requests per refresh.", zh: "难度 5，暂不实现：需要抓取行业内每只股票的下一年 EPS 预期，每次刷新要几百次请求。"}
  # QUA · Company quality
  - rule_id: QUA-01
    rule_name: "profitable"
    description: {en: "Passes when the company made a profit over the last 12 months (EPS, earnings per share, TTM, trailing twelve months, above 0).", zh: "公司最近 12 个月赚钱（EPS，每股收益，TTM 即过去十二个月，大于 0）时通过。"}
    indicator: "I-022"
    operator: "greater_than"
    value: 0
    legacy_id: ["F01"]
  - rule_id: QUA-02
    rule_name: "revenue_growth"
    description: {en: "Passes when revenue is higher than a year earlier.", zh: "营收比去年同期增长时通过。"}
    indicator: "I-023"
    operator: "greater_than"
    value: 0
    legacy_id: ["F01"]
  - rule_id: QUA-03
    rule_name: "revenue_3_year_growth"
    description: {en: "Passes when the 3-year CAGR (compound annual growth rate) of revenue is at least 10%.", zh: "营收的 3 年 CAGR（复合年增长率）不低于 10% 时通过。"}
    indicator: "I-024"
    operator: "greater_or_equal"
    value: 10
  - rule_id: QUA-13
    rule_name: "eps_3_year_growth"
    description: {en: "Passes when the 3-year CAGR of EPS (earnings per share) is at least 10%.", zh: "EPS（每股收益）的 3 年 CAGR 不低于 10% 时通过。"}
    indicator: "I-025"
    operator: "greater_or_equal"
    value: 10
    legacy_id: []
  - rule_id: QUA-04
    rule_name: "roic_at_least_15pct"
    description: {en: "Passes when ROIC (return on invested capital: operating profit after 21% tax, divided by debt plus equity minus cash) is at least 15%.", zh: "ROIC（投入资本回报率：扣除 21% 税后的营业利润，除以债务加权益减现金）不低于 15% 时通过。"}
    indicator: "I-026"
    operator: "greater_or_equal"
    value: 15
  - rule_id: QUA-14
    rule_name: "roe_at_least_15pct"
    description: {en: "Passes when ROE (return on equity) is at least 15%.", zh: "ROE（股本回报率）不低于 15% 时通过。"}
    indicator: "I-027"
    operator: "greater_or_equal"
    value: 15
    legacy_id: []
  - rule_id: QUA-05
    rule_name: "gross_margin_at_least_40pct"
    description: {en: "Passes when the gross margin is at least 40%.", zh: "毛利率不低于 40% 时通过。"}
    indicator: "I-028"
    operator: "greater_or_equal"
    value: 40
  - rule_id: QUA-06
    rule_name: "fcf_positive"
    description: {en: "Passes when TTM (trailing twelve months) FCF (free cash flow, the cash left after capital spending) is above 0.", zh: "TTM（过去十二个月）FCF（自由现金流，扣除资本开支后剩下的现金）大于 0 时通过。"}
    indicator: "I-029"
    operator: "greater_than"
    value: 0
  - rule_id: QUA-15
    rule_name: "fcf_growing"
    description: {en: "Passes when TTM free cash flow is higher than a year earlier.", zh: "TTM 自由现金流比一年前高时通过。"}
    indicator: "I-030"
    operator: "greater_than"
    value: 0
    legacy_id: []
  - rule_id: QUA-07
    rule_name: "net_debt_to_ebitda_below_2"
    description: {en: "Passes when net debt to EBITDA is below 2.", zh: "净负债/EBITDA 低于 2 时通过。"}
    indicator: "I-032"
    operator: "less_than"
    value: 2
  - rule_id: QUA-11
    rule_name: "net_debt_to_ebitda_below_4"
    description: {en: "Passes when net debt to EBITDA is below 4.", zh: "净负债/EBITDA 低于 4 时通过。"}
    indicator: "I-032"
    operator: "less_than"
    value: 4
    band_of: "QUA-07"
    legacy_id: []
  - rule_id: QUA-12
    rule_name: "interest_coverage_above_5"
    description: {en: "Passes when interest coverage (how many times operating profit covers interest payments) is above 5.", zh: "利息保障倍数（营业利润能覆盖利息支出几倍）高于 5 时通过。"}
    indicator: "I-033"
    operator: "greater_than"
    value: 5
    legacy_id: []
  - rule_id: QUA-08
    rule_name: "cash_flow_covers_profit"
    description: {en: "Passes when TTM operating cash flow divided by net income is at least 1.0.", zh: "TTM 经营现金流除以净利润不低于 1.0 时通过。"}
    indicator: "I-031"
    operator: "greater_or_equal"
    value: 1.0
  - rule_id: QUA-16
    rule_name: "cash_flow_covers_80pct_of_profit"
    description: {en: "Passes when TTM operating cash flow divided by net income is at least 0.8.", zh: "TTM 经营现金流除以净利润不低于 0.8 时通过。"}
    indicator: "I-031"
    operator: "greater_or_equal"
    value: 0.8
    band_of: "QUA-08"
    legacy_id: []
  - rule_id: QUA-09
    rule_name: "estimates_rising"
    description: {en: "Passes when the consensus next-year EPS (earnings per share) estimate is higher than four weeks ago.", zh: "下一年 EPS（每股收益）的一致预期比四周前高时通过。"}
