rule_list:
  # MAC · Macro
  - rule_id: MAC-01
    description: {en: "No Fed hike and no new hiking guidance in the last 6 months", zh: "近 6 个月 Fed 未加息且无新加息指引"}
    explanation: "美联储最近半年有没有加息或暗示要加息。加息周期里估值承压，卖 Put 的风险更大。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    legacy_id: ["A01"]
    review:
      quantifiable: "部分"
      typical_range: "加息周期＝连续上调 ≥ 25bp；指引措辞无法量化"
      latest_value: "有效联邦基金利率 3.88%；6 个月前的值同源可取，本次未算"
      source: "FRED DFF（公开 CSV，免费）"
      free_python: "部分"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-02
    description: {en: "Odds of a hike at the next FOMC < 50%", zh: "下次 FOMC 加息概率 < 50%"}
    explanation: "市场押注下次议息会议加息的概率。概率高说明利率还会往上，股市容易受压。"
    default_weight: 2
    kind: "script"
    acquisition: "ai_search"
    availability: "missing_data_source"
    legacy_id: ["A06"]
    review:
      quantifiable: "是"
      typical_range: "CME FedWatch 概率；< 50% 为常用阈值"
      latest_value: "无免费概率接口；联邦基金期货 ZQ=F 96.10 → 隐含 3.90%，对比有效利率 3.88%，无明显加息定价"
      source: "yfinance ZQ=F 只能近似，不是概率"
      free_python: "部分"
      freshness: "日更，盘中约 15 分钟延迟"
  - rule_id: MAC-03
    description: {en: "10Y yield level (< 4.5% full credit, < 5.0% half)", zh: "10Y 收益率水平（< 4.5% 满分，< 5.0% 半分）"}
    explanation: "10 年期美债收益率，是整个市场的折现率。越高，股票估值越难撑住。"
    default_weight: 4
    kind: "script"
    acquisition: "api_fetch"
    availability: "automatic"
    indicator: "treasury_ten_year_yield"
    bands: [{operator: "less_than", value: 4.5, credit: 1.0}, {operator: "less_than", value: 5.0, credit: 0.5}]
    legacy_id: ["A02", "A07"]
    review:
      quantifiable: "是"
      typical_range: "过去 20 年大致 0.5%–5.0%；> 4.5% 常被视为股市承压区（经验）"
      latest_value: "4.96%（2026-10-22）→ 落在 < 5.0 档，半分"
      source: "FRED DGS10（已接入）"
      free_python: "是"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-04
    description: {en: "10Y up < 25bp over 20 days", zh: "10Y 20 日升幅 < 25bp"}
    explanation: "10Y 收益率最近 20 天涨了多少。涨得太快，比绝对水平更容易引发股市下跌。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "automatic"
    indicator: "treasury_ten_year_yield_twenty_day_change_basis_points"
    operator: "less_than"
    value: 25
    legacy_id: ["A03"]
    review:
      quantifiable: "是"
      typical_range: "20 日 ±25bp 算明显波动，一月升 50bp 以上算快速上行（经验）"
      latest_value: "−15bp（2026-10-22）→ 通过"
      source: "FRED DGS10（已接入）"
      free_python: "是"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-05
    description: {en: "HY credit spread < 400bp", zh: "HY 信用利差 < 400bp"}
    explanation: "高收益债（垃圾债）比国债多付的利息。利差变大代表信用风险上升，通常领先于股市压力。"
    default_weight: 4
    kind: "script"
    acquisition: "api_fetch"
    availability: "automatic"
    indicator: "high_yield_credit_spread_basis_points"
    operator: "less_than"
    value: 400
    legacy_id: ["A04"]
    review:
      quantifiable: "是"
      typical_range: "长期均值约 500bp；< 350bp 偏紧，> 500bp 压力，> 800bp 危机（业界惯例）"
      latest_value: "340bp（2026-10-22）→ 通过"
      source: "FRED BAMLH0A0HYM2（已接入）；注意 FRED 现在只给约 3 年历史，做历史分位受限"
      free_python: "是"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-06
    description: {en: "HY credit spread up < 50bp over 20 days", zh: "HY 信用利差 20 日升幅 < 50bp"}
    explanation: "HY 利差最近 20 天的升幅。短期快速走阔是信用压力的早期信号。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    legacy_id: ["A04"]
    note: {en: "Split from the old A04, where this half was never built", zh: "从旧 A04 拆出，这一半此前未实现"}
    review:
      quantifiable: "是"
      typical_range: "20 日升幅 ≥ 50bp 常被当作信用压力信号（经验）"
      latest_value: "20 日 +60bp（2026-10-22）→ 不通过"
      source: "FRED BAMLH0A0HYM2（同 MAC-05，补一个指标即可）"
      free_python: "是"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-07
    description: {en: "Yield curve not inverted (10Y minus 2Y or 3M above 0)", zh: "收益率曲线未倒挂（10Y 减 2Y 或 3M 大于 0）"}
    explanation: "短期利率是否高过长期利率（倒挂）。倒挂常被当作衰退预警。"
    default_weight: 4
    kind: "script"
    acquisition: "api_fetch"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "10Y−2Y 或 10Y−3M < 0 即倒挂；倒挂常领先衰退数月到两年（经验）"
      latest_value: "10Y−2Y +0.31，10Y−3M +0.78（2026-10-23）→ 未倒挂"
      source: "FRED T10Y2Y、T10Y3M"
      free_python: "是"
      freshness: "日更，滞后约 1 个工作日"
  - rule_id: MAC-08
    description: {en: "Inflation (CPI, core PCE) level and trend", zh: "通胀（CPI、核心 PCE）的水平与趋势"}
    explanation: "物价涨得多快。通胀高会逼央行维持高利率，压制估值。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "美联储目标 2%（PCE）；CPI 同比 > 3% 偏高"
      latest_value: "CPI 同比 4.02%（2026-09），核心 PCE 同比 3.01%（2026-08）"
      source: "FRED CPIAUCSL、PCEPILFE"
      free_python: "是"
      freshness: "月更；CPI 约次月中旬，PCE 约月底，滞后 2–6 周"
  - rule_id: MAC-09
    description: {en: "Growth and jobs (PMI, unemployment, jobless claims)", zh: "增长与就业（PMI、失业率、初请）"}
    explanation: "经济增长和就业状况。就业恶化意味着企业盈利风险上升。"
    default_weight: 3
    kind: "script"
    acquisition: "api_fetch"
    availability: "not_implemented"
    review:
      quantifiable: "部分"
      typical_range: "失业率 4%–5% 常见；初请 20–25 万稳定，> 30 万恶化；Sahm 规则：失业率 3 月均值较 12 月低点升 ≥ 0.5 点（经验）"
      latest_value: "失业率 4.2%（3 个月前 4.2%）；初请 4 周均值 197,750"
      source: "FRED UNRATE、ICSA；ISM PMI 在 FRED 已下架（NAPM 返回 404）"
      free_python: "是"
      freshness: "初请周更，失业率月更"
  - rule_id: MAC-10
    description: {en: "US dollar index trend", zh: "美元指数趋势"}
    explanation: "美元走强通常收紧全球金融环境，对跨国公司盈利和风险资产不利。"
    default_weight: 2
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "美元指数 DXY 常见区间 90–110；20 日变动 ±2% 算明显（经验）"
      latest_value: "FRED 广义美元指数 121.40（20 日 +1.72%）；Yahoo DXY 101.81"
      source: "FRED DTWEXBGS；yfinance DX-Y.NYB"
      free_python: "是"
      freshness: "FRED 约滞后一周；Yahoo 日更"
  - rule_id: MAC-11
    description: {en: "WTI < $100 and up < 15% this month", zh: "WTI < $100 且月涨幅 < 15%"}
    explanation: "油价过高或涨得太快，会推高通胀、压缩消费，也容易引发市场波动。"
    default_weight: 2
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    legacy_id: ["Z12"]
    review:
      quantifiable: "是"
      typical_range: "近十年 WTI 多在 $40–$120；$100 是经验线"
      latest_value: "FRED 107.89（2026-10-20），月涨 +11.3%；期货 CL=F 103.27 → 当前高于 $100，不通过"
      source: "FRED DCOILWTICO；yfinance CL=F"
      free_python: "是"
      freshness: "日更，FRED 滞后 3–5 天"
  - rule_id: MAC-12
    description: {en: "Global liquidity trend (Fed balance sheet, M2)", zh: "全球流动性趋势（Fed 资产负债表、M2）"}
    explanation: "央行资产负债表和货币供应的变化。资金宽松对风险资产有利，收紧则相反。"
    default_weight: 2
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "Fed 资产负债表增减代表扩表或缩表；M2 同比 > 5% 算偏宽松（经验）"
      latest_value: "Fed 资产负债表 6.75 万亿美元，3 个月 +0.09%；M2 同比 +5.66%"
      source: "FRED WALCL、M2SL"
      free_python: "是"
      freshness: "WALCL 周更；M2 月更，滞后约 1.5 个月"
  # IND · Industry
  - rule_id: IND-01
    description: {en: "Industry relative strength (sector ETF against SPY)", zh: "行业相对强弱（行业 ETF 对 SPY）"}
    explanation: "这只股票所在的行业最近比大盘强还是弱。行业走强时，个股更容易跟着走强。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "行业 ETF 6 个月收益减 SPY > 0 为强"
      latest_value: "科技 XLK 比 SPY 6 个月多 +7.6 个点"
      source: "yfinance 行业 ETF（XL 系列）＋个股的 sector 字段"
      free_python: "是"
      freshness: "日更"
  - rule_id: IND-02
    description: {en: "Industry cycle and earnings revisions", zh: "行业景气周期与盈利修正"}
    explanation: "行业盈利预期是在上调还是下调，反映行业景气处在周期的哪个位置。"
    default_weight: 2
    kind: "script"
    acquisition: "ai_search"
    availability: "missing_data_source"
    review:
      quantifiable: "部分"
      typical_range: "行业盈利上修多于下修为景气"
      latest_value: "无"
      source: "只能把个股 eps_revisions 按行业自行汇总；没有免费现成的行业汇总"
      free_python: "部分"
      freshness: "日更（个股层）"
  # QUA · Company quality
  - rule_id: QUA-01
    description: {en: "Earnings are positive (EPS TTM > 0)", zh: "盈利为正（EPS TTM > 0）"}
    explanation: "公司最近 12 个月是否赚钱。亏损公司股价波动更大，卖 Put 接盘的风险更高。"
    default_weight: 4
    kind: "script"
    acquisition: "api_fetch"
    availability: "not_implemented"
    legacy_id: ["F01"]
    review:
      quantifiable: "是"
      typical_range: "TTM EPS 为正"
      latest_value: "AAPL PE(TTM) 39.88 → 盈利为正"
      source: "yfinance info；更稳的是 SEC companyfacts（免费，需 User-Agent）"
      free_python: "是"
      freshness: "季更，财报后 1–2 天"
  - rule_id: QUA-02
    description: {en: "Revenue growth year over year > 0", zh: "营收同比增长 > 0"}
    explanation: "营收是否比去年同期增长。没有增长的公司很难长期上涨。"
    default_weight: 3
    kind: "script"
    acquisition: "api_fetch"
    availability: "not_implemented"
    legacy_id: ["F01"]
    review:
      quantifiable: "是"
      typical_range: "营收同比 > 0；优质成长股 > 10%"
      latest_value: "AAPL 营收同比 +16.4%（最近一季）"
      source: "yfinance info；SEC companyfacts"
      free_python: "是"
      freshness: "季更"
  - rule_id: QUA-03
    description: {en: "Earnings and revenue 3-year growth", zh: "盈利与营收 3 年增速"}
    explanation: "盈利和营收过去三年的增长速度，看增长是否持续，而不是一次性。"
    default_weight: 3
    kind: "script"
    acquisition: "computed"
    availability: "not_implemented"
    review:
      quantifiable: "是"
      typical_range: "优质成长股 3 年复合增速 > 10%（经验）"
      latest_value: "未算（yfinance 财报表有 4 年数据）"
      source: "yfinance financials；SEC companyfacts"
      free_python: "是"
      freshness: "季更/年更"
  - rule_id: QUA-04
    description: {en: "ROIC / ROE level and stability (moat evidence)", zh: "ROIC / ROE 水平与稳定性（护城河证据）"}
    explanation: "公司用投入的资本赚钱的效率。高且长期稳定，通常说明有护城河。"
