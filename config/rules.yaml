# Rule catalog, regrouped by theme. Strategies in config/strategies/*.yaml pick rules from here and give each rule its own weight.
# Rule id = category code + two digits, for example TRD-03. Categories run from macro down to detail. Ids are never reused.
# A rule only answers one question: does the value pass this line? (pass, fail or unknown). It has no weight and no score.
# A measure with several lines (VIX, Delta, DTE ...) is split into one rule per line. The main rule carries the full description;
# the others point to it with band_of. A strategy lists the lines it wants, each with its own weight, so crossing one more line adds weight.
# legacy_id lists the old ids (A01 to Z20, plus T, R, M) that each rule replaces; old alias rules are merged away.
#
# A rule that has an indicator takes its method, quantifiable, backtestable, history_source, history_start and status from that indicator in
# config/indicators.yaml (written once there, shared by every rule that uses it, with fetch_every and max_age). The 34 rules without an indicator
# are manual and keep those fields themselves:
#   status   no_data (no stable free data: shows unknown, left out of the score; todo and built exist only on indicators)
#   method   manual: no data in the app, your own input, your trade plan or your brokerage account. A strategy may still use a manual rule;
#            it always shows unknown (❓) and is left out of the score.
#
# Every text a person reads is {en, zh}; see docs/language.md.
#
# Fields of every rule:
#   rule_id          unique id, category code plus two digits (ids are never reused)
#   name             {en, zh} short name
#   description      {en, zh} what the rule looks at, why it matters, typical values, update frequency; abbreviations are spelled out and the data source is named
#   indicator        id of the indicator in config/indicators.yaml that gives the value; absent for a manual rule
#   operator, value  the line this rule tests (less_than, less_or_equal, greater_than, greater_or_equal, between with [low, high], is_true)
#   band_of          optional: id of the main rule when this rule is another line of the same measure (display only, not used in scoring)
#   legacy_id        old ids this rule replaces
#   note             optional {en, zh} remark
#   method, quantifiable, backtestable, history_source, history_start, status   only on a manual rule; otherwise they come from the indicator

