  - rule_id: EVT-03
    name: {en: "No CPI/PCE", zh: "无 CPI/PCE"}
    description: {en: "Passes when no CPI (Consumer Price Index) or PCE (Personal Consumption Expenditures price index) inflation release falls inside the option's life, and no new position is opened on a release day. Release days move markets. Source: BLS (US Bureau of Labor Statistics) and BEA (Bureau of Economic Analysis) calendars; the BLS page blocks scripts, so an AI reads it.", zh: "期权存续期内没有 CPI（消费者物价指数）或 PCE（个人消费支出物价指数）通胀数据公布，并且不在公布日开新仓时通过。公布日市场波动较大。数据来源：BLS（美国劳工统计局）和 BEA（经济分析局）的日程；BLS 网页拦截脚本，由 AI 读取。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["F07", "Z14"]
  - rule_id: EVT-04
    name: {en: "No election", zh: "无选举日"}
    description: {en: "Passes when no election day falls inside the option's life. Uncertainty rises around elections. Source: fixed dates, entered by hand.", zh: "期权存续期内没有选举日时通过。选举前后市场不确定性上升。数据来源：日期固定，手工录入。"}
    weight: 1
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["F07"]
  - rule_id: EVT-05
    name: {en: "No jobs report", zh: "避开非农"}
    description: {en: "Do not open a new position within 1 day of the monthly jobs report (nonfarm payrolls, the number of jobs added, usually released on the first Friday of the month). Surprises cause gaps. Source: BLS schedule; the page blocks scripts, so dates are derived by rule and corrected by hand.", zh: "不在月度非农就业报告（新增非农就业人数，通常在每月第一个周五公布）前后 1 天开新仓。数据意外会引起跳空。数据来源：BLS 日程；网页拦截脚本，所以按规则推算日期再手工校正。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z13"]
  - rule_id: EVT-06
    name: {en: "No ex-dividend", zh: "无除息日"}
    description: {en: "Passes when no ex-dividend date (the first day the stock trades without its next dividend) falls inside the window. When selling covered calls, there is a risk of early assignment just before it. Source: Yahoo Finance via yfinance calendar and dividends.", zh: "窗口内没有除息日（股票不再包含下一次分红的第一天）时通过。卖 Covered Call 时，除息前有被提前行权的风险。数据来源：通过 yfinance 取 Yahoo Finance 的日历和分红记录。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z08"]
  - rule_id: EVT-07
    name: {en: "No tariff deadline", zh: "无关税截止日"}
    description: {en: "Passes when no tariff or policy deadline is close. Policy news around such dates can shock markets. Dates can be entered by hand; there is no structured feed, so an AI reads the news.", zh: "没有临近的关税或政策截止日时通过。这类日期前后的政策消息容易冲击市场。日期可以手工录入；没有结构化数据，由 AI 读新闻。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "part"
    availability: "missing_data_source"
    legacy_id: ["Z09"]
  - rule_id: EVT-08
    name: {en: "No geopolitical escalation", zh: "无地缘冲突升级"}
    description: {en: "Passes when there is no escalating geopolitical conflict, which lowers risk appetite across the market. No standard threshold; the GPR (Geopolitical Risk Index by Caldara and Iacoviello) percentile can serve as a proxy. Source: matteoiacoviello.com GPR data, an Excel file that needs the xlrd package.", zh: "没有正在升级的地缘冲突时通过。地缘冲突会拉低整个市场的风险偏好。没有标准阈值，可以用 GPR（Caldara 和 Iacoviello 编制的地缘政治风险指数）的历史分位做代理。数据来源：matteoiacoviello.com 的 GPR 数据，是 Excel 文件，需要 xlrd 包解析。"}
    weight: 2
    kind: "script"
    acquisition: "scrape"
    quantifiable: "part"
    availability: "missing_data_source"
    legacy_id: ["Z10"]
  - rule_id: EVT-09
    name: {en: "No regulation event", zh: "无监管事件"}
    description: {en: "Passes when no industry regulation or export control decision is pending; one decision can hit a whole industry at once. No numbers exist, so events must be spotted from news by an AI.", zh: "没有待决的行业监管或出口管制事件时通过。一项决定可能一次性冲击整个行业。没有数值，需要由 AI 从新闻里识别事件。"}
    weight: 3
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "no"
    availability: "missing_data_source"
    legacy_id: ["Z11"]
  - rule_id: EVT-10
    name: {en: "Industry leader earnings", zh: "同业龙头财报"}
    description: {en: "Avoid the earnings dates of the industry leader, since its report moves the whole sector. You first need to define the leader for each stock. Source: Yahoo Finance via yfinance calendar.", zh: "避开同行业龙头的财报日，因为龙头的财报会带动整个板块。需要先给每只股票定义谁是龙头。数据来源：通过 yfinance 取 Yahoo Finance 的财报日历。"}
    weight: 2
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z15"]
  - rule_id: EVT-11
    name: {en: "Customer and supplier earnings", zh: "客户与供应商财报"}
    description: {en: "Avoid the earnings dates of major customers and suppliers, which spill over to this company. The customer and supplier map has to be built by hand or by an AI; dates then come from the Yahoo Finance calendar via yfinance.", zh: "避开主要客户和供应商的财报日，这些财报会连带影响这家公司。客户和供应商关系表需要手工或由 AI 建立，日期再从 yfinance 取 Yahoo Finance 的日历。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "part"
    availability: "missing_data_source"
    legacy_id: ["Z16"]
  - rule_id: EVT-12
    name: {en: "SPMO rebalance window", zh: "SPMO 换仓窗口"}
    description: {en: "True when now is the March or September rebalance window of SPMO (the Invesco S&P 500 Momentum ETF), the time the momentum rotation strategy trades. Source: a fixed date rule.", zh: "现在处于 SPMO（景顺标普 500 动量 ETF）3 月或 9 月的换仓窗口时为真，这是动量轮动策略的交易时点。数据来源：固定的日期规则。"}
    weight: 1
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["C01"]
  - rule_id: EVT-13
    name: {en: "Expiration calendar", zh: "到期日历"}
    description: {en: "Calendar effects around option expiration: the monthly expiration is the third Friday, and quadruple witching (stock options, index options and futures all expire) falls on the third Friday of March, June, September and December. Trading and prices behave oddly then. Source: computed from the calendar.", zh: "期权到期前后的日历效应：月度到期日是每月第三个周五，四巫日（个股期权、指数期权和期货同时到期）是 3、6、9、12 月的第三个周五。这些日子的成交和价格会比较特殊。数据来源：由日历计算。"}
    weight: 1
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  # LIQ · Liquidity
  - rule_id: LIQ-01
    name: {en: "Market cap", zh: "市值"}
    description: {en: "Passes when market capitalization (share price times shares outstanding) is above $200 billion. Big companies trade freely and are less likely to be hit by extreme moves. Source: Yahoo Finance via yfinance.", zh: "市值（股价乘以总股数）超过 $2,000 亿时通过。大公司交易顺畅，不容易被极端行情冲击。数据来源：通过 yfinance 取 Yahoo Finance。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["E02"]
  - rule_id: LIQ-02
    name: {en: "Top 100", zh: "前 100 大"}
    description: {en: "Passes when the stock is among the 100 largest by market value or by trading value. Needs the S&P 500 or Nasdaq-100 member list and a market cap for each. Source: Yahoo Finance via yfinance.", zh: "股票属于市值或成交额最大的前 100 只时通过。需要标普 500 或纳指 100 的成分股名单和每只股票的市值。数据来源：通过 yfinance 取 Yahoo Finance。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["D01"]
  - rule_id: LIQ-03
    name: {en: "Daily trading value", zh: "日均成交额"}
    description: {en: "Average money traded in the stock per day (average volume times price). The more active it is, the easier it is to get in and out. Above about $50 million to $100 million a day is enough for an option seller. Source: Yahoo Finance via yfinance.", zh: "这只股票平均每天成交多少钱（平均成交量乘以价格）。越活跃，进出越容易。对期权卖方来说，每天超过约 $5,000 万到 $1 亿通常够用。数据来源：通过 yfinance 取 Yahoo Finance。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: LIQ-04
    name: {en: "Bid-ask spread", zh: "买卖价差"}
    description: {en: "Passes when the bid-ask spread (the gap between the best buy and sell quotes) is at most 5% of the mid price (the average of the two). A wide spread means a high real trading cost. For cheap options also check the dollar gap. Source: Yahoo Finance option chain via yfinance; bid and ask are often 0 when the market is closed.", zh: "买卖价差（最优买价与卖价的差距）不超过中间价（两者的平均）的 5% 时通过。价差越大，实际成交成本越高；便宜的期权还要看绝对金额的差距。数据来源：通过 yfinance 取 Yahoo Finance 的期权链；休市时买价和卖价常为 0。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z06"]
  - rule_id: LIQ-05
    name: {en: "Open interest and volume", zh: "持仓量与成交量"}
    description: {en: "Passes when open interest (contracts still open) is at least 500 and the day's volume at least 100. Thinly traded contracts are hard to open and close. Source: Yahoo Finance option chain via yfinance; open interest updates once a day, volume builds up during trading.", zh: "未平仓量（仍未了结的合约数）至少 500，且当日成交量至少 100 时通过。成交稀少的合约很难开仓和平仓。数据来源：通过 yfinance 取 Yahoo Finance 的期权链；未平仓量每天更新一次，成交量盘中累计。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z07"]
  # VOL · Volatility
  - rule_id: VOL-01
    name: {en: "IV percentile", zh: "IV 百分位"}
    description: {en: "Where today's IV (implied volatility, the volatility priced into options) sits within the past year, as a percentile. A high reading means options are expensive, which favors sellers. Needs a year of daily IV history that no free source provides, so it has to be recorded daily and builds up over a year. VIX percentile can be a stopgap.", zh: "当前 IV（隐含波动率，期权价格里包含的波动率）在过去一年中处于什么百分位。数值高说明期权偏贵，对卖方有利。需要一年的每日 IV 历史，免费数据源都没有，只能自己每天记录，攒满一年才可用。VIX 的百分位可以做临时替代。"}
    weight: 5
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "missing_data_source"
    indicator: "implied_volatility_percentile"
    bands: [{operator: "greater_or_equal", value: 70, credit: 1.0}, {operator: "greater_or_equal", value: 50, credit: 0.75}, {operator: "greater_or_equal", value: 40, credit: 0.5}]
    legacy_id: ["A12", "A13", "A14"]
  - rule_id: VOL-02
    name: {en: "IV rising", zh: "IV 抬升"}
    description: {en: "IV is higher than its recent average, meaning volatility is on the rise. Measured as VIX above its 20-day average, or IV above RV30 (realized volatility, the actual price swings over 30 days). Source: Yahoo Finance ^VIX via yfinance and the option chain.", zh: "IV 比最近的平均水平高，说明波动正在抬升。用 VIX 高于其 20 日均值，或 IV 高于 RV30（实际波动率，即过去 30 天股价的真实波动）来衡量。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VIX 和期权链。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["B01"]
  - rule_id: VOL-03
    name: {en: "IV vs realized", zh: "IV 对实际波动"}
    description: {en: "Passes when ATM (at-the-money, strike near the current price) IV for 30 to 45 days is above RV30, the 30-day realized volatility. The gap is the volatility risk premium, the extra the seller is paid. Source: Yahoo Finance option chain and prices via yfinance, already wired in. Typical values: IV above RV is the normal state.", zh: "30–45 天的 ATM（平值，行权价接近现价）IV 高于 RV30，即 30 天实际波动率时通过。两者的差就是波动率风险溢价，也就是卖方额外拿到的补偿。数据来源：通过 yfinance 取 Yahoo Finance 的期权链和价格，已接入。常见情形：IV 高于 RV 是常态。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "selected_put_implied_volatility_exceeds_realized"
    operator: "is_true"
    legacy_id: ["Z05"]
  - rule_id: VOL-04
    name: {en: "Expected move", zh: "预期波动幅度"}
    description: {en: "The move the options market expects: the 1-sigma expected move is price times IV times the square root of days to expiration over 365. Also compares IV before earnings with after, the IV crush (the sharp drop in IV after the report). Source: Yahoo Finance option chain via yfinance; the before-and-after history has to be recorded.", zh: "期权市场预期的波动幅度：1σ 预期波动 = 价格 × IV × √(到期天数 ÷ 365)。同时对比财报前后的 IV，即 IV crush（财报公布后 IV 的快速回落）。数据来源：通过 yfinance 取 Yahoo Finance 的期权链；财报前后的历史需要自己记录。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VOL-05
    name: {en: "Put skew", zh: "Put 偏斜"}
    description: {en: "Put skew: how much more expensive downside protection is than at-the-money options (IV of puts about 10% below the price minus ATM IV). A larger gap means the market fears a fall. Source: Yahoo Finance option chain via yfinance. Typical values: put skew is usually positive.", zh: "Put 偏斜：下跌保护比平值期权贵多少（价格下方约 10% 的 Put 的 IV 减去平值 IV）。差距越大，说明市场越担心下跌。数据来源：通过 yfinance 取 Yahoo Finance 的期权链。常见情形：Put 偏斜通常为正。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  # CTR · Contract selection
  - rule_id: CTR-01
    name: {en: "Delta", zh: "Delta"}
    description: {en: "Delta of the option you sell is roughly the chance it ends up in the money (gets assigned). A smaller |Delta| is safer but collects less premium. Sellers often use 0.15 to 0.30. Calculated with the Black-Scholes model from the option chain. Source: Yahoo Finance via yfinance, already wired in.", zh: "卖出期权的 Delta 近似于它最终价内（被行权）的概率。|Delta| 越小越安全，但收到的权利金也越少。卖方常用 0.15–0.30。用 Black-Scholes 模型根据期权链计算。数据来源：通过 yfinance 取 Yahoo Finance，已接入。"}
    weight: 5
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "selected_put_absolute_delta"
    bands: [{operator: "between", value: [0.15, 0.2], credit: 1.0}, {operator: "between", value: [0.15, 0.3], credit: 0.75}, {operator: "less_or_equal", value: 0.3, credit: 0.5}]
    legacy_id: ["B03", "B04", "F08"]
  - rule_id: CTR-02
    name: {en: "Days to expiration", zh: "到期天数"}
    description: {en: "Days to expiration (DTE). 30 to 45 days is a common sweet spot where time value decays quickly without the option being too short. Source: option expiration dates from Yahoo Finance via yfinance, already wired in. Typical values: 45 DTE is a common choice among options sellers (the tastytrade standard).", zh: "到期天数（DTE）。30–45 天是常见的甜区：时间价值衰减较快，又不至于太短。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日，已接入。常见情形：期权卖方常用 45 DTE（tastytrade 的标准做法）。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "selected_put_days_to_expiration"
    bands: [{operator: "between", value: [30, 45], credit: 1.0}, {operator: "between", value: [14, 45], credit: 0.5}, {operator: "greater_than", value: 30, credit: 0.5}]
    legacy_id: ["B07", "A23", "F09", "E05"]
  - rule_id: CTR-03
    name: {en: "Buyer expiration", zh: "买方到期日"}
    description: {en: "Expiration of the option you buy. Buyers prefer 60 to 90 days so time decay does not eat the premium too fast. Source: option expiration dates from Yahoo Finance via yfinance.", zh: "买方期权的到期时间。买方偏好 60–90 天，避免时间损耗太快吃掉权利金。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["D06"]
  - rule_id: CTR-04
    name: {en: "Monthly expiration", zh: "月度期权"}
    description: {en: "Whether the option is a monthly one (expires on the third Friday of the month), which usually has better liquidity than weeklies. Source: computed from the expiration date.", zh: "是不是月度期权（每月第三个周五到期），通常比周期权流动性更好。数据来源：由到期日计算。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["B08"]
  - rule_id: CTR-05
    name: {en: "Strike distance", zh: "行权价距离"}
    description: {en: "How far the strike is below the current price. The Wheel strategy often picks a strike 10% to 15% (or up to 20%) below the price, where it is happy to be assigned. Source: price from Yahoo Finance via yfinance, calculated.", zh: "行权价比现价低多少。Wheel 策略常选低于现价 10%–15%（最多 20%）的位置，也就是愿意接盘的价位。数据来源：价格通过 yfinance 取 Yahoo Finance 后计算。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["E03", "E04"]
  - rule_id: CTR-06
    name: {en: "Strike vs support", zh: "行权价对支撑位"}
    description: {en: "Passes when the strike is below the nearest support, so a drop must break support before the put is in the money. Depends on the support level in TRD-14. Source: Yahoo Finance via yfinance, calculated.", zh: "行权价低于最近的支撑位时通过，这样股价要先跌破支撑才会进入价内。依赖 TRD-14 的支撑位。数据来源：通过 yfinance 取 Yahoo Finance 后计算。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "part"
    availability: "not_implemented"
    legacy_id: ["B05"]
  - rule_id: CTR-07
    name: {en: "Round strike", zh: "整数行权价"}
    description: {en: "Passes when the strike is a round number near the target price and has high trading volume, since such contracts are easier to trade. Source: Yahoo Finance option chain via yfinance.", zh: "行权价是目标价附近的整数且成交量大时通过，这样的合约更容易成交。数据来源：通过 yfinance 取 Yahoo Finance 的期权链。"}
    weight: 1
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["D07"]
  - rule_id: CTR-08
    name: {en: "Covered Call strike", zh: "Covered Call 行权价"}
    description: {en: "Strike of the covered call (a call sold against shares you own) set about 10% above the current price. Source: price from Yahoo Finance via yfinance, calculated.", zh: "Covered Call（对自己持有的股票卖出的看涨期权）的行权价设在现价上方约 10%。数据来源：价格通过 yfinance 取 Yahoo Finance 后计算。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["E11"]
  - rule_id: CTR-09
    name: {en: "Covered Call expiration", zh: "Covered Call 到期日"}
    description: {en: "Covered call expiration, usually about 30 days. Source: option expiration dates from Yahoo Finance via yfinance.", zh: "Covered Call 的到期时间，通常选约 30 天。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["E12"]
  - rule_id: CTR-10
    name: {en: "Strike vs expected move", zh: "行权价对预期波动"}
    description: {en: "Passes when the strike is outside the 1-sigma expected move implied by options (see VOL-04), so the stock must fall further than the market expects before the put is assigned. Source: Yahoo Finance option chain via yfinance, calculated.", zh: "行权价在期权隐含的 1σ 预期波动幅度之外（见 VOL-04）时通过，也就是股价要跌得比市场预期还多才会被行权。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  # RET · Return and payoff
  - rule_id: RET-01
    name: {en: "Annualized return", zh: "年化收益"}
    description: {en: "The premium collected converted to an annual return (bid divided by strike, scaled to 365 days). Too low is not worth the risk; too high usually means high risk. Source: Yahoo Finance option chain via yfinance, already wired in; no bid when the market is closed. Typical values: 8% to 20% a year is the range used here for put sellers.", zh: "把收到的权利金换算成年化收益（买价除以行权价，折算到 365 天）。太低不值得冒风险，太高往往说明风险也高。数据来源：通过 yfinance 取 Yahoo Finance 的期权链，已接入；休市时没有买价。常见情形：这里对卖 Put 采用的范围是年化 8%–20%。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "selected_put_annualized_return_percent"
    bands: [{operator: "greater_or_equal", value: 20, credit: 1.0}, {operator: "greater_or_equal", value: 8, credit: 0.5}]
    legacy_id: ["A21", "E08", "B09"]
  - rule_id: RET-02
    name: {en: "Monthly premium", zh: "月化权利金"}
    description: {en: "The premium as a share of the strike, scaled to one month. Monthly 2% to 4% is common for put sellers. Source: Yahoo Finance option chain via yfinance, calculated.", zh: "权利金占行权价的比例，折算成每月。卖 Put 常见的月化是 2%–4%。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    indicator: "selected_put_monthly_premium_percent"
    bands: [{operator: "greater_or_equal", value: 4, credit: 1.0}, {operator: "greater_or_equal", value: 2, credit: 0.5}]
    legacy_id: ["B10", "B11", "E06", "E07"]
  - rule_id: RET-03
    name: {en: "Implied leverage", zh: "隐含杠杆"}
    description: {en: "Leverage of an option you buy: Delta times stock price divided by the premium, meaning how much stock exposure each dollar buys. Passes at 10 times or more. Source: Yahoo Finance option chain via yfinance, calculated.", zh: "买方期权的杠杆倍数：Delta × 股价 ÷ 权利金，也就是每一块钱能买到多少股票敞口。达到 10 倍或以上时通过。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["D05"]
  - rule_id: RET-04
    name: {en: "Breakeven and max loss", zh: "盈亏平衡与最大亏损"}
    description: {en: "Breakeven price (strike minus premium for a put) and maximum loss ((strike minus premium) times 100 per contract). Know the worst case before opening. Source: Yahoo Finance option chain via yfinance, calculated.", zh: "盈亏平衡价（Put 为行权价减权利金）和最大亏损（每张合约为（行权价减权利金）× 100）。开仓前先算清最坏的情况。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: RET-05
    name: {en: "Probability of profit", zh: "盈利概率"}
    description: {en: "POP (probability of profit), roughly the chance the trade makes money, often approximated as 1 minus |Delta|. Source: Yahoo Finance option chain via yfinance, calculated.", zh: "POP（盈利概率），这笔交易赚钱的大致概率，常用 1 减 |Delta| 近似。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  # POS · Position, account and portfolio
  - rule_id: POS-01
    name: {en: "Option level", zh: "期权权限"}
    description: {en: "Your brokerage account must have enough option permission: level 2 allows cash-secured puts and covered calls, level 3 allows spreads (the exact levels depend on the broker). Without it the order is rejected. Source: your brokerage account; not public data.", zh: "你的券商账户必须有足够的期权权限：2 级可以做现金担保 Put 和 Covered Call，3 级可以做价差（具体级别因券商而异）。没有权限，下单会被拒绝。数据来源：你的券商账户，不是公开数据。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["B14", "B15"]
  - rule_id: POS-02
    name: {en: "No leverage", zh: "零杠杆"}
    description: {en: "No borrowed money, and every short put is backed by enough cash (cash-secured). Source: your brokerage account.", zh: "不借钱，并且每个卖出的 Put 都有足够现金担保（现金担保）。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["A20", "F11"]
  - rule_id: POS-03
    name: {en: "Cash reserve", zh: "现金储备"}
    description: {en: "Keep at least 30% of net value in cash to handle assignment and swings. Source: your brokerage account.", zh: "账户里至少保留净值 30% 的现金，用来应对被行权和行情波动。数据来源：你的券商账户。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["A19"]
  - rule_id: POS-04
    name: {en: "Cash to cover assignment", zh: "覆盖行权的现金"}
    description: {en: "If assigned you must pay strike times 100 per contract to buy the shares, so cash must be at least that amount. Without it do not open the trade. Source: your brokerage account.", zh: "被行权时每张合约要拿出行权价 × 100 的现金买入股票，所以现金至少要有这个数。现金不够就不该开仓。数据来源：你的券商账户。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["E09", "F10"]
  - rule_id: POS-05
    name: {en: "Total put exposure", zh: "Put 总敞口"}
    description: {en: "Notional exposure (strike times 100 times contracts) of all your short puts, including the new one, must not exceed 70% of net value. It is the amount you would have to buy if everything were assigned. Source: your brokerage account.", zh: "你所有卖出的 Put（含新仓）的名义敞口（行权价 × 100 × 张数）不能超过净值的 70%。这是全部被行权时需要买入的总金额。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["A17"]
  - rule_id: POS-06
    name: {en: "Single-stock exposure", zh: "单股敞口"}
    description: {en: "Notional exposure to any one stock must stay under 35% of net value, to avoid concentration. Source: your brokerage account.", zh: "对任何一只股票的名义敞口不能超过净值的 35%，避免过度集中。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["A18"]
  - rule_id: POS-07
    name: {en: "Sector exposure", zh: "板块敞口"}
    description: {en: "One sector must not exceed 50% of total exposure, so one sector's trouble does not hurt everything. Source: your brokerage account.", zh: "同一板块的敞口不能超过总敞口的 50%，避免一个板块出事时全线受损。数据来源：你的券商账户。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["Z04"]
  - rule_id: POS-08
    name: {en: "Max loss per trade", zh: "单笔最大亏损"}
    description: {en: "The worst loss on one trade, measured to the stop, must not exceed 2% of net value. This is the most basic risk control. Source: your brokerage account.", zh: "单笔交易到止损为止的最大亏损不能超过净值的 2%，这是最基本的风控。数据来源：你的券商账户。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["Z03"]
  - rule_id: POS-09
    name: {en: "Single option size", zh: "单只期权仓位"}
    description: {en: "A single option position you buy must be at most 10% of net value, because it can go to zero. Source: your brokerage account.", zh: "你买入的单只期权仓位不能超过净值的 10%，因为它可能归零。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["D08"]
  - rule_id: POS-10
    name: {en: "Long premium total", zh: "多头权利金总额"}
    description: {en: "Total premium paid for long options must stay under 20% of net value, so many small bets cannot add up to a large loss. Source: your brokerage account.", zh: "买入期权支付的权利金总额不能超过净值的 20%，防止多笔小额亏损累计成大额亏损。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["D10"]
  - rule_id: POS-11
    name: {en: "Spread switch", zh: "改用价差"}
    description: {en: "When one leg ties up more than 20% of net value, switch to a spread (buying a farther option to cap the risk). Source: your brokerage account.", zh: "单腿占用的资金超过净值的 20% 时，改用价差（再买一张更远的期权把风险封顶）。数据来源：你的券商账户。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["B13"]
  - rule_id: POS-12
    name: {en: "Scale in", zh: "分批建仓"}
    description: {en: "Build the position in 2 or more steps instead of all at once, so you do not buy at the worst price. A trade plan item.", zh: "分 2 批或更多批建仓，不要一次买满，避免买在最差的价位。这是交易计划里的一项。"}
    weight: 2
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["D09"]
  - rule_id: POS-13
    name: {en: "Covered Call size", zh: "Covered Call 张数"}
    description: {en: "Covered call contracts must equal shares owned divided by 100, never more; otherwise the extra calls are naked (uncovered). Source: your brokerage account.", zh: "Covered Call 的张数必须等于持股数除以 100，不能多；多出的部分就成了裸卖（没有股票覆盖）。数据来源：你的券商账户。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["E13"]
  - rule_id: POS-14
    name: {en: "Portfolio Greeks", zh: "组合希腊字母"}
    description: {en: "The Greeks of the whole option book: Delta (direction), Vega (sensitivity to volatility), Theta (daily time decay) and beta-weighted Delta (everything converted to S&P 500 equivalent). Thresholds differ by person. Source: your brokerage account, or computed from positions and option chains.", zh: "整个期权组合的希腊字母：Delta（方向敞口）、Vega（对波动率的敏感度）、Theta（每日时间损耗）和 beta 加权 Delta（统一折算成标普 500 的等价敞口）。阈值因人而异。数据来源：你的券商账户，或由持仓和期权链计算。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
  - rule_id: POS-15
    name: {en: "Margin usage", zh: "保证金占用"}
    description: {en: "How much of your margin or buying power is already used. If it is too full, a market swing can force the broker to close positions. Many traders stay under half. Source: your brokerage account.", zh: "已经用掉多少保证金或购买力。用得太满，行情一波动，券商可能强制平仓。很多交易者控制在一半以内。数据来源：你的券商账户。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
  - rule_id: POS-16
    name: {en: "Correlation and stress", zh: "相关性与压力测试"}
    description: {en: "Whether your positions move together (correlation), and how much you would lose in a stress test such as a 20% drop with volatility up 50%. Thresholds differ by person. Source: your brokerage account, calculated.", zh: "你的持仓是否同涨同跌（相关性），以及压力测试下会亏多少，比如标的下跌 20% 且波动率上升 50%。阈值因人而异。数据来源：你的券商账户，自行计算。"}
    weight: 2
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
  # THS · Thesis and discipline
  - rule_id: THS-01
    name: {en: "Circle of competence", zh: "能力圈"}
    description: {en: "You can explain in plain words how the company makes money. If you cannot, stay away. Source: your own judgment.", zh: "你能用大白话说清这家公司怎么赚钱。说不清的公司不要碰。数据来源：你自己的判断。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "no"
    availability: "user_answer"
  - rule_id: THS-02
    name: {en: "Written thesis", zh: "书面逻辑"}
    description: {en: "Write down the reason before you open: why you trade and what you expect. If you cannot write it, it is probably an impulse. Source: your own notes.", zh: "开仓前把理由写下来：为什么做、预期什么。写不出来多半是冲动。数据来源：你自己的记录。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "no"
    availability: "user_answer"
  - rule_id: THS-03
    name: {en: "Willing to hold", zh: "愿意持有"}
    description: {en: "Selling a put may leave you owning the stock, so you must be willing to hold it for the long term. Source: your own answer.", zh: "卖 Put 可能让你被行权接下股票，所以你必须愿意长期持有它。数据来源：你自己的回答。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "user_answer"
    legacy_id: ["A15", "E01"]
  - rule_id: THS-04
    name: {en: "Trade purpose", zh: "交易目的"}
    description: {en: "Be clear whether the trade is to earn rent (the premium) or to buy the stock. The purpose changes how you manage it. Source: your own answer.", zh: "要清楚这笔交易是想收租金（权利金），还是想接盘买股。目的不同，处理方式也不同。数据来源：你自己的回答。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "user_answer"
    legacy_id: ["E16"]
  - rule_id: THS-05
    name: {en: "Falsification", zh: "证伪条件"}
    description: {en: "Write down what would prove you wrong, and exit when it happens instead of finding reasons afterwards. For it to be testable, state it as a price or indicator, such as a close below a moving average. Source: your own notes.", zh: "写下什么情况证明你的判断错了，发生时就认错离场，不要事后找理由。要能检验，就写成价格或指标，比如收盘跌破某条均线。数据来源：你自己的记录。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "part"
    availability: "user_answer"
  - rule_id: THS-06
    name: {en: "Sleep test", zh: "睡眠测试"}
    description: {en: "Ask whether you could still sleep if the stock fell to its 52-week low. Convert the loss into dollars and a share of net value. Source: your own answer.", zh: "问自己：股价跌到 52 周低点时，你还睡得着觉吗？把亏损换算成金额和占净值的比例。数据来源：你自己的回答。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "part"
    availability: "user_answer"
    legacy_id: ["A24"]
  - rule_id: THS-07
    name: {en: "Trade frequency", zh: "出手频率"}
    description: {en: "Passes when you made at most 2 trades in the last 30 days. Trading too often usually means chasing prices. Source: your trade records.", zh: "近 30 天出手不超过 2 次时通过。出手过于频繁通常说明在追涨杀跌。数据来源：你的成交记录。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "user_answer"
    legacy_id: ["D04"]
  # EXT · Management and exit
  - rule_id: EXT-01
    name: {en: "Seller take profit", zh: "卖方止盈"}
    description: {en: "Sellers buy the option back once half (50%) or 70% of the premium is earned, to lock in the profit and free the capital. Source: a trade plan, with prices from the option chain.", zh: "卖方赚到一半（50%）或七成权利金时买回平仓，把利润落袋，释放资金。数据来源：交易计划，价格来自期权链。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["B16", "B17"]
  - rule_id: EXT-02
    name: {en: "Buyer take profit", zh: "买方止盈"}
    description: {en: "Buyers take profit once the option is up 60% or 100%, so gains do not melt away. Source: a trade plan, with prices from the option chain.", zh: "买方在期权上涨 60% 或 100% 时止盈，避免利润回吐。数据来源：交易计划，价格来自期权链。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["D12", "D13"]
  - rule_id: EXT-03
    name: {en: "Stop loss", zh: "止损"}
    description: {en: "Close the trade when the loss reaches 2 times the premium collected. Source: a trade plan, with prices from the option chain.", zh: "亏损达到收取权利金的 2 倍时平仓离场。数据来源：交易计划，价格来自期权链。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["Z01"]
  - rule_id: EXT-04
    name: {en: "Buyer stop", zh: "买方止损"}
    description: {en: "For buyers: if the stock has reached your target but the option still loses money, time decay or falling volatility is hurting you, so exit. Source: a trade plan.", zh: "买方：正股已经到了目标位，但期权仍然亏损，说明时间损耗或波动率下降在拖累你，应该离场。数据来源：交易计划。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["D14"]
  - rule_id: EXT-05
    name: {en: "Time stop or roll", zh: "时间止损或展期"}
    description: {en: "With 21 days left, either close early or roll (close and reopen further out in time), to avoid the sharp swings near expiration. Source: a trade plan, with dates from the option chain.", zh: "剩 21 天左右时，要么提前平仓，要么展期（平掉后在更远的到期日重新开仓），避免临近到期的剧烈波动。数据来源：交易计划，日期来自期权链。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["Z02"]
  - rule_id: EXT-06
    name: {en: "Holding period", zh: "持有期"}
    description: {en: "Decide how long you will hold in advance: 3 to 10 days for buyers, at least six months for the SPMO rotation. Source: a trade plan.", zh: "事先定好持有多久：买方 3–10 天，SPMO 轮动至少半年。数据来源：交易计划。"}
    weight: 2
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["D11", "C04"]
  - rule_id: EXT-07
    name: {en: "Rebalance execution", zh: "换仓执行"}
    description: {en: "On the SPMO rebalance day, trade at the closing price so execution stays consistent. Source: a trade plan.", zh: "在 SPMO 换仓日用收盘价执行，保持执行方式一致。数据来源：交易计划。"}
    weight: 1
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["C02"]
  - rule_id: EXT-08
    name: {en: "Covered Call plan", zh: "Covered Call 计划"}
    description: {en: "Once you hold the shares, plan the covered calls in advance rather than just holding. Source: a trade plan.", zh: "持股后要提前计划卖 Covered Call，而不是被动持有。数据来源：交易计划。"}
    weight: 3
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "trade_plan"
    legacy_id: ["E10"]
  - rule_id: EXT-09
    name: {en: "Covered Call strike floor", zh: "Covered Call 行权价下限"}
    description: {en: "The covered call strike must be at or above your cost basis (what you paid for the shares), so assignment does not lock in a loss. Source: your brokerage account.", zh: "Covered Call 的行权价必须不低于你的成本价（买入股票时的成本），这样被行权不会锁定亏损。数据来源：你的券商账户。"}
    weight: 4
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "account_data"
    legacy_id: ["E14"]
  - rule_id: EXT-10
    name: {en: "Cost basis check", zh: "成本价检查"}
