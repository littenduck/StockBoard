# Rule catalog, regrouped by theme (first draft of the redesign; strategies/*.yaml still use the old ids).
# Rule id = category code + two digits, for example TRD-03. Categories run from macro down to detail.
# legacy_id lists the old ids (A01 to Z20, plus T, R, M) that each rule replaces; old alias rules are merged away.
# weight is the importance score 1 to 5 from the redesign review (5 = core or veto). Strategies may override it.
# A rule with bands gives partial credit: the first matching band wins, no match means credit 0. Credits are a first draft.
#
# availability:
#   automatic            computed from data the app already fetches
#   missing_data_source  needs data with no stable free source yet
#   account_data         needs your brokerage account
#   user_answer          needs your answer
#   trade_plan           a plan for after the trade, not a screen
#   not_implemented      computable in principle, not built yet
#
# acquisition: how the value is obtained (the hardest step wins)
#   api_fetch   automatic fetch from a stable API or CSV (FRED, yfinance)
#   scrape      harder fetch: unofficial endpoint, web page, spreadsheet or bulk file that needs parsing
#   computed    calculated from fetched prices, series or option chains (moving averages, RSI, Delta, ratios)
#   ai_search   an AI reads web pages or news and records the result with its source and date
#   manual      your own input, your trade plan, or your brokerage account
#
# Every text a person reads is {en, zh}; see docs/language.md.
#
# kind: where a rule's value comes from
#   script   the app gets the value with code (acquisition: api_fetch, scrape, computed or ai_search)
#   manual   the value would come from you, your trade plan or your brokerage account (acquisition: manual)
# A strategy may use a manual rule. The app has no data for it, so it always shows unknown (❓) and is left out of the score;
# it just stays in the strategy as a visible item.
#
# Fields of every rule:
#   rule_id          unique id, category code plus two digits (ids are never reused)
#   name             {en, zh} short name
#   description      {en, zh} what the rule looks at, why it matters, typical values, update frequency; abbreviations are spelled out and the data source is named
#   weight           importance 1 to 5 (5 = core or veto); a strategy may override it
#   kind             script or manual (see above)
#   acquisition      api_fetch, scrape, computed, ai_search or manual
#   quantifiable     yes, part or no: whether the rule can be turned into a number or a yes/no test (English only)
#   availability     automatic, not_implemented, missing_data_source, account_data, user_answer or trade_plan
#   indicator        optional: id of the indicator that gives the value
#   operator, value  optional: single threshold (less_than, less_or_equal, greater_than, greater_or_equal, between, is_true)
#   bands            optional: graded credit, first matching band wins, no match means credit 0
#   legacy_id        old ids this rule replaces
#   note             optional {en, zh} remark

