  - rule_id: SEN-02
    name: {en: "VIX term structure", zh: "VIX 期限结构"}
    description: {en: "Shape of the VIX futures curve. Contango means later months cost more, which is normal; backwardation means near months cost more, which signals strong short-term panic. Passes in contango. Source: Yahoo Finance ^VIX versus ^VIX3M (3-month VIX) via yfinance. Typical values: contango is the normal state most of the time. Updated daily. Backtest history: Cboe free data files, VIX3M_History, from 2009-09-18.", zh: "VIX 期货曲线的形状。Contango（远月更贵）是常态；Backwardation（近月更贵）说明短期恐慌很重。处于 contango 时通过。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VIX 与 ^VIX3M（3 个月 VIX）。常见情形：多数时间处于 contango。每日更新。回测历史：Cboe 免费数据文件，VIX3M_History，自 2009-09-18 起。"}
    indicator: "vix_term_structure_is_contango"
    operator: "is_true"
    legacy_id: ["Z19"]
  - rule_id: SEN-03
    name: {en: "VXN/VIX below 1.3", zh: "VXN/VIX 低于 1.3"}
    description: {en: "Passes when the VXN to VIX ratio is below 1.3. VXN (Cboe Nasdaq-100 Volatility Index) is the VIX equivalent for the Nasdaq-100, and its ratio to VIX shows whether tech is under extra stress. VXN usually sits above VIX. Source: Yahoo Finance symbol ^VXN via yfinance. Typical values: the VXN to VIX ratio is often around 1.1 to 1.3 (rule of thumb, not verified). Updated daily. Backtest history: Cboe free data files, VXN_History, from 2009-09-14.", zh: "VXN 与 VIX 的比值低于 1.3 时通过。VXN（Cboe 纳斯达克 100 波动率指数）是纳指 100 版本的 VIX，它与 VIX 的比值反映科技股是否格外紧张。VXN 通常高于 VIX。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VXN。常见情形：VXN 与 VIX 的比值常在 1.1–1.3 左右（经验，未核实）。每日更新。回测历史：Cboe 免费数据文件，VXN_History，自 2009-09-14 起。"}
    indicator: "vxn_to_vix_ratio"
    operator: "less_than"
    value: 1.3
    note: {en: "Measured since 2009: median ratio about 1.17, 80th percentile about 1.29; 1.3 sits just above that", zh: "2009 年以来实测：比值中位数约 1.17，第 80 百分位约 1.29；1.3 刚好在其上方"}
  - rule_id: SEN-04
    name: {en: "Fear and Greed below 25", zh: "恐惧贪婪低于 25"}
    description: {en: "Passes when the CNN Fear and Greed Index is below 25 (extreme fear). CNN's Fear and Greed Index, 0 to 100, combines seven market indicators (including momentum, VIX and junk bond demand). Low means fear, which some sellers treat as an opportunity. CNN bands: 0-24 extreme fear, 25-44 fear, 45-55 neutral, 56-75 greed, 76-100 extreme greed. Source: CNN's unofficial data endpoint (needs Referer and Origin headers); it may change at any time. Updated daily, close to real time. Other tiers: SEN-16, SEN-17, SEN-18. Backtest history: CNN Fear and Greed data (unofficial), fear-and-greed, from 2021-01-04.", zh: "CNN 恐惧贪婪指数低于 25（极度恐惧）时通过。CNN 的恐惧贪婪指数，0–100，由七个市场指标合成（包括动量、VIX、垃圾债需求等）。越低越恐惧，一些卖方把它当作机会。CNN 分档：0–24 极度恐惧，25–44 恐惧，45–55 中性，56–75 贪婪，76–100 极度贪婪。数据来源：CNN 的非官方数据接口（需要 Referer 和 Origin 请求头），随时可能变化。每日更新，接近实时。其他分档：SEN-16、SEN-17、SEN-18。回测历史：CNN 恐惧贪婪数据（非官方），fear-and-greed，自 2021-01-04 起。"}
    indicator: "fear_greed_index"
    operator: "less_than"
    value: 25
    legacy_id: ["D02"]
    note: {en: "Contrarian seller view. SEN-18 (above 75) points the opposite way and belongs to a bearish strategy", zh: "逆向的卖方视角。SEN-18（高于 75）方向相反，属于看空策略"}
  - rule_id: SEN-16
    name: {en: "Fear and Greed below 45", zh: "恐惧贪婪低于 45"}
    description: {en: "Passes when the CNN Fear and Greed Index is below 45 (fear or worse). One of the Fear and Greed tiers; see SEN-04 for what it measures, the source and typical values. Backtest history: CNN Fear and Greed data (unofficial), fear-and-greed, from 2021-01-04.", zh: "CNN 恐惧贪婪指数低于 45（恐惧或更低）时通过。恐惧贪婪分档之一；含义、数据来源和常见数值见 SEN-04。回测历史：CNN 恐惧贪婪数据（非官方），fear-and-greed，自 2021-01-04 起。"}
    indicator: "fear_greed_index"
    operator: "less_than"
    value: 45
    band_of: "SEN-04"
    legacy_id: ["A09", "B02"]
