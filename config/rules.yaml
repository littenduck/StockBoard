  - rule_id: QUA-10
    rule_name: "buy_ratings_above_60pct"
    description: {en: "Passes when more than 60% of the brokers that changed or repeated a rating in the last 12 months have a buy-type latest rating (Buy, Outperform or Overweight).", zh: "最近 12 个月里调整或重申过评级的券商中，最新评级是买入类（Buy、Outperform、Overweight）的占比超过 60% 时通过。"}
    indicator: "I-035"
    operator: "greater_than"
