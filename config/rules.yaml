rule_list:
  # MAC · Macro
  - rule_id: MAC-01
    name: {en: "Fed hike watch", zh: "美联储加息观察"}
    description: {en: "Passes when the Fed (the US central bank) has not raised interest rates, or signalled that it will, in the last 6 months. Rising rates push stock valuations down and make selling puts riskier. Source: FRED (Federal Reserve Economic Data, run by the St. Louis Fed), series DFF (effective federal funds rate). Guidance wording has no free structured feed. Typical values: a hiking cycle is a run of increases of 25bp or more. Updated daily.", zh: "近 6 个月美联储（美国央行）没有加息，也没有暗示要加息时通过。利率上升会压低股票估值，让卖 Put 更危险。数据来源：FRED（圣路易斯联储的经济数据库）的 DFF 序列，即有效联邦基金利率；指引措辞没有免费的结构化数据。常见情形：加息周期指连续上调 25bp 或以上。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "part"
    availability: "not_implemented"
    legacy_id: ["A01"]
  - rule_id: MAC-02
    name: {en: "FOMC hike odds", zh: "FOMC 加息概率"}
    description: {en: "Passes when the market-implied chance of a rate hike at the next FOMC (Federal Open Market Committee, the Fed committee that sets US interest rates; about 8 meetings a year) is below 50%. Higher odds mean rates may keep rising and stocks come under pressure. Source: CME FedWatch, built from fed funds futures; there is no free API, so an AI reads the page. Typical values: below 50% is the usual comfort line. Updated intraday.", zh: "下次 FOMC（联邦公开市场委员会，美联储负责定利率的委员会，每年约 8 次会议）加息的市场隐含概率低于 50% 时通过。概率越高，说明利率可能继续上行，股市容易承压。数据来源：CME FedWatch（根据联邦基金期货推算）；没有免费 API，需要 AI 读网页。常见情形：低于 50% 是常用的安心线。盘中更新。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "yes"
    availability: "missing_data_source"
    legacy_id: ["A06"]
  - rule_id: MAC-03
    name: {en: "10Y yield", zh: "10Y 收益率"}
    description: {en: "Yield on the 10-year US Treasury note, the benchmark rate the market uses to discount future earnings. The higher it is, the harder it is for stocks to hold their valuations. Source: FRED series DGS10 (10-year Treasury constant maturity rate), updated daily with about one business day of delay. Typical values: about 0.5% to 5.0% over the last 20 years; above 4.5% is often seen as pressure on stocks (rule of thumb).", zh: "10 年期美国国债收益率，是市场给未来盈利折现的基准利率。越高，股票越难守住估值。数据来源：FRED 的 DGS10 序列（10 年期国债固定期限收益率），每日更新，约滞后 1 个工作日。常见情形：过去 20 年大致在 0.5%–5.0%；高于 4.5% 常被视为对股市有压力（经验）。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "treasury_ten_year_yield"
    bands: [{operator: "less_than", value: 4.5, credit: 1.0}, {operator: "less_than", value: 5.0, credit: 0.5}]
    legacy_id: ["A02", "A07"]
  - rule_id: MAC-04
    name: {en: "10Y yield, 20-day change", zh: "10Y 收益率 20 日变动"}
    description: {en: "How much the 10-year Treasury yield has risen over the last 20 trading days, in bp (basis points; 1bp = 0.01 percentage point). Passes when the rise is under 25bp. A fast rise hurts stocks more than a high level. Source: FRED series DGS10. Typical values: ±25bp over 20 days is a clear move; a rise of 50bp or more in a month is fast (rule of thumb). Updated daily.", zh: "10 年期国债收益率最近 20 个交易日涨了多少，单位 bp（基点，1bp = 0.01 个百分点）。升幅小于 25bp 时通过。快速上行比高水平更容易让股市受伤。数据来源：FRED 的 DGS10 序列。常见情形：20 日 ±25bp 算明显波动，一个月升 50bp 以上算快速上行（经验）。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "treasury_ten_year_yield_twenty_day_change_basis_points"
    operator: "less_than"
    value: 25
    legacy_id: ["A03"]
  - rule_id: MAC-05
    name: {en: "High-yield credit spread", zh: "高收益债信用利差"}
    description: {en: "The extra yield junk bonds (HY, high-yield bonds rated below investment grade) pay over Treasuries, measured as OAS (option-adjusted spread). Passes when it is under 400bp. A widening spread signals rising credit risk and usually leads stock stress. Source: FRED series BAMLH0A0HYM2 (ICE BofA US High Yield OAS); FRED now keeps only about 3 years of history. Typical values: long-run average about 500bp; below 350bp is tight, above 500bp is stress, above 800bp is crisis (market convention). Updated daily.", zh: "高收益债（HY，评级低于投资级的债券，俗称垃圾债）比国债多付的利息，用 OAS（期权调整利差）衡量。低于 400bp 时通过。利差走阔代表信用风险上升，通常领先于股市压力。数据来源：FRED 的 BAMLH0A0HYM2 序列（ICE BofA 美国高收益债 OAS）；FRED 现在只保留约 3 年历史。常见情形：长期均值约 500bp；低于 350bp 偏紧，高于 500bp 是压力，高于 800bp 是危机（业界惯例）。每日更新。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "high_yield_credit_spread_basis_points"
    operator: "less_than"
    value: 400
    legacy_id: ["A04"]
  - rule_id: MAC-06
    name: {en: "Credit spread, 20-day change", zh: "信用利差 20 日变动"}
    description: {en: "How much the HY credit spread (see MAC-05) has widened over the last 20 trading days. Passes when the rise is under 50bp. A quick widening is an early sign of credit stress. Source: FRED series BAMLH0A0HYM2. Typical values: a rise of 50bp or more in 20 days is often read as credit stress (rule of thumb). Updated daily.", zh: "HY 信用利差（见 MAC-05）最近 20 个交易日走阔了多少。升幅小于 50bp 时通过。短期快速走阔是信用压力的早期信号。数据来源：FRED 的 BAMLH0A0HYM2 序列。常见情形：20 日升幅 50bp 以上常被当作信用压力信号（经验）。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["A04"]
    note: {en: "Split from the old A04, where this half was never built", zh: "从旧 A04 拆出，这一半此前未实现"}
  - rule_id: MAC-07
    name: {en: "Yield curve", zh: "收益率曲线"}
    description: {en: "Whether the yield curve is inverted, meaning short-term Treasury yields are above long-term ones. Passes when 10Y minus 2Y, or 10Y minus 3M, is above 0. An inverted curve is a common recession warning. Source: FRED series T10Y2Y and T10Y3M, updated daily. Typical values: below 0 means inverted; inversions have often come months to two years before recessions (rule of thumb).", zh: "收益率曲线是否倒挂，即短期国债收益率是否高于长期。10Y 减 2Y，或 10Y 减 3M 大于 0 时通过。倒挂常被当作衰退预警。数据来源：FRED 的 T10Y2Y 和 T10Y3M 序列，每日更新。常见情形：小于 0 即倒挂；倒挂常领先衰退数月到两年（经验）。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: MAC-08
    name: {en: "Inflation", zh: "通胀"}
    description: {en: "How fast prices are rising. High inflation forces the Fed to keep rates high, which holds valuations down. Measured by CPI (Consumer Price Index) and core PCE (Personal Consumption Expenditures price index, excluding food and energy, the Fed's preferred gauge), year over year. Source: FRED series CPIAUCSL and PCEPILFE, updated monthly with a lag of 2 to 6 weeks. Typical values: the Fed targets 2% inflation (PCE); CPI above 3% is high.", zh: "物价涨得多快。通胀高会迫使美联储维持高利率，压住估值。用 CPI（消费者物价指数）和核心 PCE（个人消费支出物价指数，剔除食品和能源，是美联储偏好的指标）的同比来衡量。数据来源：FRED 的 CPIAUCSL 和 PCEPILFE 序列，月更，滞后 2–6 周。常见情形：美联储的目标是 2% 通胀（PCE）；CPI 高于 3% 算偏高。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: MAC-09
    name: {en: "Growth and jobs", zh: "增长与就业"}
    description: {en: "State of growth and the job market; worsening jobs mean higher earnings risk. Uses the unemployment rate, initial jobless claims (weekly new unemployment filings) and ideally PMI (Purchasing Managers' Index, a business survey). Source: FRED series UNRATE and ICSA; ISM PMI is no longer on FRED, so PMI is missing. Typical values: unemployment of 4% to 5% is common; weekly claims of 200,000 to 250,000 are stable and above 300,000 is worsening; the Sahm rule flags a recession when the 3-month average unemployment rate rises 0.5 point above its 12-month low (rule of thumb). Claims update weekly, unemployment monthly.", zh: "经济增长和就业状况；就业恶化意味着企业盈利风险上升。用失业率、初请失业金人数（每周新增失业申请）和 PMI（采购经理人指数，一种企业调查）。数据来源：FRED 的 UNRATE 和 ICSA 序列；ISM PMI 已从 FRED 下架，所以 PMI 缺失。常见情形：失业率 4%–5% 常见；每周初请 20–25 万稳定，高于 30 万算恶化；Sahm 规则：失业率 3 个月均值比 12 个月低点升高 0.5 个点即提示衰退（经验）。初请周更，失业率月更。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "part"
    availability: "not_implemented"
  - rule_id: MAC-10
    name: {en: "US dollar", zh: "美元"}
    description: {en: "Trend of the US dollar. A stronger dollar tightens global financial conditions and hurts multinational earnings and risk assets. Source: FRED series DTWEXBGS (broad dollar index, about one week behind) or Yahoo Finance DX-Y.NYB (the DXY dollar index) via yfinance. Typical values: DXY usually trades between 90 and 110; a 20-day move of ±2% is clear (rule of thumb).", zh: "美元走势。美元走强通常收紧全球金融环境，对跨国公司盈利和风险资产不利。数据来源：FRED 的 DTWEXBGS 序列（广义美元指数，约滞后一周），或通过 yfinance 取 Yahoo Finance 的 DX-Y.NYB（DXY 美元指数）。常见情形：DXY 通常在 90–110 之间；20 日变动 ±2% 算明显（经验）。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: MAC-11
    name: {en: "Oil price", zh: "油价"}
    description: {en: "Passes when WTI crude oil (West Texas Intermediate, the US oil benchmark) is below $100 a barrel and up less than 15% over the month. Very high or fast-rising oil lifts inflation, squeezes consumers and shakes markets. Source: FRED series DCOILWTICO (a few days behind) or Yahoo Finance CL=F futures via yfinance. Typical values: over the last ten years WTI mostly traded between $40 and $120; $100 is a rule-of-thumb line.", zh: "WTI 原油（西德州中质原油，美国原油基准）低于每桶 $100，且月涨幅低于 15% 时通过。油价过高或涨得太快会推高通胀、挤压消费、扰动市场。数据来源：FRED 的 DCOILWTICO 序列（滞后几天），或通过 yfinance 取 Yahoo Finance 的 CL=F 期货。常见情形：近十年 WTI 多在 $40–$120；$100 是经验线。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["Z12"]
  - rule_id: MAC-12
    name: {en: "Global liquidity", zh: "全球流动性"}
    description: {en: "Direction of money supply and the central bank balance sheet. Easy liquidity helps risk assets; tightening hurts them. Uses the Fed's total assets and M2 (a broad measure of money in the economy). Source: FRED series WALCL (weekly) and M2SL (monthly, about 1.5 months behind). Typical values: M2 growth above 5% a year is fairly loose (rule of thumb).", zh: "货币供应和央行资产负债表的变化方向。流动性宽松对风险资产有利，收紧则不利。用美联储总资产和 M2（广义货币供应）。数据来源：FRED 的 WALCL（周更）和 M2SL（月更，滞后约 1.5 个月）序列。常见情形：M2 年增速高于 5% 算偏宽松（经验）。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  # IND · Industry
  - rule_id: IND-01
    name: {en: "Industry strength", zh: "行业强弱"}
    description: {en: "Whether the stock's industry has recently beaten or lagged the market. A strong industry lifts its stocks. Compares the sector ETF (a fund that holds one industry, such as XLK for technology) with SPY (the fund tracking the S&P 500) over 6 months. Source: Yahoo Finance via yfinance. Typical values: a sector ETF that beats SPY over 6 months is seen as strong. Updated daily.", zh: "这只股票所在的行业最近跑赢还是跑输大盘。行业走强会带动个股。用行业 ETF（持有某个行业的基金，比如科技的 XLK）与 SPY（跟踪标普 500 的基金）比较 6 个月的涨幅。数据来源：通过 yfinance 取 Yahoo Finance。常见情形：行业 ETF 的 6 个月收益跑赢 SPY 算强。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: IND-02
    name: {en: "Industry cycle", zh: "行业景气"}
    description: {en: "Whether analysts are raising or cutting earnings forecasts for the industry, which shows where it sits in its cycle. No free aggregated feed exists; an AI reads industry reports and news, or individual stock revisions are summed by industry. Typical values: more upgrades than downgrades means a healthy cycle. Updated daily at stock level.", zh: "分析师是在上调还是下调整个行业的盈利预期，反映行业处在周期的什么位置。没有免费的行业汇总数据；由 AI 读行业报告和新闻，或把个股的预期修正按行业汇总。常见情形：上调多于下调说明景气健康。个股层面每日更新。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "part"
    availability: "missing_data_source"
  # QUA · Company quality
  - rule_id: QUA-01
    name: {en: "Profitable", zh: "盈利为正"}
    description: {en: "Passes when the company made a profit over the last 12 months (EPS, earnings per share, TTM, trailing twelve months, above 0). Loss-making companies swing more and are riskier to be assigned. Source: Yahoo Finance via yfinance; SEC EDGAR company facts are a steadier alternative. Updated each quarter.", zh: "公司最近 12 个月赚钱（EPS，每股收益，TTM 即过去十二个月，大于 0）时通过。亏损公司波动更大，被行权接盘的风险更高。数据来源：通过 yfinance 取 Yahoo Finance；更稳定的替代是 SEC EDGAR（美国证监会披露系统）的公司数据。按季更新。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["F01"]
  - rule_id: QUA-02
    name: {en: "Revenue growth", zh: "营收增长"}
    description: {en: "Passes when revenue is higher than a year earlier. A company with no sales growth rarely rises for long. Source: Yahoo Finance via yfinance (latest quarter, year over year); SEC EDGAR as a backup. Updated each quarter.", zh: "营收比去年同期增长时通过。没有销售增长的公司很难长期上涨。数据来源：通过 yfinance 取 Yahoo Finance（最近一季同比）；备选是 SEC EDGAR。按季更新。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["F01"]
  - rule_id: QUA-03
    name: {en: "3-year growth", zh: "3 年增速"}
    description: {en: "Growth of earnings and revenue over the last 3 years, to check growth is lasting and not a one-off. Calculated as a CAGR (compound annual growth rate) from annual statements. Source: Yahoo Finance via yfinance financial statements (4 years), or SEC EDGAR. Typical values: a 3-year CAGR above 10% is typical of quality growth stocks (rule of thumb). Updated each quarter or year.", zh: "盈利和营收过去 3 年的增长速度，用来确认增长是持续的，而不是一次性的。用年报算 CAGR（复合年增长率）。数据来源：通过 yfinance 取 Yahoo Finance 的财务报表（4 年），或 SEC EDGAR。常见情形：优质成长股的 3 年 CAGR 常在 10% 以上（经验）。按季或按年更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-04
    name: {en: "Return on capital", zh: "资本回报率"}
    description: {en: "How efficiently the company turns invested money into profit: ROIC (return on invested capital) and ROE (return on equity). High and steady for many years usually signals a moat, a lasting competitive advantage. ROE can be distorted by buybacks, so ROIC is calculated from the statements. Source: Yahoo Finance via yfinance, or SEC EDGAR. Typical values: ROIC above 15% and steady for 5 to 10 years is a common moat test (Buffett-style rule of thumb); ROE above 15%. Updated each quarter.", zh: "公司把投入的钱变成利润的效率：ROIC（投入资本回报率）和 ROE（股本回报率）。长期又高又稳，通常说明有护城河，即持久的竞争优势。ROE 会被回购扭曲，所以 ROIC 要用财报自己算。数据来源：通过 yfinance 取 Yahoo Finance，或 SEC EDGAR。常见情形：ROIC 高于 15% 并稳定 5–10 年，是常见的护城河检验（巴菲特式经验）；ROE 高于 15%。按季更新。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-05
    name: {en: "Gross margin", zh: "毛利率"}
    description: {en: "Share of each sales dollar left after the direct cost of goods (gross margin). A high and stable margin means pricing power. Source: Yahoo Finance via yfinance; SEC EDGAR for history. Updated each quarter. Typical values: above 40% is common for brands and software; retail below 30% is normal.", zh: "每一块钱销售额扣掉直接成本后剩下的比例（毛利率）。毛利率高且稳定，说明有定价权。数据来源：通过 yfinance 取 Yahoo Finance；历史用 SEC EDGAR。按季更新。常见情形：品牌和软件公司常高于 40%；零售低于 30% 属正常。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-06
    name: {en: "Free cash flow", zh: "自由现金流"}
    description: {en: "Cash left after capital spending: FCF (free cash flow). It is harder to fake than accounting profit and is central to value investing. Passes when FCF is positive and growing. Source: Yahoo Finance via yfinance cash flow statement. Updated each quarter.", zh: "扣掉资本开支后剩下的现金：FCF（自由现金流）。它比账面利润更难造假，是价值投资的核心。FCF 为正且在增长时通过。数据来源：通过 yfinance 取 Yahoo Finance 的现金流量表。按季更新。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-07
    name: {en: "Balance sheet", zh: "财务稳健"}
    description: {en: "Whether debt is manageable relative to earnings: net debt (debt minus cash) divided by EBITDA (earnings before interest, taxes, depreciation and amortization), plus interest coverage (how many times profit covers interest). Heavily indebted companies get into trouble in recessions or when rates rise. Source: Yahoo Finance via yfinance balance sheet. Typical values: net debt to EBITDA below 2 is sound and above 4 is high; interest coverage above 5 is comfortable (rule of thumb).", zh: "债务相对盈利是否可控：净债务（债务减现金）除以 EBITDA（息税折旧摊销前利润），以及利息覆盖倍数（利润能覆盖利息几倍）。负债过高的公司在衰退或加息时容易出问题。数据来源：通过 yfinance 取 Yahoo Finance 的资产负债表。常见情形：净债务/EBITDA 低于 2 稳健，高于 4 偏高；利息覆盖高于 5 倍算宽裕（经验）。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-08
    name: {en: "Earnings quality", zh: "盈利质量"}
    description: {en: "How much of reported profit turned into real cash: operating cash flow divided by net income, and accruals (non-cash accounting items). A big gap suggests profit may be inflated. Source: Yahoo Finance via yfinance cash flow and income statements. Typical values: operating cash flow to net income of 1 or more is good; 0.8 to 1.2 is common.", zh: "账面利润有多少变成了真金白银：经营现金流除以净利润，以及应计项目（不涉及现金的会计项目）。差距大说明利润可能含水分。数据来源：通过 yfinance 取 Yahoo Finance 的现金流量表和利润表。常见情形：经营现金流/净利润达到 1 以上为佳；0.8–1.2 常见。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: QUA-09
    name: {en: "EPS revisions", zh: "EPS 预期修正"}
    description: {en: "Whether analysts are raising more than cutting their EPS (earnings per share) forecasts. Upgrades usually go with price support. Passes when upgrades outnumber downgrades. Source: Yahoo Finance via yfinance eps_revisions (counts for the last 7 and 30 days). Typical values: upgrades outnumbering downgrades (a revision ratio above 1) is positive. Updated daily.", zh: "分析师上调 EPS（每股收益）预期的次数是否多于下调。上调通常伴随股价支撑。上调多于下调时通过。数据来源：通过 yfinance 取 Yahoo Finance 的 eps_revisions（近 7 天和 30 天的次数）。常见情形：上调多于下调（修正比率大于 1）为正面。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "part"
    availability: "not_implemented"
    legacy_id: ["Z17"]
  - rule_id: QUA-10
    name: {en: "Analyst buy ratings", zh: "分析师买入评级"}
    description: {en: "Passes when more than 60% of analysts rate the stock a buy. It shows market consensus, but a very one-sided view is also a warning. Source: Yahoo Finance via yfinance recommendations (strong buy, buy, hold, sell, strong sell counts).", zh: "超过 60% 的分析师给出买入评级时通过。它反映市场共识，但观点过于一边倒时也要警惕。数据来源：通过 yfinance 取 Yahoo Finance 的 recommendations（强买、买入、持有、卖出、强卖的家数）。"}
    weight: 2
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
    legacy_id: ["F01"]
  # MGT · Management and governance
  - rule_id: MGT-01
    name: {en: "Insider trading", zh: "内部人交易"}
    description: {en: "Whether the company's executives and directors are net buyers or net sellers of its stock. Buying with their own money is a stronger positive signal than selling, which is often just stock compensation. Source: SEC Form 4 filings (insider trade reports, due within 2 business days), read through Yahoo Finance via yfinance.", zh: "公司高管和董事是净买入还是净卖出自家股票。自掏腰包买入是比卖出更强的正面信号，因为卖出多半只是股权激励。数据来源：SEC Form 4（内部人交易报告，须在 2 个工作日内披露），通过 yfinance 取 Yahoo Finance。"}
    weight: 3
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: MGT-02
    name: {en: "Buybacks and dilution", zh: "回购与稀释"}
    description: {en: "Whether the company is buying back its shares (share count falling) or issuing more (shareholders diluted). A steady fall of 1% to 3% a year is typical of regular buybacks; a rise above 2% a year is dilution. Source: Yahoo Finance via yfinance balance sheet (ordinary shares).", zh: "公司是在回购股票（股数下降），还是不断增发（股东被稀释）。每年稳定下降 1%–3% 是常见的持续回购，每年上升超过 2% 就是稀释。数据来源：通过 yfinance 取 Yahoo Finance 资产负债表里的普通股股数。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: MGT-03
    name: {en: "Capital allocation", zh: "资本配置"}
    description: {en: "Where management spends the money: whether acquisitions create value and whether the dividend is sustainable (for example, dividends covered by FCF, free cash flow). No standard number exists; it is estimated from statements. Source: SEC EDGAR company facts.", zh: "管理层把钱花在哪：并购是否创造价值，分红靠不靠得住（例如分红是否被 FCF，即自由现金流，覆盖）。没有通用数值，需要从财报估算。数据来源：SEC EDGAR 的公司数据。"}
    weight: 2
    kind: "script"
    acquisition: "scrape"
    quantifiable: "part"
    availability: "missing_data_source"
  - rule_id: MGT-04
    name: {en: "Governance risk", zh: "治理风险"}
    description: {en: "Whether there are governance or accounting problems, such as a qualified audit opinion or a restatement (re-issued financial statements). These usually hit the share price hard once exposed. Source: SEC EDGAR filings, for example 8-K Item 4.02 (non-reliance on past financials), found by an AI search.", zh: "有没有治理或会计问题，比如审计意见异常、财报重述（重新发布财务报表）。这类问题一旦暴露，往往重挫股价。数据来源：SEC EDGAR 披露文件，例如 8-K 第 4.02 项（过往财报不可再依赖），由 AI 搜索获得。"}
    weight: 2
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "part"
    availability: "missing_data_source"
  # VAL · Valuation
  - rule_id: VAL-01
    name: {en: "S&P 500 forward PE", zh: "标普 500 Forward PE"}
    description: {en: "Forward PE (price-to-earnings ratio using analysts' expected earnings for the next 12 months) of the S&P 500, and where it sits in its own history. It tells whether the whole market is expensive. Source: FactSet Earnings Insight (weekly) or Yardeni Research, read by an AI; multpl.com gives only trailing PE. Typical values: long-run average about 16 to 17; above 22 is expensive (rule of thumb, not verified). Updated weekly.", zh: "标普 500 的 Forward PE（用分析师预期的未来 12 个月盈利算的市盈率）及其在历史中的位置，用来判断整个市场贵不贵。数据来源：FactSet 的 Earnings Insight（周报）或 Yardeni Research，由 AI 读取；multpl.com 只提供 TTM 市盈率。常见情形：长期均值约 16–17；高于 22 偏贵（经验，未核实）。每周更新。"}
    weight: 3
    kind: "script"
    acquisition: "ai_search"
    quantifiable: "yes"
    availability: "missing_data_source"
  - rule_id: VAL-02
    name: {en: "QQQ PE", zh: "QQQ 市盈率"}
    description: {en: "PE of the Nasdaq-100, through QQQ (the Invesco fund that tracks it), with its premium over SPY (the S&P 500 fund). Tech-heavy, so valuation swings more. Source: Yahoo Finance via yfinance (trailing PE only; no free forward PE). Typical values: the Nasdaq-100 usually trades at a premium to the S&P 500. Updated daily.", zh: "纳指 100 的市盈率（用跟踪它的 QQQ 基金），以及相对 SPY（标普 500 基金）的溢价。科技股占比高，估值波动更大。数据来源：通过 yfinance 取 Yahoo Finance（只有 TTM 市盈率，没有免费的 Forward PE）。常见情形：纳指 100 的估值通常高于标普 500。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-03
    name: {en: "Equity risk premium", zh: "股权风险溢价"}
    description: {en: "ERP (equity risk premium) in its simple form: earnings yield (1 divided by PE) minus the 10-year Treasury yield. If it is negative, stocks pay less than Treasuries. Source: Yahoo Finance via yfinance for PE and FRED series DGS10 for the yield. Typical values: a negative result means stocks look expensive against Treasuries (simplified Fed model). Updated daily.", zh: "股权风险溢价（ERP）的简化版：盈利收益率（1 除以市盈率）减去 10 年期国债收益率。为负说明买股票的回报还不如国债。数据来源：市盈率通过 yfinance 取 Yahoo Finance，收益率取 FRED 的 DGS10 序列。常见情形：结果为负，说明相对国债股票偏贵（简化的 Fed 模型）。每日更新。"}
    weight: 3
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-04
    name: {en: "Market cap to GDP", zh: "市值/GDP"}
    description: {en: "Total stock market value divided by GDP (gross domestic product), the Buffett indicator, used to judge whether the market as a whole is overheated. Here a non-standard version is used: US non-financial corporate equities from the Fed's Z.1 flow of funds report divided by GDP. Source: FRED series NCBEILQ027S and GDP, quarterly with a 2 to 3 month lag. Typical values: the standard version above 150% is often called expensive (rule of thumb); this non-standard version gives different numbers.", zh: "股市总市值除以 GDP（国内生产总值），即巴菲特指标，用来判断整个市场是否过热。这里用的是非标准版本：美联储 Z.1 资金流量表里的美国非金融企业股权市值除以 GDP。数据来源：FRED 的 NCBEILQ027S 和 GDP 序列，季更，滞后 2–3 个月。常见情形：标准版本高于 150% 常被称为偏贵（经验）；这个非标准版本的数值不同。"}
    weight: 1
    kind: "script"
    acquisition: "computed"
    quantifiable: "part"
    availability: "missing_data_source"
  - rule_id: VAL-05
    name: {en: "Stock PE (TTM)", zh: "个股 PE (TTM)"}
    description: {en: "PE (price divided by earnings per share) on TTM (trailing twelve months) actual earnings, and whether it is above or below the stock's own history. Long-run S&P 500 average is roughly 16 to 17. Source: Yahoo Finance via yfinance for the current value; history must be rebuilt from SEC EDGAR EPS. Typical values: growth stocks at 25 to 35 are common. Updated daily.", zh: "按 TTM（过去十二个月）实际盈利算的市盈率（价格除以每股收益），以及比这只股票自身历史贵还是便宜。标普 500 长期平均大约在 16–17。数据来源：当前值通过 yfinance 取 Yahoo Finance；历史需要用 SEC EDGAR 的 EPS 自己重建。常见情形：成长股常在 25–35。每日更新。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-06
    name: {en: "Stock forward PE", zh: "个股 Forward PE"}
    description: {en: "Forward PE: price divided by analysts' expected earnings for the next 12 months. If it is lower than the TTM PE, the market expects earnings to grow. Source: Yahoo Finance via yfinance.", zh: "Forward PE：价格除以分析师预期的未来 12 个月盈利。如果低于 TTM 市盈率，说明市场预期盈利会增长。数据来源：通过 yfinance 取 Yahoo Finance。"}
    weight: 4
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-07
    name: {en: "EV/EBITDA and PEG", zh: "EV/EBITDA 与 PEG"}
    description: {en: "Two more valuation yardsticks: EV/EBITDA (enterprise value, meaning market cap plus net debt, divided by EBITDA, earnings before interest, taxes, depreciation and amortization) and PEG (PE divided by earnings growth rate; about 1 is often seen as fair). Source: Yahoo Finance via yfinance; its PEG definition is not always consistent. Typical values: EV/EBITDA of 8 to 15 is common.", zh: "另外两把估值尺子：EV/EBITDA（企业价值即市值加净债务，除以 EBITDA 息税折旧摊销前利润）和 PEG（市盈率除以盈利增速，约等于 1 常被视为合理）。数据来源：通过 yfinance 取 Yahoo Finance；它的 PEG 口径并不总是一致。常见情形：EV/EBITDA 常见在 8–15。"}
    weight: 2
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-08
    name: {en: "FCF yield", zh: "自由现金流收益率"}
    description: {en: "FCF (free cash flow) divided by market value: roughly how much cash you get back each year for buying the whole company. Above 5% is often seen as cheap, below 3% as expensive. Source: Yahoo Finance via yfinance, calculated.", zh: "FCF（自由现金流）除以市值，相当于买下整家公司每年能拿回多少现金。高于 5% 常被视为便宜，低于 3% 偏贵。数据来源：通过 yfinance 取 Yahoo Finance，自行计算。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "not_implemented"
  - rule_id: VAL-09
    name: {en: "Safety margin", zh: "安全边际"}
    description: {en: "Passes when the strike of the put you sell is no higher than the price you would be happy to pay for the stock. This is the core safety margin of selling puts. Source: your own answer; no data feed.", zh: "你卖出的 Put 的行权价不高于你愿意买入这只股票的价格时通过，这是卖 Put 最核心的安全边际。数据来源：你自己的回答，没有数据源。"}
    weight: 5
    kind: "manual"
    acquisition: "manual"
    quantifiable: "yes"
    availability: "user_answer"
    legacy_id: ["A16"]
  # SEN · Sentiment and positioning
  - rule_id: SEN-01
    name: {en: "VIX", zh: "VIX 恐慌指数"}
    description: {en: "The VIX (Cboe Volatility Index) shows how much volatility the options market expects for the S&P 500 over the next 30 days; it is called the fear gauge. Too low and options pay little; too high and the market is panicking, so sellers must be careful. Source: Yahoo Finance symbol ^VIX via yfinance; delayed about 15 minutes during trading. Typical values: long-run average about 19 to 20; below 12 is complacent, 20 to 30 tense, above 30 panic, above 40 extreme (market convention).", zh: "VIX（Cboe 波动率指数）反映期权市场预期标普 500 未来 30 天的波动，俗称恐慌指数。太低期权不值钱，太高说明市场恐慌，卖方要小心。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VIX，盘中约延迟 15 分钟。常见情形：长期均值约 19–20；低于 12 自满，20–30 紧张，高于 30 恐慌，高于 40 极端（业界惯例）。"}
    weight: 5
    kind: "script"
    acquisition: "api_fetch"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "vix_level"
    bands: [{operator: "between", value: [15, 25], credit: 1.0}, {operator: "between", value: [12, 15], credit: 0.5}, {operator: "between", value: [25, 30], credit: 0.5}]
    legacy_id: ["A10", "A11", "T01", "D02"]
    note: {en: "Seller view. Buyer strategies (old D02) read VIX above 30 as extreme fear and override the credits", zh: "卖方视角。买方策略（旧 D02）把 VIX 高于 30 视为极度恐慌，需要覆盖分档"}
  - rule_id: SEN-02
    name: {en: "VIX term structure", zh: "VIX 期限结构"}
    description: {en: "Shape of the VIX futures curve. Contango means later months cost more, which is normal; backwardation means near months cost more, which signals strong short-term panic. Passes in contango. Source: Yahoo Finance ^VIX versus ^VIX3M (3-month VIX) via yfinance. Typical values: contango is the normal state most of the time. Updated daily.", zh: "VIX 期货曲线的形状。Contango（远月更贵）是常态；Backwardation（近月更贵）说明短期恐慌很重。处于 contango 时通过。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VIX 与 ^VIX3M（3 个月 VIX）。常见情形：多数时间处于 contango。每日更新。"}
    weight: 4
    kind: "script"
    acquisition: "computed"
    quantifiable: "yes"
    availability: "automatic"
    indicator: "vix_term_structure_is_contango"
    operator: "is_true"
    legacy_id: ["Z19"]
  - rule_id: SEN-03
    name: {en: "VXN", zh: "VXN 纳指波动率"}
