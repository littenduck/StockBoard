# ------------------------------------------------------------------------------
# Rule catalog, by theme
# ------------------------------------------------------------------------------
# A rule answers one question: does the indicator pass this line? (pass, fail or unknown). It has no weight and no score;
# a strategy (config/strategies/*.yaml) picks rules from here and gives each its own weight.
# What is measured, where it comes from and how often it is fetched is written once on the indicator (config/indicators.yaml).
# Every text a person reads is {en, zh}; see docs/language.md.

# ------------------------------------------------------------------------------
# How rules are numbered and written
# ------------------------------------------------------------------------------
# Rule id = R- + category code + two digits, for example R-TRD-05. Categories run from macro down to detail. Inside a category the numbers run
# 01, 02, 03 ... in the order of this file with no gaps, and a category is split into topics that are unbroken runs.
# A measure with several lines (VIX, Delta, DTE ...) is one rule per line: the main rule comes first and its other lines follow it, each with
# band_of pointing back. A strategy lists the lines it wants, each with its own weight, so crossing one more line adds weight.
# The ids the rules had before the renumbering (MAC-03 ...) and the older A01 to Z20 ids are kept in legacy_id, the newest first; a legacy_id
# is on one rule only. Retired rules are listed at the end by old_id and that id is never given to a live rule.

# ------------------------------------------------------------------------------
# Fields of every rule
# ------------------------------------------------------------------------------
# rule_id          R-MAC-03: the permanent id.
# rule_name        a short lower case name with underscores, unique, like an indicator_name (ten_year_below_4_5pct); the dashboard shows it.
# topic            the topic of its group, from topic_list.
# description      {en, zh} the pass sentence ("Passes when ..."), with abbreviations spelled out. The meaning, source, update frequency and typical
#                  values of the measure are on the indicator, which the pages show under the rule.
# indicator        id of the indicator in config/indicators.yaml (I-003); absent for a manual rule.
# operator, value  the line this rule tests: less_than, less_or_equal, greater_than, greater_or_equal, between (value is [low, high]) or is_true.
# band_of          optional: id of the main rule when this rule is another line of the same indicator; the lines that share its operator run
#                  in one direction.
# legacy_id        older ids this rule replaces.
# note             optional {en, zh} remark.
# method, quantifiable, backtestable, history_source, history_start, status
#                  only on a manual rule (status no_data, method manual: no data in the app, your own input, your trade plan or your brokerage
#                  account; a strategy may use it, it always shows unknown and is left out of the score). Every other rule takes them from its
#                  indicator.

# ------------------------------------------------------------------------------
# Rule groups (categories)
# ------------------------------------------------------------------------------
# group_id       the category code in every rule id (MAC, TRD ...).
# aspect         the wider family the page groups categories under, {en, zh}.
# display_name   the title of the category, {en, zh}.
# description    one line about what the category holds, {en, zh}.
# topic_list     the topics inside the category, in order: topic_id (the value of topic in a rule) and display_name, {en, zh}.
