# Rule catalog, regrouped by theme (first draft of the redesign; strategies/*.yaml still use the old ids).
# Rule id = category code + two digits, for example TRD-03. Categories run from macro down to detail.
# legacy_id lists the old ids (A01 to Z20, plus T, R, M) that each rule replaces; old alias rules are merged away.
# default_weight is the importance score 1 to 5 from the redesign review (5 = core or veto). Strategies may override it.
# A rule with bands gives partial credit: the first matching band wins, no match means credit 0. Credits are a first draft.
#
# availability:
#   automatic            computed from data the app already fetches
#   missing_data_source  needs data with no stable free source yet
#   account_data         needs your brokerage account
#   user_answer          needs your answer
#   trade_plan           a plan for after the trade, not a screen
#   not_implemented      computable in principle, not built yet
#   proposed             new in this catalog, not assessed yet
#
# Every text a person reads is {en, zh}; see docs/language.md.

rule_group_list:
  - {group_id: MAC, aspect: {en: "Fundamentals", zh: "基本面"}, display_name: {en: "MAC · Macro", zh: "MAC · 宏观"}, description: {en: "Policy, rates, credit, inflation, growth, dollar, oil and liquidity.", zh: "政策、利率、信用、通胀、增长、美元、油价和流动性。"}}
  - {group_id: IND, aspect: {en: "Fundamentals", zh: "基本面"}, display_name: {en: "IND · Industry", zh: "IND · 行业"}, description: {en: "Industry strength and cycle.", zh: "行业强弱与景气周期。"}}
  - {group_id: QUA, aspect: {en: "Fundamentals", zh: "基本面"}, display_name: {en: "QUA · Company quality", zh: "QUA · 公司质量"}, description: {en: "Profitability, growth, cash flow, balance sheet and analyst expectations.", zh: "盈利、增长、现金流、财务稳健和分析师预期。"}}
  - {group_id: MGT, aspect: {en: "Fundamentals", zh: "基本面"}, display_name: {en: "MGT · Management and governance", zh: "MGT · 管理层与治理"}, description: {en: "Insider activity, buybacks, dilution and capital allocation.", zh: "内部人交易、回购、稀释和资本配置。"}}
  - {group_id: VAL, aspect: {en: "Fundamentals", zh: "基本面"}, display_name: {en: "VAL · Valuation", zh: "VAL · 估值"}, description: {en: "Market and stock valuation, and your own margin of safety.", zh: "大盘与个股估值，以及你自己的安全边际。"}}
  - {group_id: SEN, aspect: {en: "Sentiment and flows", zh: "情绪资金面"}, display_name: {en: "SEN · Sentiment and positioning", zh: "SEN · 情绪与仓位"}, description: {en: "VIX, VXN, Fear and Greed, surveys, manager positioning, put/call, short interest.", zh: "VIX、VXN、恐惧贪婪、问卷、经理人仓位、Put/Call、空头比例。"}}
  - {group_id: TRD, aspect: {en: "Technicals", zh: "技术面"}, display_name: {en: "TRD · Trend and momentum", zh: "TRD · 趋势与动量"}, description: {en: "Market and stock trend, breadth, momentum, pullback and support.", zh: "大盘与个股趋势、广度、动量、回调和支撑。"}}
  - {group_id: EVT, aspect: {en: "Events", zh: "事件面"}, display_name: {en: "EVT · Events", zh: "EVT · 事件"}, description: {en: "Earnings, central bank, data releases, policy and calendar effects.", zh: "财报、央行、数据公布、政策和日历效应。"}}
  - {group_id: LIQ, aspect: {en: "Options", zh: "期权面"}, display_name: {en: "LIQ · Liquidity", zh: "LIQ · 流动性"}, description: {en: "Stock size and volume, option spread and open interest.", zh: "股票规模与成交额，期权价差与持仓量。"}}
  - {group_id: VOL, aspect: {en: "Options", zh: "期权面"}, display_name: {en: "VOL · Volatility", zh: "VOL · 波动率"}, description: {en: "IV percentile, IV against realized, event volatility, skew.", zh: "IV 百分位、IV 对实际波动、事件波动、偏斜。"}}
  - {group_id: CTR, aspect: {en: "Options", zh: "期权面"}, display_name: {en: "CTR · Contract selection", zh: "CTR · 合约选择"}, description: {en: "Delta, expiration, strike and Covered Call terms.", zh: "Delta、到期日、行权价和 Covered Call 条款。"}}
  - {group_id: RET, aspect: {en: "Options", zh: "期权面"}, display_name: {en: "RET · Return and payoff", zh: "RET · 收益与盈亏比"}, description: {en: "Annualized return, premium, leverage, breakeven and win probability.", zh: "年化收益、权利金、杠杆、盈亏平衡和盈利概率。"}}
  - {group_id: POS, aspect: {en: "Risk", zh: "风控面"}, display_name: {en: "POS · Position, account and portfolio", zh: "POS · 仓位、账户与组合"}, description: {en: "Option level, cash, exposure caps, loss limits and portfolio Greeks.", zh: "期权权限、现金、敞口上限、亏损上限和组合希腊字母。"}}
  - {group_id: THS, aspect: {en: "Risk", zh: "风控面"}, display_name: {en: "THS · Thesis and discipline", zh: "THS · 投资逻辑与证伪"}, description: {en: "Why you trade, what proves you wrong, and your own limits.", zh: "为什么做、什么情况证明你错了，以及你自己的底线。"}}
  - {group_id: EXT, aspect: {en: "Risk", zh: "风控面"}, display_name: {en: "EXT · Management and exit", zh: "EXT · 管理与退出"}, description: {en: "Take profit, stop loss, time stop, roll and Wheel management.", zh: "止盈、止损、时间止损、展期和 Wheel 管理。"}}

rule_list:
  # MAC · Macro
  - {rule_id: MAC-01, description: {en: "No Fed hike and no new hiking guidance in the last 6 months", zh: "近 6 个月 Fed 未加息且无新加息指引"}, default_weight: 3, availability: missing_data_source, legacy_id: [A01]}
  - {rule_id: MAC-02, description: {en: "Odds of a hike at the next FOMC < 50%", zh: "下次 FOMC 加息概率 < 50%"}, default_weight: 2, availability: missing_data_source, legacy_id: [A06]}
  - {rule_id: MAC-03, description: {en: "10Y yield level (< 4.5% full credit, < 5.0% half)", zh: "10Y 收益率水平（< 4.5% 满分，< 5.0% 半分）"}, default_weight: 4, availability: automatic, indicator: treasury_ten_year_yield, bands: [{operator: less_than, value: 4.5, credit: 1.0}, {operator: less_than, value: 5.0, credit: 0.5}], legacy_id: [A02, A07]}
  - {rule_id: MAC-04, description: {en: "10Y up < 25bp over 20 days", zh: "10Y 20 日升幅 < 25bp"}, default_weight: 3, availability: automatic, indicator: treasury_ten_year_yield_twenty_day_change_basis_points, operator: less_than, value: 25, legacy_id: [A03]}
  - {rule_id: MAC-05, description: {en: "HY credit spread < 400bp", zh: "HY 信用利差 < 400bp"}, default_weight: 4, availability: automatic, indicator: high_yield_credit_spread_basis_points, operator: less_than, value: 400, legacy_id: [A04]}
  - {rule_id: MAC-06, description: {en: "HY credit spread up < 50bp over 20 days", zh: "HY 信用利差 20 日升幅 < 50bp"}, default_weight: 3, availability: not_implemented, legacy_id: [A04], note: {en: "Split from the old A04, where this half was never built", zh: "从旧 A04 拆出，这一半此前未实现"}}
  - {rule_id: MAC-07, description: {en: "Yield curve not inverted (10Y minus 2Y or 3M above 0)", zh: "收益率曲线未倒挂（10Y 减 2Y 或 3M 大于 0）"}, default_weight: 4, availability: proposed}
  - {rule_id: MAC-08, description: {en: "Inflation (CPI, core PCE) level and trend", zh: "通胀（CPI、核心 PCE）的水平与趋势"}, default_weight: 3, availability: proposed}
  - {rule_id: MAC-09, description: {en: "Growth and jobs (PMI, unemployment, jobless claims)", zh: "增长与就业（PMI、失业率、初请）"}, default_weight: 3, availability: proposed}
  - {rule_id: MAC-10, description: {en: "US dollar index trend", zh: "美元指数趋势"}, default_weight: 2, availability: proposed}
  - {rule_id: MAC-11, description: {en: "WTI < $100 and up < 15% this month", zh: "WTI < $100 且月涨幅 < 15%"}, default_weight: 2, availability: missing_data_source, legacy_id: [Z12]}
  - {rule_id: MAC-12, description: {en: "Global liquidity trend (Fed balance sheet, M2)", zh: "全球流动性趋势（Fed 资产负债表、M2）"}, default_weight: 2, availability: proposed}
  # IND · Industry
  - {rule_id: IND-01, description: {en: "Industry relative strength (sector ETF against SPY)", zh: "行业相对强弱（行业 ETF 对 SPY）"}, default_weight: 3, availability: proposed}
  - {rule_id: IND-02, description: {en: "Industry cycle and earnings revisions", zh: "行业景气周期与盈利修正"}, default_weight: 2, availability: proposed}
  # QUA · Company quality
  - {rule_id: QUA-01, description: {en: "Earnings are positive (EPS TTM > 0)", zh: "盈利为正（EPS TTM > 0）"}, default_weight: 4, availability: missing_data_source, legacy_id: [F01]}
  - {rule_id: QUA-02, description: {en: "Revenue growth year over year > 0", zh: "营收同比增长 > 0"}, default_weight: 3, availability: missing_data_source, legacy_id: [F01]}
  - {rule_id: QUA-03, description: {en: "Earnings and revenue 3-year growth", zh: "盈利与营收 3 年增速"}, default_weight: 3, availability: proposed}
  - {rule_id: QUA-04, description: {en: "ROIC / ROE level and stability (moat evidence)", zh: "ROIC / ROE 水平与稳定性（护城河证据）"}, default_weight: 4, availability: proposed}
  - {rule_id: QUA-05, description: {en: "Gross margin level and stability", zh: "毛利率水平与稳定性"}, default_weight: 3, availability: proposed}
  - {rule_id: QUA-06, description: {en: "Free cash flow positive and growing", zh: "自由现金流为正且增长"}, default_weight: 4, availability: proposed}
  - {rule_id: QUA-07, description: {en: "Balance sheet strength (net debt to EBITDA, interest coverage)", zh: "财务稳健（净债务/EBITDA、利息覆盖）"}, default_weight: 4, availability: proposed}
  - {rule_id: QUA-08, description: {en: "Earnings quality (operating cash flow to net income, accruals)", zh: "盈利质量（经营现金流/净利润、应计）"}, default_weight: 2, availability: proposed}
  - {rule_id: QUA-09, description: {en: "More analyst EPS upgrades than downgrades", zh: "分析师 EPS 上修多于下修"}, default_weight: 3, availability: missing_data_source, legacy_id: [Z17]}
  - {rule_id: QUA-10, description: {en: "Buy ratings above 60% of analysts", zh: "买入评级占比 > 60%"}, default_weight: 2, availability: missing_data_source, legacy_id: [F01]}
  # MGT · Management and governance
  - {rule_id: MGT-01, description: {en: "Insider net buying or selling", zh: "内部人净买入或净卖出"}, default_weight: 3, availability: proposed}
  - {rule_id: MGT-02, description: {en: "Net buybacks and share dilution", zh: "净回购与股本稀释"}, default_weight: 3, availability: proposed}
  - {rule_id: MGT-03, description: {en: "Capital allocation record (acquisitions, sustainable dividend)", zh: "资本配置记录（并购、分红可持续）"}, default_weight: 2, availability: proposed}
  - {rule_id: MGT-04, description: {en: "Governance and accounting risk (audit opinion, restatements)", zh: "治理与会计风险（审计意见、重述）"}, default_weight: 2, availability: proposed}
  # VAL · Valuation
  - {rule_id: VAL-01, description: {en: "S&P 500 forward PE and its historical percentile", zh: "标普 500 Forward PE 及历史分位"}, default_weight: 3, availability: proposed}
  - {rule_id: VAL-02, description: {en: "Nasdaq-100 / QQQ PE (TTM and forward) and premium over SPY", zh: "纳指 100 / QQQ 的 PE（TTM 与 Forward）及相对 SPY 的溢价"}, default_weight: 3, availability: proposed}
  - {rule_id: VAL-03, description: {en: "Earnings yield minus 10Y yield (equity risk premium)", zh: "盈利收益率减 10Y 收益率（股权风险溢价）"}, default_weight: 3, availability: proposed}
  - {rule_id: VAL-04, description: {en: "Market cap to GDP (Buffett indicator)", zh: "市值/GDP（巴菲特指标）"}, default_weight: 1, availability: proposed}
  - {rule_id: VAL-05, description: {en: "Stock PE TTM and premium over its own history", zh: "个股 PE TTM 及相对自身历史的溢价"}, default_weight: 4, availability: proposed}
  - {rule_id: VAL-06, description: {en: "Stock forward PE and its gap to TTM", zh: "个股 Forward PE 及与 TTM 的差"}, default_weight: 4, availability: proposed}
  - {rule_id: VAL-07, description: {en: "EV/EBITDA and PEG", zh: "EV/EBITDA 与 PEG"}, default_weight: 2, availability: proposed}
  - {rule_id: VAL-08, description: {en: "Free cash flow yield", zh: "自由现金流收益率"}, default_weight: 4, availability: proposed}
  - {rule_id: VAL-09, description: {en: "Safety margin: strike <= the price you are willing to buy at", zh: "安全边际：Strike <= 你愿意接盘的价格"}, default_weight: 5, availability: user_answer, legacy_id: [A16]}
  # SEN · Sentiment and positioning
  - {rule_id: SEN-01, description: {en: "VIX level (15-25 full credit, 12-15 and 25-30 half)", zh: "VIX 水平（15-25 满分，12-15 与 25-30 半分）"}, default_weight: 5, availability: automatic, indicator: vix_level, bands: [{operator: between, value: [15, 25], credit: 1.0}, {operator: between, value: [12, 15], credit: 0.5}, {operator: between, value: [25, 30], credit: 0.5}], legacy_id: [A10, A11, T01, D02], note: {en: "Seller view. Buyer strategies (old D02) read VIX above 30 as extreme fear and override the credits", zh: "卖方视角。买方策略（旧 D02）把 VIX 高于 30 视为极度恐慌，需要覆盖分档"}}
  - {rule_id: SEN-02, description: {en: "VIX term structure in contango", zh: "VIX 期限结构为 contango"}, default_weight: 4, availability: automatic, indicator: vix_term_structure_is_contango, operator: is_true, legacy_id: [Z19]}
  - {rule_id: SEN-03, description: {en: "VXN level (Nasdaq-100 volatility), and VXN to VIX ratio", zh: "VXN 水平（纳指 100 波动率），及 VXN/VIX 比值"}, default_weight: 3, availability: automatic, indicator: vxn_level, note: {en: "Indicator exists; no bands yet", zh: "指标已有，暂无分档"}}
  - {rule_id: SEN-04, description: {en: "CNN Fear and Greed (< 25 full credit, < 45 three quarters, < 55 half)", zh: "CNN 恐惧贪婪（< 25 满分，< 45 七成半，< 55 半分）"}, default_weight: 3, availability: missing_data_source, indicator: fear_greed_index, bands: [{operator: less_than, value: 25, credit: 1.0}, {operator: less_than, value: 45, credit: 0.75}, {operator: less_than, value: 55, credit: 0.5}], legacy_id: [A08, A09, B02, D02, D03], note: {en: "Contrarian seller view. Old D03 (FGI above 75) is the opposite direction and belongs to a bearish strategy", zh: "逆向的卖方视角。旧 D03（FGI 高于 75）方向相反，属于看空策略"}}
  - {rule_id: SEN-05, description: {en: "AAII retail bull/bear survey", zh: "AAII 散户多空问卷"}, default_weight: 2, availability: proposed}
  - {rule_id: SEN-06, description: {en: "NAAIM active manager exposure index", zh: "NAAIM 主动经理人仓位指数"}, default_weight: 2, availability: proposed}
  - {rule_id: SEN-07, description: {en: "Put/call ratio", zh: "Put/Call 比率"}, default_weight: 2, availability: proposed}
  - {rule_id: SEN-08, description: {en: "No IPO of $10B or more in the window", zh: "窗口内无 ≥ $10B 的大型 IPO"}, default_weight: 1, availability: missing_data_source, legacy_id: [A05]}
  - {rule_id: SEN-09, description: {en: "Stock short interest", zh: "个股空头比例"}, default_weight: 2, availability: proposed}
  # TRD · Trend and momentum
  - {rule_id: TRD-01, description: {en: "SPX > 200-day average", zh: "标普 500 > 200 日线"}, default_weight: 5, availability: automatic, indicator: spx_above_two_hundred_day_average, operator: is_true, legacy_id: [Z18]}
  - {rule_id: TRD-02, description: {en: "Market breadth (share of stocks above their 200-day average, new highs minus new lows)", zh: "市场广度（站上 200 日线的股票占比、新高减新低）"}, default_weight: 3, availability: proposed}
  - {rule_id: TRD-03, description: {en: "Stock > 200-day average", zh: "个股 > 200 日线"}, default_weight: 5, availability: automatic, indicator: price_above_two_hundred_day_average, operator: is_true, legacy_id: [Z20], note: {en: "The original rule also requires no new 52-week low; that part is not built yet", zh: "原规则还要求未创 52 周新低，这部分尚未实现"}}
  - {rule_id: TRD-04, description: {en: "50-day average > 200-day average (golden cross state)", zh: "50 日线 > 200 日线（黄金交叉状态）"}, default_weight: 4, availability: automatic, indicator: fifty_day_average_above_two_hundred_day_average, operator: is_true, legacy_id: [T02]}
  - {rule_id: TRD-05, description: {en: "Close > 50-day average", zh: "收盘价 > 50 日线"}, default_weight: 3, availability: automatic, indicator: price_above_fifty_day_average, operator: is_true, legacy_id: [T03]}
  - {rule_id: TRD-06, description: {en: "Distance from the 52-week high (<= 5% full credit, <= 15% half)", zh: "距 52 周高点（<= 5% 满分，<= 15% 半分）"}, default_weight: 4, availability: automatic, indicator: distance_from_fifty_two_week_high_percent, bands: [{operator: less_or_equal, value: 5, credit: 1.0}, {operator: less_or_equal, value: 15, credit: 0.5}], legacy_id: [M02, T05]}
  - {rule_id: TRD-07, description: {en: "52-week range position (<= 25 full credit, <= 50 half)", zh: "52 周区间分位（<= 25 满分，<= 50 半分）"}, default_weight: 3, availability: automatic, indicator: fifty_two_week_range_percentile, bands: [{operator: less_or_equal, value: 25, credit: 1.0}, {operator: less_or_equal, value: 50, credit: 0.5}], legacy_id: [F02, F03], note: {en: "Low zone is the Wheel view; momentum strategies want the opposite and use TRD-06", zh: "低位是 Wheel 的视角；动量策略方向相反，用 TRD-06"}}
  - {rule_id: TRD-08, description: {en: "6-month gain > 10%", zh: "6 个月涨幅 > 10%"}, default_weight: 4, availability: automatic, indicator: return_six_month_percent, operator: greater_than, value: 10, legacy_id: [M01]}
  - {rule_id: TRD-09, description: {en: "Stock relative strength against SPY or its sector", zh: "个股相对 SPY 或行业的强弱"}, default_weight: 3, availability: proposed}
  - {rule_id: TRD-10, description: {en: "Volume >= 1.5 × 20-day average (higher volume)", zh: "成交量 >= 20 日均量 × 1.5（放量）"}, default_weight: 3, availability: automatic, indicator: volume_ratio_to_twenty_day_average, operator: greater_or_equal, value: 1.5, legacy_id: [M03]}
  - {rule_id: TRD-11, description: {en: "RSI(14) (40-70 full credit healthy trend, 70-80 half)", zh: "RSI(14)（40-70 满分趋势健康，70-80 半分）"}, default_weight: 3, availability: automatic, indicator: relative_strength_index_fourteen_day, bands: [{operator: between, value: [40, 70], credit: 1.0}, {operator: between, value: [70, 80], credit: 0.5}], legacy_id: [T04, M04]}
  - {rule_id: TRD-12, description: {en: "RSI(2) oversold (< 5 full credit, < 10 three quarters)", zh: "RSI(2) 超卖（< 5 满分，< 10 七成半）"}, default_weight: 4, availability: automatic, indicator: relative_strength_index_two_day, bands: [{operator: less_than, value: 5, credit: 1.0}, {operator: less_than, value: 10, credit: 0.75}], legacy_id: [R01, R02]}
  - {rule_id: TRD-13, description: {en: "Close < 5-day average (in a short-term pullback)", zh: "收盘价 < 5 日线（短期回调中）"}, default_weight: 3, availability: automatic, indicator: price_below_five_day_average, operator: is_true, legacy_id: [R03]}
  - {rule_id: TRD-14, description: {en: "Price within 3% of the nearest support", zh: "现价距最近支撑 <= 3%"}, default_weight: 3, availability: not_implemented, legacy_id: [B06, F04]}
  - {rule_id: TRD-15, description: {en: "ATR and typical daily price range", zh: "ATR 与日常价格波动幅度"}, default_weight: 2, availability: proposed}
  - {rule_id: TRD-16, description: {en: "The symbol is in SPMO's holdings (largest, or top 20)", zh: "标的在 SPMO 持仓中（最大一只，或前 20）"}, default_weight: 3, availability: missing_data_source, legacy_id: [C03, C05], note: {en: "Depends on an external holdings list", zh: "依赖外部持仓名单"}}
  # EVT · Events
  - {rule_id: EVT-01, description: {en: "No earnings before expiration", zh: "到期前无财报"}, default_weight: 5, availability: automatic, indicator: no_earnings_before_expiration, operator: is_true, legacy_id: [A22, F05]}
  - {rule_id: EVT-02, description: {en: "No FOMC decision inside the DTE window", zh: "DTE 窗口内无 FOMC 决议日"}, default_weight: 3, availability: not_implemented, legacy_id: [F06]}
  - {rule_id: EVT-03, description: {en: "No CPI or PCE inside the DTE window, and no new position on release days", zh: "DTE 窗口内无 CPI、PCE，且不在公布日开仓"}, default_weight: 2, availability: not_implemented, legacy_id: [F07, Z14]}
  - {rule_id: EVT-04, description: {en: "No election day inside the DTE window", zh: "DTE 窗口内无选举日"}, default_weight: 1, availability: not_implemented, legacy_id: [F07]}
  - {rule_id: EVT-05, description: {en: "No new position within 1 day of the jobs report", zh: "不在非农数据前后 1 天开仓"}, default_weight: 2, availability: not_implemented, legacy_id: [Z13]}
  - {rule_id: EVT-06, description: {en: "No ex-dividend date in the window", zh: "窗口内无除息日"}, default_weight: 3, availability: not_implemented, legacy_id: [Z08]}
  - {rule_id: EVT-07, description: {en: "No tariff or policy deadline in the window", zh: "窗口内无关税或政策截止日"}, default_weight: 2, availability: missing_data_source, legacy_id: [Z09]}
  - {rule_id: EVT-08, description: {en: "No escalating geopolitical conflict", zh: "没有正在升级的地缘冲突"}, default_weight: 2, availability: missing_data_source, legacy_id: [Z10]}
  - {rule_id: EVT-09, description: {en: "No pending industry regulation or export control event", zh: "没有待决的行业监管或出口管制事件"}, default_weight: 3, availability: missing_data_source, legacy_id: [Z11]}
  - {rule_id: EVT-10, description: {en: "No earnings from industry leaders in the window", zh: "同业龙头财报不在窗口内"}, default_weight: 2, availability: missing_data_source, legacy_id: [Z15]}
