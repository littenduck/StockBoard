# ------------------------------------------------------------------------------
# Rules
# ------------------------------------------------------------------------------
# In the order of the ids; a category banner and a topic comment mark where each begins.
rule_list:
  # ----------------------------------------------------------------------------
  # MAC · Macro
  # ----------------------------------------------------------------------------
  # Policy, rates, credit, inflation, growth, dollar, oil and liquidity.
  # Topics, in order: policy_rates, credit, inflation_jobs, dollar_oil_liquidity.
  # Topic: policy_rates
  - rule_id: R-MAC-01
    rule_name: "fed_target_not_raised"
    topic: "policy_rates"
    description: {en: "Passes when the Fed has not raised its federal funds target rate (upper bound) in the last 182 days.", zh: "美联储在最近 182 天内没有上调联邦基金目标利率（上限）时通过。"}
    indicator: "I-001"
    operator: "is_true"
    legacy_id: ["MAC-01", "A01"]
  - rule_id: R-MAC-02
    rule_name: "hike_not_priced"
    topic: "policy_rates"
    description: {en: "Passes when the market is not pricing a rate hike: the 6-month Treasury bill yield minus the effective federal funds rate is below 0.25 percentage points.", zh: "市场没有在定价加息时通过：6 个月国债收益率减有效联邦基金利率，低于 0.25 个百分点。"}
    indicator: "I-002"
    operator: "less_than"
    value: 0.25
    legacy_id: ["MAC-02", "A06"]
  - rule_id: R-MAC-03
    rule_name: "ten_year_below_4_5pct"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield is below 4.5%.", zh: "10 年期国债收益率低于 4.5% 时通过。"}
    indicator: "I-003"
    operator: "less_than"
    value: 4.5
    legacy_id: ["MAC-03", "A02"]
  - rule_id: R-MAC-04
    rule_name: "ten_year_below_5_0pct"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield is below 5.0%.", zh: "10 年期国债收益率低于 5.0% 时通过。"}
    indicator: "I-003"
    operator: "less_than"
    value: 5.0
    band_of: "R-MAC-03"
    legacy_id: ["MAC-13", "A07"]
  - rule_id: R-MAC-05
    rule_name: "ten_year_20_day_rise_below_25bp"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield has risen less than 25bp over the last 20 trading days.", zh: "10 年期国债收益率在最近 20 个交易日里的升幅低于 25bp 时通过。"}
    indicator: "I-004"
    operator: "less_than"
    value: 25
    legacy_id: ["MAC-04", "A03"]
  - rule_id: R-MAC-06
    rule_name: "ten_year_20_day_rise_below_50bp"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield has risen less than 50bp over the last 20 trading days.", zh: "10 年期国债收益率在最近 20 个交易日里的升幅低于 50bp 时通过。"}
    indicator: "I-004"
    operator: "less_than"
    value: 50
    band_of: "R-MAC-05"
    legacy_id: ["MAC-14"]
  - rule_id: R-MAC-07
    rule_name: "ten_year_minus_two_year_above_0"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield is above the 2-year yield, meaning the yield curve is not inverted.", zh: "10 年期国债收益率高于 2 年期，即收益率曲线没有倒挂时通过。"}
    indicator: "I-005"
    operator: "greater_than"
    value: 0
    legacy_id: ["MAC-07"]
  - rule_id: R-MAC-08
    rule_name: "ten_year_minus_three_month_above_0"
    topic: "policy_rates"
    description: {en: "Passes when the 10-year Treasury yield is above the 3-month yield.", zh: "10 年期国债收益率高于 3 个月期时通过。"}
    indicator: "I-006"
    operator: "greater_than"
    value: 0
    legacy_id: ["MAC-17"]

  # Topic: credit
  - rule_id: R-MAC-09
    rule_name: "hy_spread_below_400bp"
    topic: "credit"
    description: {en: "Passes when the HY credit spread is below 400bp.", zh: "HY 信用利差低于 400bp 时通过。"}
    indicator: "I-007"
    operator: "less_than"
    value: 400
    legacy_id: ["MAC-05", "A04"]
  - rule_id: R-MAC-10
    rule_name: "hy_spread_below_500bp"
    topic: "credit"
    description: {en: "Passes when the HY credit spread is below 500bp.", zh: "HY 信用利差低于 500bp 时通过。"}
    indicator: "I-007"
    operator: "less_than"
    value: 500
    band_of: "R-MAC-09"
    legacy_id: ["MAC-15"]
  - rule_id: R-MAC-11
    rule_name: "hy_spread_20_day_rise_below_50bp"
    topic: "credit"
    description: {en: "Passes when the HY credit spread has widened by less than 50bp over the last 20 trading days.", zh: "HY 信用利差在最近 20 个交易日里的走阔幅度低于 50bp 时通过。"}
    indicator: "I-008"
    operator: "less_than"
    value: 50
    legacy_id: ["MAC-06"]
  - rule_id: R-MAC-12
    rule_name: "baa_spread_below_2_8pt"
    topic: "credit"
    description: {en: "Passes when Moody's seasoned Baa corporate bond yield minus the 10-year Treasury yield is below 2.8 percentage points.", zh: "穆迪 Baa 级公司债收益率减 10 年期国债收益率，低于 2.8 个百分点时通过。"}
    indicator: "I-009"
    operator: "less_than"
    value: 2.8
    legacy_id: ["MAC-22"]
  - rule_id: R-MAC-13
    rule_name: "baa_spread_below_3_3pt"
    topic: "credit"
    description: {en: "Passes when the Baa minus 10-year Treasury spread is below 3.3 percentage points.", zh: "Baa 减 10 年期国债利差低于 3.3 个百分点时通过。"}
    indicator: "I-009"
    operator: "less_than"
    value: 3.3
    band_of: "R-MAC-12"
    legacy_id: ["MAC-23"]

  # Topic: inflation_jobs
  - rule_id: R-MAC-14
    rule_name: "cpi_below_3pct"
    topic: "inflation_jobs"
    description: {en: "Passes when CPI (Consumer Price Index) inflation is below 3.0% year over year.", zh: "CPI（消费者价格指数）同比低于 3.0% 时通过。"}
    indicator: "I-010"
    operator: "less_than"
    value: 3.0
    legacy_id: ["MAC-08"]
  - rule_id: R-MAC-15
    rule_name: "core_pce_below_2_5pct"
    topic: "inflation_jobs"
    description: {en: "Passes when core PCE (Personal Consumption Expenditures price index excluding food and energy, the Fed's preferred gauge) inflation is below 2.5% year over year.", zh: "核心 PCE（剔除食品和能源的个人消费支出价格指数，美联储偏好的指标）同比低于 2.5% 时通过。"}
    indicator: "I-011"
    operator: "less_than"
    value: 2.5
    legacy_id: ["MAC-18"]
  - rule_id: R-MAC-16
    rule_name: "sahm_rule_below_0_5"
    topic: "inflation_jobs"
    description: {en: "Passes when the Sahm rule recession indicator is below 0.5.", zh: "Sahm 衰退指标低于 0.5 时通过。"}
    indicator: "I-012"
    operator: "less_than"
    value: 0.5
    legacy_id: ["MAC-09"]
  - rule_id: R-MAC-17
    rule_name: "jobless_claims_below_300k"
    topic: "inflation_jobs"
    description: {en: "Passes when the 4-week average of initial jobless claims (weekly new unemployment filings) is below 300,000.", zh: "首次申请失业救济人数（每周新增失业申请）的 4 周均值低于 300,000 时通过。"}
    indicator: "I-013"
    operator: "less_than"
    value: 300000
    legacy_id: ["MAC-19"]
  - rule_id: R-MAC-18
    rule_name: "activity_index_above_minus_0_7"
    topic: "inflation_jobs"
    description: {en: "Passes when the 3-month average of the CFNAI (Chicago Fed National Activity Index) is above -0.7.", zh: "CFNAI（芝加哥联储全国活动指数）的 3 个月均值高于 -0.7 时通过。"}
    indicator: "I-014"
    operator: "greater_than"
    value: -0.7
    legacy_id: ["MAC-20"]

  # Topic: dollar_oil_liquidity
  - rule_id: R-MAC-19
    rule_name: "dollar_20_day_rise_below_2pct"
    topic: "dollar_oil_liquidity"
    description: {en: "Passes when the US dollar index (DXY) rose less than 2% over the last 20 trading days.", zh: "美元指数（DXY）最近 20 个交易日涨幅低于 2% 时通过。"}
    indicator: "I-015"
    operator: "less_than"
    value: 2
    legacy_id: ["MAC-10"]
  - rule_id: R-MAC-20
    rule_name: "wti_below_usd_100"
    topic: "dollar_oil_liquidity"
    description: {en: "Passes when WTI crude oil (West Texas Intermediate, the US oil benchmark) is below $100 a barrel.", zh: "WTI 原油（西德州中质原油，美国原油基准）低于每桶 100 美元时通过。"}
    indicator: "I-016"
    operator: "less_than"
    value: 100
    legacy_id: ["MAC-11", "Z12"]
  - rule_id: R-MAC-21
    rule_name: "wti_1_month_rise_below_15pct"
    topic: "dollar_oil_liquidity"
