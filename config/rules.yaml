rule_list:
  # MAC · Macro
  - rule_id: MAC-01
    name: {en: "Fed target not raised", zh: "联储目标利率未上调"}
    description: {en: "Passes when the Fed has not raised its federal funds target rate (upper bound) in the last 182 days. Rising rates push stock valuations down and make selling puts riskier. The original rule also asked about guidance wording; that half is dropped because it cannot be measured (MAC-02 covers market expectations). Source: FRED series DFEDTARU (2008 onward) joined to DFEDTAR (1982 to 2008). Updated daily. Typical values: a hiking cycle is a run of increases of 25bp or more. Backtest history: FRED (Federal Reserve Economic Data), DFEDTAR+DFEDTARU, from 1982.", zh: "美联储在最近 182 天内没有上调联邦基金目标利率（上限）时通过。利率上升会压低股票估值，让卖 Put 更危险。原规则还问了“指引措辞”，这一半无法量化，已删除（市场预期由 MAC-02 负责）。数据来源：FRED 的 DFEDTARU 序列（2008 年起）接 DFEDTAR（1982 到 2008）。每日更新。常见情形：加息周期指连续上调 25bp 或以上。回测历史：FRED（美联储经济数据库），DFEDTAR+DFEDTARU，自 1982 起。"}
    indicator: "federal_funds_target_rate_not_raised_in_182_days"
    operator: "is_true"
    legacy_id: ["A01"]
  - rule_id: MAC-02
    name: {en: "Hike not priced", zh: "市场未定价加息"}
    description: {en: "Passes when the market is not pricing a rate hike: the 6-month Treasury bill yield minus the effective federal funds rate is below 0.25 percentage points. This is a proxy for the CME FedWatch hike odds (the probability of a hike at the next FOMC, the Federal Open Market Committee that sets US interest rates, which has no free history). Source: FRED series DGS6MO and DFF. Updated daily. Backtest history: FRED (Federal Reserve Economic Data), DGS6MO+DFF, from 1981.", zh: "市场没有在定价加息时通过：6 个月国债收益率减有效联邦基金利率，低于 0.25 个百分点。这是 CME FedWatch 加息概率的代理指标（FedWatch 给出下次 FOMC，即美联储负责定利率的联邦公开市场委员会会议加息的概率，没有免费历史）。数据来源：FRED 的 DGS6MO 和 DFF 序列。每日更新。回测历史：FRED（美联储经济数据库），DGS6MO+DFF，自 1981 起。"}
    indicator: "six_month_treasury_bill_yield_minus_federal_funds_rate"
    operator: "less_than"
    value: 0.25
    legacy_id: ["A06"]
  - rule_id: MAC-03
    name: {en: "10Y below 4.5%", zh: "10Y 低于 4.5%"}
    description: {en: "Passes when the 10-year Treasury yield is below 4.5%. Yield on the 10-year US Treasury note, the benchmark rate the market uses to discount future earnings. The higher it is, the harder it is for stocks to hold their valuations. Source: FRED series DGS10 (10-year Treasury constant maturity rate), updated daily with about one business day of delay. Typical values: about 0.5% to 5.0% over the last 20 years; above 4.5% is often seen as pressure on stocks (rule of thumb). Other tier: MAC-13. Backtest history: FRED (Federal Reserve Economic Data), DGS10, from 1962-01-02.", zh: "10 年期美债收益率低于 4.5% 时通过。10 年期美国国债收益率，是市场给未来盈利折现的基准利率。越高，股票越难守住估值。数据来源：FRED 的 DGS10 序列（10 年期国债固定期限收益率），每日更新，约滞后 1 个工作日。常见情形：过去 20 年大致在 0.5%–5.0%；高于 4.5% 常被视为对股市有压力（经验）。其他分档：MAC-13。回测历史：FRED（美联储经济数据库），DGS10，自 1962-01-02 起。"}
    indicator: "treasury_ten_year_yield"
    operator: "less_than"
    value: 4.5
    legacy_id: ["A02"]
  - rule_id: MAC-13
    name: {en: "10Y below 5.0%", zh: "10Y 低于 5.0%"}
    description: {en: "Passes when the 10-year Treasury yield is below 5.0%. One of the 10-year yield tiers; see MAC-03 for what it measures, the source and typical values. Backtest history: FRED (Federal Reserve Economic Data), DGS10, from 1962-01-02.", zh: "10 年期美债收益率低于 5.0% 时通过。10Y 收益率分档之一；含义、数据来源和常见数值见 MAC-03。回测历史：FRED（美联储经济数据库），DGS10，自 1962-01-02 起。"}
    indicator: "treasury_ten_year_yield"
    operator: "less_than"
    value: 5.0
    band_of: "MAC-03"
    legacy_id: ["A07"]
  - rule_id: MAC-04
    name: {en: "10Y 20-day rise below 25bp", zh: "10Y 20 日升幅低于 25bp"}
    description: {en: "How much the 10-year Treasury yield has risen over the last 20 trading days, in bp (basis points; 1bp = 0.01 percentage point). Passes when the rise is under 25bp. A fast rise hurts stocks more than a high level. Source: FRED series DGS10. Typical values: ±25bp over 20 days is a clear move; a rise of 50bp or more in a month is fast (rule of thumb). Updated daily. Other tier: MAC-14. Backtest history: FRED (Federal Reserve Economic Data), DGS10, from 1962-01-02.", zh: "10 年期国债收益率最近 20 个交易日涨了多少，单位 bp（基点，1bp = 0.01 个百分点）。升幅小于 25bp 时通过。快速上行比高水平更容易让股市受伤。数据来源：FRED 的 DGS10 序列。常见情形：20 日 ±25bp 算明显波动，一个月升 50bp 以上算快速上行（经验）。每日更新。其他分档：MAC-14。回测历史：FRED（美联储经济数据库），DGS10，自 1962-01-02 起。"}
    indicator: "treasury_ten_year_yield_twenty_day_change_basis_points"
    operator: "less_than"
    value: 25
    legacy_id: ["A03"]
  - rule_id: MAC-14
    name: {en: "10Y 20-day rise below 50bp", zh: "10Y 20 日升幅低于 50bp"}
    description: {en: "Passes when the 10-year yield has risen less than 50bp over 20 days. One of the 10-year yield 20-day rise tiers; see MAC-04 for what it measures, the source and typical values. Backtest history: FRED (Federal Reserve Economic Data), DGS10, from 1962-01-02.", zh: "10Y 收益率 20 日升幅低于 50bp 时通过。10Y 收益率 20 日升幅分档之一；含义、数据来源和常见数值见 MAC-04。回测历史：FRED（美联储经济数据库），DGS10，自 1962-01-02 起。"}
    indicator: "treasury_ten_year_yield_twenty_day_change_basis_points"
    operator: "less_than"
    value: 50
    band_of: "MAC-04"
    legacy_id: []
  - rule_id: MAC-05
    name: {en: "HY spread below 400bp", zh: "HY 利差低于 400bp"}
    description: {en: "The extra yield junk bonds (HY, high-yield bonds rated below investment grade) pay over Treasuries, measured as OAS (option-adjusted spread). Passes when it is under 400bp. A widening spread signals rising credit risk and usually leads stock stress. Source: FRED series BAMLH0A0HYM2 (ICE BofA US High Yield OAS); FRED now keeps only about 3 years of history. Typical values: long-run average about 500bp; below 350bp is tight, above 500bp is stress, above 800bp is crisis (market convention). Updated daily. Other tier: MAC-15. Backtest history: FRED (Federal Reserve Economic Data), BAMLH0A0HYM2, from 2023-10-24.", zh: "高收益债（HY，评级低于投资级的债券，俗称垃圾债）比国债多付的利息，用 OAS（期权调整利差）衡量。低于 400bp 时通过。利差走阔代表信用风险上升，通常领先于股市压力。数据来源：FRED 的 BAMLH0A0HYM2 序列（ICE BofA 美国高收益债 OAS）；FRED 现在只保留约 3 年历史。常见情形：长期均值约 500bp；低于 350bp 偏紧，高于 500bp 是压力，高于 800bp 是危机（业界惯例）。每日更新。其他分档：MAC-15。回测历史：FRED（美联储经济数据库），BAMLH0A0HYM2，自 2023-10-24 起。"}
    indicator: "high_yield_credit_spread_basis_points"
    operator: "less_than"
    value: 400
    legacy_id: ["A04"]
  - rule_id: MAC-15
    name: {en: "HY spread below 500bp", zh: "HY 利差低于 500bp"}
    description: {en: "Passes when the HY credit spread is below 500bp. One of the HY spread tiers; see MAC-05 for what it measures, the source and typical values. Backtest history: FRED (Federal Reserve Economic Data), BAMLH0A0HYM2, from 2023-10-24.", zh: "HY 信用利差低于 500bp 时通过。HY 利差分档之一；含义、数据来源和常见数值见 MAC-05。回测历史：FRED（美联储经济数据库），BAMLH0A0HYM2，自 2023-10-24 起。"}
    indicator: "high_yield_credit_spread_basis_points"
    operator: "less_than"
    value: 500
    band_of: "MAC-05"
    legacy_id: []
  - rule_id: MAC-06
    name: {en: "Credit spread, 20-day change", zh: "信用利差 20 日变动"}
    description: {en: "How much the HY credit spread (see MAC-05) has widened over the last 20 trading days. Passes when the rise is under 50bp. A quick widening is an early sign of credit stress. Source: FRED series BAMLH0A0HYM2. Typical values: a rise of 50bp or more in 20 days is often read as credit stress (rule of thumb). Updated daily. Backtest history: FRED (Federal Reserve Economic Data), BAMLH0A0HYM2, from 2023-10-24.", zh: "HY 信用利差（见 MAC-05）最近 20 个交易日走阔了多少。升幅小于 50bp 时通过。短期快速走阔是信用压力的早期信号。数据来源：FRED 的 BAMLH0A0HYM2 序列。常见情形：20 日升幅 50bp 以上常被当作信用压力信号（经验）。每日更新。回测历史：FRED（美联储经济数据库），BAMLH0A0HYM2，自 2023-10-24 起。"}
    indicator: "high_yield_credit_spread_twenty_day_change_basis_points"
    operator: "less_than"
    value: 50
    legacy_id: ["A04"]
    note: {en: "Split from the old A04, where this half was never built", zh: "从旧 A04 拆出，这一半此前未实现"}
  - rule_id: MAC-22
    name: {en: "Baa spread below 2.8", zh: "Baa 利差低于 2.8"}
    description: {en: "Passes when Moody's seasoned Baa corporate bond yield minus the 10-year Treasury yield is below 2.8 percentage points. It is a long-history stand-in for the HY credit spread (MAC-05), which FRED only keeps for about 3 years. A wider gap means rising credit risk. The 2.8 is the 80th percentile of the spread since 1986 (measured). Source: FRED series BAA10Y, updated daily. Backtest history: FRED (Federal Reserve Economic Data), BAA10Y, from 1986.", zh: "穆迪 Baa 级公司债收益率减 10 年期国债收益率，低于 2.8 个百分点时通过。它是 HY 信用利差（MAC-05）的长历史替身，因为 FRED 只保留 HY 利差约 3 年。差距越大，说明信用风险越高。2.8 是 1986 年以来该利差的第 80 百分位（实测）。数据来源：FRED 的 BAA10Y 序列，每日更新。回测历史：FRED（美联储经济数据库），BAA10Y，自 1986 起。"}
    indicator: "moodys_baa_minus_ten_year_treasury_spread"
    operator: "less_than"
    value: 2.8
    legacy_id: []
  - rule_id: MAC-23
    name: {en: "Baa spread below 3.3", zh: "Baa 利差低于 3.3"}
    description: {en: "Passes when the Baa minus 10-year Treasury spread is below 3.3 percentage points, the 95th percentile since 1986 (measured). The looser line of MAC-22, which explains the measure. Source: FRED series BAA10Y. Backtest history: FRED (Federal Reserve Economic Data), BAA10Y, from 1986.", zh: "Baa 减 10 年期国债利差低于 3.3 个百分点时通过，这是 1986 年以来的第 95 百分位（实测）。它是 MAC-22 较宽松的一条线，含义见 MAC-22。数据来源：FRED 的 BAA10Y 序列。回测历史：FRED（美联储经济数据库），BAA10Y，自 1986 起。"}
    indicator: "moodys_baa_minus_ten_year_treasury_spread"
    operator: "less_than"
    value: 3.3
    band_of: "MAC-22"
    legacy_id: []
  - rule_id: MAC-07
    name: {en: "10Y minus 2Y above 0", zh: "10Y 减 2Y 大于 0"}
    description: {en: "Passes when the 10-year Treasury yield is above the 2-year yield, meaning the yield curve is not inverted. An inverted curve (short rates above long rates) is a common recession warning. Typical values: inversions have often come months to two years before recessions (rule of thumb). Source: FRED series T10Y2Y, updated daily. Backtest history: FRED (Federal Reserve Economic Data), T10Y2Y, from 1976.", zh: "10 年期国债收益率高于 2 年期，即收益率曲线没有倒挂时通过。倒挂（短期利率高于长期）常被当作衰退预警。常见情形：倒挂常领先衰退数月到两年（经验）。数据来源：FRED 的 T10Y2Y 序列，每日更新。回测历史：FRED（美联储经济数据库），T10Y2Y，自 1976 起。"}
    indicator: "treasury_ten_year_minus_two_year_spread"
    operator: "greater_than"
    value: 0
  - rule_id: MAC-17
    name: {en: "10Y minus 3M above 0", zh: "10Y 减 3M 大于 0"}
    description: {en: "Passes when the 10-year Treasury yield is above the 3-month yield. Another way to read the yield curve; see MAC-07 for why it matters. Source: FRED series T10Y3M, updated daily. Backtest history: FRED (Federal Reserve Economic Data), T10Y3M, from 1982.", zh: "10 年期国债收益率高于 3 个月期时通过。这是读收益率曲线的另一种方式，意义见 MAC-07。数据来源：FRED 的 T10Y3M 序列，每日更新。回测历史：FRED（美联储经济数据库），T10Y3M，自 1982 起。"}
    indicator: "treasury_ten_year_minus_three_month_spread"
    operator: "greater_than"
    value: 0
    legacy_id: []
  - rule_id: MAC-08
    name: {en: "CPI below 3%", zh: "CPI 低于 3%"}
    description: {en: "Passes when CPI (Consumer Price Index) inflation is below 3.0% year over year. High inflation forces the Fed to keep rates high, which holds valuations down. A backtest uses the value as first published at the time, so it sees only what was known then. Typical values: the Fed targets 2% inflation (PCE); CPI above 3% is high. Source: FRED series CPIAUCSL (first-published values from ALFRED, FRED's archive), updated monthly with a lag of 2 to 6 weeks. Backtest history: ALFRED (FRED's archive of values as first published), CPIAUCSL, from 1947.", zh: "CPI（消费者物价指数）同比低于 3.0% 时通过。通胀高会迫使美联储维持高利率，压住估值。回测使用当时首次公布的值，只看当时已知的信息。常见情形：美联储的目标是 2% 通胀（PCE）；CPI 高于 3% 算偏高。数据来源：FRED 的 CPIAUCSL 序列（首次公布的值来自 FRED 的历史版本库 ALFRED），月更，滞后 2–6 周。回测历史：ALFRED（FRED 的历史版本库，保存当时公布的值），CPIAUCSL，自 1947 起。"}
    indicator: "consumer_price_index_year_over_year_percent"
    operator: "less_than"
    value: 3.0
  - rule_id: MAC-18
    name: {en: "Core PCE below 2.5%", zh: "核心 PCE 低于 2.5%"}
    description: {en: "Passes when core PCE (Personal Consumption Expenditures price index excluding food and energy, the Fed's preferred gauge) inflation is below 2.5% year over year. See MAC-08 for why inflation matters. Source: FRED series PCEPILFE (first-published values from ALFRED), updated monthly. Backtest history: ALFRED (FRED's archive of values as first published), PCEPILFE, from 1959.", zh: "核心 PCE（剔除食品和能源的个人消费支出物价指数，美联储偏好的指标）同比低于 2.5% 时通过。通胀为什么重要见 MAC-08。数据来源：FRED 的 PCEPILFE 序列（首次公布的值来自 ALFRED），月更。回测历史：ALFRED（FRED 的历史版本库，保存当时公布的值），PCEPILFE，自 1959 起。"}
    indicator: "core_pce_price_index_year_over_year_percent"
    operator: "less_than"
    value: 2.5
    legacy_id: []
  - rule_id: MAC-09
    name: {en: "Sahm rule below 0.5", zh: "Sahm 指标低于 0.5"}
    description: {en: "Passes when the Sahm rule recession indicator is below 0.5. It is the 3-month average unemployment rate minus its lowest level of the last 12 months; a reading of 0.5 or more has marked the start of past recessions. Worsening jobs mean higher earnings risk. Source: FRED series SAHMREALTIME, updated monthly. Backtest history: FRED (Federal Reserve Economic Data), SAHMREALTIME, from 1959.", zh: "Sahm 衰退指标低于 0.5 时通过。它是失业率 3 个月均值减去过去 12 个月的最低值；读数达到 0.5 以上，过去往往标志着衰退的开始。就业恶化意味着企业盈利风险上升。数据来源：FRED 的 SAHMREALTIME 序列，月更。回测历史：FRED（美联储经济数据库），SAHMREALTIME，自 1959 起。"}
    indicator: "sahm_rule_recession_indicator"
    operator: "less_than"
    value: 0.5
  - rule_id: MAC-19
    name: {en: "Jobless claims below 300k", zh: "初请失业金低于 30 万"}
    description: {en: "Passes when the 4-week average of initial jobless claims (weekly new unemployment filings) is below 300,000. Claims of 200,000 to 250,000 are stable and above 300,000 is worsening (rule of thumb). See MAC-09 for why jobs matter. Source: FRED series ICSA, updated weekly. Backtest history: FRED (Federal Reserve Economic Data), ICSA, from 1967.", zh: "初请失业金人数（每周新增失业申请）的 4 周均值低于 30 万时通过。每周 20–25 万稳定，高于 30 万算恶化（经验）。就业为什么重要见 MAC-09。数据来源：FRED 的 ICSA 序列，周更。回测历史：FRED（美联储经济数据库），ICSA，自 1967 起。"}
    indicator: "initial_jobless_claims_four_week_average"
    operator: "less_than"
    value: 300000
    legacy_id: []
  - rule_id: MAC-20
    name: {en: "Activity index above -0.7", zh: "活动指数高于 -0.7"}
    description: {en: "Passes when the 3-month average of the CFNAI (Chicago Fed National Activity Index, a broad gauge of US economic activity) is above -0.7, the level the Chicago Fed links to recession risk (from its documentation, not verified here). The old PMI idea is dropped because the ISM PMI is no longer on FRED. Source: FRED series CFNAIMA3, updated monthly. Backtest history: FRED (Federal Reserve Economic Data), CFNAIMA3, from 1967.", zh: "CFNAI（芝加哥联储全国活动指数，衡量美国经济整体活动）的 3 个月均值高于 -0.7 时通过，芝加哥联储把这个水平与衰退风险联系起来（来自其文档，这里没有验证）。原来的 PMI 思路已删除，因为 ISM PMI 已从 FRED 下架。数据来源：FRED 的 CFNAIMA3 序列，月更。回测历史：FRED（美联储经济数据库），CFNAIMA3，自 1967 起。"}
    indicator: "chicago_fed_national_activity_index_three_month_average"
    operator: "greater_than"
    value: -0.7
    legacy_id: []
  - rule_id: MAC-10
    name: {en: "Dollar 20-day rise below 2%", zh: "美元 20 日升幅低于 2%"}
    description: {en: "Passes when the US dollar index (DXY) rose less than 2% over the last 20 trading days. Trend of the US dollar. A stronger dollar tightens global financial conditions and hurts multinational earnings and risk assets. Source: FRED series DTWEXBGS (broad dollar index, about one week behind) or Yahoo Finance DX-Y.NYB (the DXY dollar index) via yfinance. Typical values: DXY usually trades between 90 and 110; a 20-day move of ±2% is clear (rule of thumb). Backtest history: Yahoo Finance via yfinance, DX-Y.NYB, from 1971.", zh: "美元指数（DXY）最近 20 个交易日涨幅小于 2% 时通过。美元走势。美元走强通常收紧全球金融环境，对跨国公司盈利和风险资产不利。数据来源：FRED 的 DTWEXBGS 序列（广义美元指数，约滞后一周），或通过 yfinance 取 Yahoo Finance 的 DX-Y.NYB（DXY 美元指数）。常见情形：DXY 通常在 90–110 之间；20 日变动 ±2% 算明显（经验）。回测历史：通过 yfinance 取 Yahoo Finance，DX-Y.NYB，自 1971 起。"}
    indicator: "us_dollar_index_twenty_day_change_percent"
    operator: "less_than"
    value: 2
  - rule_id: MAC-11
    name: {en: "WTI below $100", zh: "WTI 低于 $100"}
    description: {en: "Passes when WTI crude oil (West Texas Intermediate, the US oil benchmark) is below $100 a barrel. Very high or fast-rising oil lifts inflation, squeezes consumers and shakes markets. Source: FRED series DCOILWTICO (a few days behind) or Yahoo Finance CL=F futures via yfinance. Typical values: over the last ten years WTI mostly traded between $40 and $120; $100 is a rule-of-thumb line. The one-month rise limit is split out as MAC-16. Backtest history: FRED (Federal Reserve Economic Data), DCOILWTICO, from 1986.", zh: "WTI 原油（西德州中质原油，美国原油基准）低于每桶 $100 时通过。油价过高或涨得太快会推高通胀、挤压消费、扰动市场。数据来源：FRED 的 DCOILWTICO 序列（滞后几天），或通过 yfinance 取 Yahoo Finance 的 CL=F 期货。常见情形：近十年 WTI 多在 $40–$120；$100 是经验线。月涨幅上限已拆成 MAC-16。回测历史：FRED（美联储经济数据库），DCOILWTICO，自 1986 起。"}
    indicator: "wti_crude_oil_price"
    operator: "less_than"
    value: 100
    legacy_id: ["Z12"]
  - rule_id: MAC-16
    name: {en: "WTI 1-month rise below 15%", zh: "WTI 月涨幅低于 15%"}
    description: {en: "Passes when the one-month rise in WTI crude oil is below 15%. Split out of MAC-11, which holds the price limit; see MAC-11 for what WTI is and the source. Backtest history: FRED (Federal Reserve Economic Data), DCOILWTICO, from 1986.", zh: "WTI 原油月涨幅低于 15% 时通过。从 MAC-11 拆出（价格上限在 MAC-11）；WTI 的含义和数据来源见 MAC-11。回测历史：FRED（美联储经济数据库），DCOILWTICO，自 1986 起。"}
    indicator: "wti_crude_oil_one_month_change_percent"
    operator: "less_than"
    value: 15
    legacy_id: ["Z12"]
  - rule_id: MAC-12
    name: {en: "M2 growing", zh: "M2 在增长"}
    description: {en: "Passes when M2 (a broad measure of money in the economy) is higher than a year ago. Easy liquidity helps risk assets; shrinking money hurts them. Typical values: M2 growth above 5% a year is fairly loose (rule of thumb). Source: FRED series M2SL, updated monthly with a lag of about 1.5 months. Backtest history: FRED (Federal Reserve Economic Data), M2SL, from 1959.", zh: "M2（广义货币供应）比一年前高时通过。流动性宽松对风险资产有利，货币收缩则不利。常见情形：M2 年增速高于 5% 算偏宽松（经验）。数据来源：FRED 的 M2SL 序列，月更，滞后约 1.5 个月。回测历史：FRED（美联储经济数据库），M2SL，自 1959 起。"}
    indicator: "m2_money_supply_year_over_year_percent"
    operator: "greater_than"
    value: 0
  - rule_id: MAC-21
    name: {en: "Fed assets not shrinking", zh: "美联储资产未缩表"}
    description: {en: "Passes when the Fed's total assets did not fall over the last 13 weeks, meaning its balance sheet is not shrinking. Shrinking central bank assets drain liquidity from risk assets; see MAC-12. Source: FRED series WALCL, updated weekly. Backtest history: FRED (Federal Reserve Economic Data), WALCL, from 2002.", zh: "美联储总资产在最近 13 周没有下降，即资产负债表没有缩小时通过。央行资产缩小会从风险资产中抽走流动性，见 MAC-12。数据来源：FRED 的 WALCL 序列，周更。回测历史：FRED（美联储经济数据库），WALCL，自 2002 起。"}
    indicator: "federal_reserve_total_assets_thirteen_week_change_percent"
    operator: "greater_or_equal"
    value: 0
    legacy_id: []
  # IND · Industry
  - rule_id: IND-01
    name: {en: "Sector beats SPY", zh: "行业跑赢 SPY"}
    description: {en: "Passes when the sector ETF of the stock's industry beat SPY over the last 126 trading days. Whether the stock's industry has recently beaten or lagged the market. A strong industry lifts its stocks. Compares the sector ETF (a fund that holds one industry, such as XLK for technology) with SPY (the fund tracking the S&P 500) over 6 months. Source: Yahoo Finance via yfinance. Typical values: a sector ETF that beats SPY over 6 months is seen as strong. Updated daily. Backtest history: Yahoo Finance via yfinance, sector-etfs, from 1998.", zh: "该股所属行业的 ETF 在最近 126 个交易日跑赢 SPY 时通过。这只股票所在的行业最近跑赢还是跑输大盘。行业走强会带动个股。用行业 ETF（持有某个行业的基金，比如科技的 XLK）与 SPY（跟踪标普 500 的基金）比较 6 个月的涨幅。数据来源：通过 yfinance 取 Yahoo Finance。常见情形：行业 ETF 的 6 个月收益跑赢 SPY 算强。每日更新。回测历史：通过 yfinance 取 Yahoo Finance，sector-etfs，自 1998 起。"}
    indicator: "sector_etf_return_minus_spy_return_one_hundred_twenty_six_day"
    operator: "greater_than"
    value: 0
  - rule_id: IND-02
    name: {en: "Industry estimates rising", zh: "行业预期上调"}
    description: {en: "Passes when the median 4-week change of next-year EPS (earnings per share) estimates across the industry's S&P 500 stocks is above 0. Rising analyst estimates for a whole industry show its cycle is improving. Needs a point-in-time list of S&P 500 members and weekly estimate snapshots. Source: the community DoltHub earnings database (weekly snapshots). Backtest history: the community DoltHub databases, earnings, from 2017-10-26.", zh: "该行业的标普 500 成分股，下一年 EPS（每股收益）预期的 4 周变化中位数大于 0 时通过。整个行业的分析师预期在上调，说明行业景气在改善。需要标普 500 的历史成分股名单和每周的预期快照。数据来源：社区 DoltHub 盈利数据库（每周快照）。回测历史：社区 DoltHub 数据库，earnings，自 2017-10-26 起。"}
    indicator: "sector_next_year_eps_estimate_four_week_change_median_percent"
    operator: "greater_than"
    value: 0
    note: {en: "Difficulty 5, not planned yet: it needs the next-year EPS estimates of every stock in the sector, hundreds of requests per refresh.", zh: "难度 5，暂不实现：需要抓取行业内每只股票的下一年 EPS 预期，每次刷新要几百次请求。"}
  # QUA · Company quality
  - rule_id: QUA-01
    name: {en: "Profitable", zh: "盈利为正"}
    description: {en: "Passes when the company made a profit over the last 12 months (EPS, earnings per share, TTM, trailing twelve months, above 0). Loss-making companies swing more and are riskier to be assigned. Source: Yahoo Finance via yfinance; SEC EDGAR company facts are a steadier alternative. Updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "公司最近 12 个月赚钱（EPS，每股收益，TTM 即过去十二个月，大于 0）时通过。亏损公司波动更大，被行权接盘的风险更高。数据来源：通过 yfinance 取 Yahoo Finance；更稳定的替代是 SEC EDGAR（美国证监会披露系统）的公司数据。按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "trailing_twelve_month_eps"
    operator: "greater_than"
    value: 0
    legacy_id: ["F01"]
  - rule_id: QUA-02
    name: {en: "Revenue growth", zh: "营收增长"}
    description: {en: "Passes when revenue is higher than a year earlier. A company with no sales growth rarely rises for long. Source: Yahoo Finance via yfinance (latest quarter, year over year); SEC EDGAR as a backup. Updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "营收比去年同期增长时通过。没有销售增长的公司很难长期上涨。数据来源：通过 yfinance 取 Yahoo Finance（最近一季同比）；备选是 SEC EDGAR。按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "revenue_year_over_year_percent"
    operator: "greater_than"
    value: 0
    legacy_id: ["F01"]
  - rule_id: QUA-03
    name: {en: "Revenue 3-year growth", zh: "营收 3 年增速"}
    description: {en: "Passes when the 3-year CAGR (compound annual growth rate) of revenue is at least 10%. Revenue growth that lasts is a sign of a quality business, not a one-off. Typical values: a 3-year CAGR above 10% is typical of quality growth stocks (rule of thumb). Source: SEC EDGAR financial statements, updated each quarter or year. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "营收的 3 年 CAGR（复合年增长率）不低于 10% 时通过。持续的营收增长说明是优质业务，而不是一次性的。常见情形：优质成长股的 3 年 CAGR 常在 10% 以上（经验）。数据来源：SEC EDGAR 财务报表，按季或按年更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "revenue_three_year_cagr_percent"
    operator: "greater_or_equal"
    value: 10
  - rule_id: QUA-13
    name: {en: "EPS 3-year growth", zh: "EPS 3 年增速"}
    description: {en: "Passes when the 3-year CAGR of EPS (earnings per share) is at least 10%. The earnings side of QUA-03. Source: SEC EDGAR financial statements, updated each quarter or year. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "EPS（每股收益）的 3 年 CAGR 不低于 10% 时通过。这是 QUA-03 的盈利那一边。数据来源：SEC EDGAR 财务报表，按季或按年更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "eps_three_year_cagr_percent"
    operator: "greater_or_equal"
    value: 10
    legacy_id: []
  - rule_id: QUA-04
    name: {en: "ROIC at least 15%", zh: "ROIC 不低于 15%"}
    description: {en: "Passes when ROIC (return on invested capital: operating profit after 21% tax, divided by debt plus equity minus cash) is at least 15%. High and steady for 5 to 10 years is a common moat test, a sign of a lasting competitive advantage (Buffett-style rule of thumb). ROE is checked separately in QUA-14 because buybacks can distort it. Source: SEC EDGAR financial statements, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "ROIC（投入资本回报率：扣除 21% 税后的营业利润，除以债务加权益减现金）不低于 15% 时通过。长期又高又稳（5–10 年）是常见的护城河检验，说明有持久的竞争优势（巴菲特式经验）。ROE 会被回购扭曲，所以单独放在 QUA-14。数据来源：SEC EDGAR 财务报表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "return_on_invested_capital_percent"
    operator: "greater_or_equal"
    value: 15
  - rule_id: QUA-14
    name: {en: "ROE at least 15%", zh: "ROE 不低于 15%"}
    description: {en: "Passes when ROE (return on equity) is at least 15%. ROE can be inflated by buybacks, so it is paired with ROIC in QUA-04. Source: SEC EDGAR financial statements, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "ROE（股本回报率）不低于 15% 时通过。ROE 会被回购推高，所以和 QUA-04 的 ROIC 配对使用。数据来源：SEC EDGAR 财务报表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "return_on_equity_percent"
    operator: "greater_or_equal"
    value: 15
    legacy_id: []
  - rule_id: QUA-05
    name: {en: "Gross margin at least 40%", zh: "毛利率不低于 40%"}
    description: {en: "Passes when the gross margin is at least 40%. Share of each sales dollar left after the direct cost of goods (gross margin). A high and stable margin means pricing power. Source: Yahoo Finance via yfinance; SEC EDGAR for history. Updated each quarter. Typical values: above 40% is common for brands and software; retail below 30% is normal. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "毛利率不低于 40% 时通过。每一块钱销售额扣掉直接成本后剩下的比例（毛利率）。毛利率高且稳定，说明有定价权。数据来源：通过 yfinance 取 Yahoo Finance；历史用 SEC EDGAR。按季更新。常见情形：品牌和软件公司常高于 40%；零售低于 30% 属正常。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "gross_margin_percent"
    operator: "greater_or_equal"
    value: 40
  - rule_id: QUA-06
    name: {en: "FCF positive", zh: "自由现金流为正"}
    description: {en: "Passes when TTM (trailing twelve months) FCF (free cash flow, the cash left after capital spending) is above 0. It is harder to fake than accounting profit and is central to value investing. Growth is checked by QUA-15. Source: SEC EDGAR cash flow statements, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "TTM（过去十二个月）FCF（自由现金流，扣除资本开支后剩下的现金）大于 0 时通过。它比账面利润更难造假，是价值投资的核心。增长由 QUA-15 检查。数据来源：SEC EDGAR 现金流量表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "trailing_twelve_month_free_cash_flow"
    operator: "greater_than"
    value: 0
  - rule_id: QUA-15
    name: {en: "FCF growing", zh: "自由现金流增长"}
    description: {en: "Passes when TTM free cash flow is higher than a year earlier. See QUA-06. Source: SEC EDGAR cash flow statements, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "TTM 自由现金流比一年前高时通过，见 QUA-06。数据来源：SEC EDGAR 现金流量表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "free_cash_flow_year_over_year_change"
    operator: "greater_than"
    value: 0
    legacy_id: []
  - rule_id: QUA-07
    name: {en: "Net debt to EBITDA below 2", zh: "净负债/EBITDA 低于 2"}
    description: {en: "Passes when net debt to EBITDA is below 2. Whether debt is manageable relative to earnings: net debt (debt minus cash) divided by EBITDA (earnings before interest, taxes, depreciation and amortization), plus interest coverage (how many times profit covers interest). Heavily indebted companies get into trouble in recessions or when rates rise. Source: Yahoo Finance via yfinance balance sheet. Typical values: net debt to EBITDA below 2 is sound and above 4 is high; interest coverage above 5 is comfortable (rule of thumb). Other tier: QUA-11. Interest coverage is split out as QUA-12. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "净负债/EBITDA 低于 2 时通过。债务相对盈利是否可控：净债务（债务减现金）除以 EBITDA（息税折旧摊销前利润），以及利息覆盖倍数（利润能覆盖利息几倍）。负债过高的公司在衰退或加息时容易出问题。数据来源：通过 yfinance 取 Yahoo Finance 的资产负债表。常见情形：净债务/EBITDA 低于 2 稳健，高于 4 偏高；利息覆盖高于 5 倍算宽裕（经验）。其他分档：QUA-11。利息保障倍数已拆成 QUA-12。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "net_debt_to_ebitda"
    operator: "less_than"
    value: 2
  - rule_id: QUA-11
    name: {en: "Net debt to EBITDA below 4", zh: "净负债/EBITDA 低于 4"}
    description: {en: "Passes when net debt to EBITDA is below 4. One of the net debt to EBITDA tiers; see QUA-07 for what it measures, the source and typical values. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "净负债/EBITDA 低于 4 时通过。净负债/EBITDA 分档之一；含义、数据来源和常见数值见 QUA-07。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "net_debt_to_ebitda"
    operator: "less_than"
    value: 4
    band_of: "QUA-07"
    legacy_id: []
  - rule_id: QUA-12
    name: {en: "Interest coverage above 5", zh: "利息保障倍数高于 5"}
    description: {en: "Passes when interest coverage (how many times operating profit covers interest payments) is above 5. Split out of QUA-07; see QUA-07 for the source and typical values. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "利息保障倍数（营业利润能覆盖利息支出几倍）高于 5 时通过。从 QUA-07 拆出；数据来源和常见数值见 QUA-07。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "interest_coverage_ratio"
    operator: "greater_than"
    value: 5
    legacy_id: []
  - rule_id: QUA-08
    name: {en: "Cash flow covers profit", zh: "现金流覆盖利润"}
    description: {en: "Passes when TTM operating cash flow divided by net income is at least 1.0. How much of reported profit turned into real cash: operating cash flow divided by net income, and accruals (non-cash accounting items). A big gap suggests profit may be inflated. Source: Yahoo Finance via yfinance cash flow and income statements. Typical values: operating cash flow to net income of 1 or more is good; 0.8 to 1.2 is common. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "TTM 经营现金流除以净利润不低于 1.0 时通过。账面利润有多少变成了真金白银：经营现金流除以净利润，以及应计项目（不涉及现金的会计项目）。差距大说明利润可能含水分。数据来源：通过 yfinance 取 Yahoo Finance 的现金流量表和利润表。常见情形：经营现金流/净利润达到 1 以上为佳；0.8–1.2 常见。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "operating_cash_flow_to_net_income_ratio"
    operator: "greater_or_equal"
    value: 1.0
  - rule_id: QUA-16
    name: {en: "Cash flow covers 80% of profit", zh: "现金流覆盖 80% 利润"}
    description: {en: "Passes when TTM operating cash flow divided by net income is at least 0.8. The looser line of QUA-08, which explains the measure. Source: SEC EDGAR cash flow and income statements. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "TTM 经营现金流除以净利润不低于 0.8 时通过。这是 QUA-08 较宽松的一条线，含义见 QUA-08。数据来源：SEC EDGAR 现金流量表和利润表。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "operating_cash_flow_to_net_income_ratio"
    operator: "greater_or_equal"
    value: 0.8
    band_of: "QUA-08"
    legacy_id: []
  - rule_id: QUA-09
    name: {en: "Estimates rising", zh: "预期上调"}
    description: {en: "Passes when the consensus next-year EPS (earnings per share) estimate is higher than four weeks ago. Upgrades usually go with price support. Typical values: upgrades outnumbering downgrades is positive. Live: yfinance eps_trend (current value against 30 days ago). History: weekly snapshots in the community DoltHub earnings database. Backtest history: the community DoltHub databases, earnings, from 2017-10-26.", zh: "下一年 EPS（每股收益）的一致预期比四周前高时通过。上调通常伴随股价支撑。常见情形：上调多于下调为正面。实时：yfinance 的 eps_trend（当前值对 30 天前）。历史：社区 DoltHub 盈利数据库的每周快照。回测历史：社区 DoltHub 数据库，earnings，自 2017-10-26 起。"}
    indicator: "eps_estimate_next_year_four_week_change_percent"
    operator: "greater_than"
    value: 0
    legacy_id: ["Z17"]
  - rule_id: QUA-10
    name: {en: "Buy ratings above 60%", zh: "买入评级超过 60%"}
    description: {en: "Passes when more than 60% of the brokers that changed or repeated a rating in the last 12 months have a buy-type latest rating (Buy, Outperform or Overweight). It shows market consensus, but a very one-sided view is also a warning. It is rebuilt from the Yahoo Finance rating-change history, so it differs from the number of recommendations Yahoo shows. Updated daily. Backtest history: Yahoo Finance via yfinance, upgrades_downgrades, from 2012-09.", zh: "最近 12 个月里调整或重申过评级的券商中，最新评级是买入类（Buy、Outperform、Overweight）的占比超过 60% 时通过。它反映市场共识，但观点过于一边倒时也要警惕。它由 Yahoo Finance 的评级变动历史重建，所以和 Yahoo 显示的推荐家数口径不同。每日更新。回测历史：通过 yfinance 取 Yahoo Finance，upgrades_downgrades，自 2012-09 起。"}
    indicator: "buy_rating_share_percent"
    operator: "greater_than"
    value: 60
    legacy_id: ["F01"]
  # MGT · Management and governance
  - rule_id: MGT-01
    name: {en: "Insider selling small", zh: "内部人卖出很少"}
    description: {en: "Passes when net open-market selling by insiders (transaction code S minus P) over the last 180 days is below 0.5% of shares outstanding. Selling is often just stock compensation, so the line is loose; the 0.5% is a first guess to be tuned on history. Source: SEC Form 3, 4 and 5 data sets (insider trade reports, filed within 2 business days). Updated every quarter in history, daily live from EDGAR. Backtest history: SEC EDGAR filings (valued as of the filing date), form345, from 2006.", zh: "内部人最近 180 天的公开市场净卖出（交易代码 S 减 P）低于总股数的 0.5% 时通过。卖出常常只是股权激励，所以这条线比较宽松；0.5% 是第一版猜测，要用历史数据校准。数据来源：SEC Form 3、4、5 数据集（内部人交易报告，须在 2 个工作日内披露）。历史按季更新，实时每日取自 EDGAR。回测历史：SEC EDGAR 披露文件（按披露日期取值），form345，自 2006 起。"}
    indicator: "insider_net_open_market_selling_percent_of_shares_180_days"
    operator: "less_than"
    value: 0.5
  - rule_id: MGT-05
    name: {en: "Insider bought", zh: "内部人买入"}
    description: {en: "Passes when at least one insider bought shares on the open market (transaction code P) in the last 90 days. Buying with their own money is a stronger positive signal than selling. Source: SEC Form 3, 4 and 5 data sets. Backtest history: SEC EDGAR filings (valued as of the filing date), form345, from 2006.", zh: "最近 90 天内至少有一位内部人在公开市场买入（交易代码 P）时通过。自掏腰包买入是比卖出更强的正面信号。数据来源：SEC Form 3、4、5 数据集。回测历史：SEC EDGAR 披露文件（按披露日期取值），form345，自 2006 起。"}
    indicator: "insider_open_market_purchase_count_90_days"
    operator: "greater_or_equal"
    value: 1
    legacy_id: []
  - rule_id: MGT-02
    name: {en: "Share count not rising", zh: "股数没有增加"}
    description: {en: "Passes when the share count is not higher than a year ago (the company is buying back). Whether the company is buying back its shares (share count falling) or issuing more (shareholders diluted). A steady fall of 1% to 3% a year is typical of regular buybacks; a rise above 2% a year is dilution. Source: Yahoo Finance via yfinance balance sheet (ordinary shares). Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "总股数不比一年前多（公司在回购）时通过。公司是在回购股票（股数下降），还是不断增发（股东被稀释）。每年稳定下降 1%–3% 是常见的持续回购，每年上升超过 2% 就是稀释。数据来源：通过 yfinance 取 Yahoo Finance 资产负债表里的普通股股数。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "shares_outstanding_year_over_year_percent"
    operator: "less_or_equal"
    value: 0
  - rule_id: MGT-06
    name: {en: "Share count up at most 2%", zh: "股数增幅不超过 2%"}
    description: {en: "Passes when the share count is at most 2% higher than a year ago. The looser line of MGT-02, which explains the measure. Source: SEC EDGAR balance sheets, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "总股数比一年前多出不超过 2% 时通过。这是 MGT-02 较宽松的一条线，含义见 MGT-02。数据来源：SEC EDGAR 资产负债表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "shares_outstanding_year_over_year_percent"
    operator: "less_or_equal"
    value: 2
    band_of: "MGT-02"
    legacy_id: []
  - rule_id: MGT-03
    name: {en: "Dividend covered", zh: "分红被覆盖"}
    description: {en: "Passes when dividends paid divided by TTM FCF (free cash flow) are at most 0.8, or the company pays no dividend. A dividend that the cash flow covers is sustainable. The old part about acquisitions creating value is dropped because it cannot be measured. Source: SEC EDGAR cash flow statements, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "分红除以 TTM FCF（自由现金流）不超过 0.8，或公司不分红时通过。现金流能覆盖的分红才可持续。原来“并购是否创造价值”那一部分无法量化，已删除。数据来源：SEC EDGAR 现金流量表，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "dividend_to_free_cash_flow_ratio"
    operator: "less_or_equal"
    value: 0.8
  - rule_id: MGT-04
    name: {en: "No audit red flags", zh: "无审计预警"}
    description: {en: "Passes when the company has no auditor change (8-K Item 4.01), no statement that past financials can no longer be relied on (8-K Item 4.02) and no late-filing notice (NT 10-K or NT 10-Q) in the last 365 days. These usually hit the share price hard once exposed. Source: SEC EDGAR submissions (each filing lists its 8-K item numbers). Updated daily. Backtest history: SEC EDGAR filings (valued as of the filing date), submissions, from 2004.", zh: "最近 365 天内没有更换审计师（8-K 第 4.01 项）、没有声明过往财报不可再依赖（8-K 第 4.02 项）、也没有迟交财报通知（NT 10-K 或 NT 10-Q）时通过。这类问题一旦暴露，往往重挫股价。数据来源：SEC EDGAR 的申报列表（每份申报都列出 8-K 的项目号）。每日更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），submissions，自 2004 起。"}
    indicator: "no_audit_or_late_filing_problem_in_last_365_days"
    operator: "is_true"
  # VAL · Valuation
  - rule_id: VAL-01
    name: {en: "S&P 500 forward PE below 22", zh: "标普 500 Forward PE 低于 22"}
    description: {en: "Passes when the S&P 500 forward PE is below 22. Forward PE (price-to-earnings ratio using analysts' expected earnings for the next 12 months) of the S&P 500, and where it sits in its own history. It tells whether the whole market is expensive. Source: FactSet Earnings Insight (weekly) or Yardeni Research, read by an AI; multpl.com gives only trailing PE. Typical values: long-run average about 16 to 17; above 22 is expensive (rule of thumb, not verified). Updated weekly. Backtest history: Wayback Machine snapshots of S&P Dow Jones Indices files, sp-dji-eps, from 2020-07.", zh: "标普 500 的 Forward PE 低于 22 时通过。标普 500 的 Forward PE（用分析师预期的未来 12 个月盈利算的市盈率）及其在历史中的位置，用来判断整个市场贵不贵。数据来源：FactSet 的 Earnings Insight（周报）或 Yardeni Research，由 AI 读取；multpl.com 只提供 TTM 市盈率。常见情形：长期均值约 16–17；高于 22 偏贵（经验，未核实）。每周更新。回测历史：Wayback 保存的 S&P DJI 文件快照，sp-dji-eps，自 2020-07 起。"}
    indicator: "sp500_forward_pe"
    operator: "less_than"
    value: 22
    note: {en: "Difficulty 5, not planned yet: the only free source is the weekly FactSet Earnings Insight PDF, whose layout changes and has to be read by hand or by an AI.", zh: "难度 5，暂不实现：唯一的免费来源是 FactSet 每周发布的 Earnings Insight PDF，版式会变，只能人工或用 AI 读取。"}
  - rule_id: VAL-03
    name: {en: "Equity premium positive", zh: "股权风险溢价为正"}
    description: {en: "Passes when the S&P 500 earnings yield (1 divided by the PE) minus the 10-year Treasury yield is above 0. ERP (equity risk premium) in its simple form: earnings yield (1 divided by PE) minus the 10-year Treasury yield. If it is negative, stocks pay less than Treasuries. Source: Yahoo Finance via yfinance for PE and FRED series DGS10 for the yield. Typical values: a negative result means stocks look expensive against Treasuries (simplified Fed model). Updated daily. Backtest history: Robert Shiller's online data, ie_data, from 1962.", zh: "标普 500 的盈利收益率（市盈率的倒数）减 10 年期国债收益率大于 0 时通过。股权风险溢价（ERP）的简化版：盈利收益率（1 除以市盈率）减去 10 年期国债收益率。为负说明买股票的回报还不如国债。数据来源：市盈率通过 yfinance 取 Yahoo Finance，收益率取 FRED 的 DGS10 序列。常见情形：结果为负，说明相对国债股票偏贵（简化的 Fed 模型）。每日更新。回测历史：Shiller 在线数据，ie_data，自 1962 起。"}
    indicator: "equity_risk_premium_simple_percent"
    operator: "greater_than"
    value: 0
  - rule_id: VAL-11
    name: {en: "Shiller CAPE below 30", zh: "Shiller CAPE 低于 30"}
    description: {en: "Passes when the Shiller CAPE (cyclically adjusted PE: the S&P 500 price divided by its 10-year average of inflation-adjusted earnings) is below 30. A long-history valuation gauge; the 30 is a rule of thumb. Source: Robert Shiller's monthly data file (Excel, needs the xlrd package), updated monthly. Backtest history: Robert Shiller's online data, ie_data, from 1881.", zh: "Shiller CAPE（周期调整市盈率：标普 500 价格除以 10 年通胀调整后盈利的均值）低于 30 时通过。这是一个长历史的估值尺子，30 是经验值。数据来源：Robert Shiller 的月度数据文件（Excel，需要 xlrd 包），月更。回测历史：Shiller 在线数据，ie_data，自 1881 起。"}
    indicator: "shiller_cape"
    operator: "less_than"
    value: 30
    legacy_id: []
  - rule_id: VAL-12
    name: {en: "Implied ERP at least 4%", zh: "隐含 ERP 不低于 4%"}
    description: {en: "Passes when Damodaran's implied ERP (equity risk premium: the extra return the market is pricing for holding stocks instead of Treasuries) is at least 4%. A higher premium means stocks are cheaper against bonds. Source: Aswath Damodaran's monthly implied premium file (Excel), updated monthly. Backtest history: Aswath Damodaran's implied equity risk premium data, implied-erp, from 2008-09.", zh: "Damodaran 的隐含 ERP（股权风险溢价：市场为持有股票而不是国债所要求的额外回报）不低于 4% 时通过。溢价越高，说明股票相对债券越便宜。数据来源：Aswath Damodaran 的月度隐含溢价文件（Excel），月更。回测历史：Damodaran 的隐含股权风险溢价数据，implied-erp，自 2008-09 起。"}
    indicator: "damodaran_implied_equity_risk_premium_percent"
    operator: "greater_or_equal"
    value: 4
    legacy_id: []
  - rule_id: VAL-04
    name: {en: "Market cap to GDP below 200%", zh: "市值/GDP 低于 200%"}
    description: {en: "Passes when US non-financial corporate equities (Fed Z.1 report) divided by GDP are below 200%. Total stock market value divided by GDP (gross domestic product), the Buffett indicator, used to judge whether the market as a whole is overheated. Here a non-standard version is used: US non-financial corporate equities from the Fed's Z.1 flow of funds report divided by GDP. Source: FRED series NCBEILQ027S and GDP, quarterly with a 2 to 3 month lag. Typical values: the standard version above 150% is often called expensive (rule of thumb); this non-standard version gives different numbers. Backtest history: FRED (Federal Reserve Economic Data), NCBEILQ027S, from 1947.", zh: "美国非金融企业股权市值（美联储 Z.1 报告）除以 GDP 低于 200% 时通过。股市总市值除以 GDP（国内生产总值），即巴菲特指标，用来判断整个市场是否过热。这里用的是非标准版本：美联储 Z.1 资金流量表里的美国非金融企业股权市值除以 GDP。数据来源：FRED 的 NCBEILQ027S 和 GDP 序列，季更，滞后 2–3 个月。常见情形：标准版本高于 150% 常被称为偏贵（经验）；这个非标准版本的数值不同。回测历史：FRED（美联储经济数据库），NCBEILQ027S，自 1947 起。"}
    indicator: "market_value_to_gdp_percent"
    operator: "less_than"
    value: 200
  - rule_id: VAL-14
    name: {en: "Market cap to GDP below 150%", zh: "市值/GDP 低于 150%"}
    description: {en: "Passes when US non-financial corporate equities divided by GDP are below 150%. The stricter line of VAL-04, which explains the measure. Source: FRED series NCBEILQ027S and GDP, quarterly with a lag of 2 to 3 months. Backtest history: FRED (Federal Reserve Economic Data), NCBEILQ027S, from 1947.", zh: "美国非金融企业股权市值除以 GDP 低于 150% 时通过。这是 VAL-04 较严格的一条线，含义见 VAL-04。数据来源：FRED 的 NCBEILQ027S 和 GDP 序列，季更，滞后 2–3 个月。回测历史：FRED（美联储经济数据库），NCBEILQ027S，自 1947 起。"}
    indicator: "market_value_to_gdp_percent"
    operator: "less_than"
    value: 150
    band_of: "VAL-04"
    legacy_id: []
  - rule_id: VAL-05
    name: {en: "PE below own median", zh: "PE 低于自身中位数"}
    description: {en: "Passes when the TTM PE is below its own 5-year median (the ratio is below 1.0). PE (price divided by earnings per share) on TTM (trailing twelve months) actual earnings, and whether it is above or below the stock's own history. Long-run S&P 500 average is roughly 16 to 17. Source: Yahoo Finance via yfinance for the current value; history must be rebuilt from SEC EDGAR EPS. Typical values: growth stocks at 25 to 35 are common. Updated daily. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "TTM 市盈率低于它自己 5 年的中位数（比值小于 1.0）时通过。按 TTM（过去十二个月）实际盈利算的市盈率（价格除以每股收益），以及比这只股票自身历史贵还是便宜。标普 500 长期平均大约在 16–17。数据来源：当前值通过 yfinance 取 Yahoo Finance；历史需要用 SEC EDGAR 的 EPS 自己重建。常见情形：成长股常在 25–35。每日更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "price_earnings_ttm_to_five_year_median_ratio"
    operator: "less_than"
    value: 1.0
  - rule_id: VAL-06
    name: {en: "Forward PE below TTM PE", zh: "Forward PE 低于 TTM PE"}
    description: {en: "Passes when the forward PE is below the TTM PE (the market expects earnings to grow). Forward PE: price divided by analysts' expected earnings for the next 12 months. If it is lower than the TTM PE, the market expects earnings to grow. Source: Yahoo Finance via yfinance. Backtest history: the community DoltHub databases, earnings, from 2017-10-26.", zh: "Forward PE 低于 TTM 市盈率（市场预期盈利增长）时通过。Forward PE：价格除以分析师预期的未来 12 个月盈利。如果低于 TTM 市盈率，说明市场预期盈利会增长。数据来源：通过 yfinance 取 Yahoo Finance。回测历史：社区 DoltHub 数据库，earnings，自 2017-10-26 起。"}
    indicator: "forward_pe_to_trailing_pe_ratio"
    operator: "less_than"
    value: 1.0
  - rule_id: VAL-07
    name: {en: "EV/EBITDA below 15", zh: "EV/EBITDA 低于 15"}
    description: {en: "Passes when EV/EBITDA is below 15. EV (enterprise value) is market cap plus net debt; EBITDA is earnings before interest, taxes, depreciation and amortization. Typical values: 8 to 15 is common. The growth-adjusted version is VAL-13. Source: SEC EDGAR financial statements plus the share price, updated each quarter. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "EV/EBITDA 低于 15 时通过。EV（企业价值）是市值加净债务；EBITDA 是息税折旧摊销前利润。常见情形：8–15 常见。考虑增速的版本是 VAL-13。数据来源：SEC EDGAR 财务报表加股价，按季更新。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "enterprise_value_to_ebitda"
    operator: "less_than"
    value: 15
  - rule_id: VAL-13
    name: {en: "PEG below 1.5", zh: "PEG 低于 1.5"}
    description: {en: "Passes when the PEG (forward PE divided by the expected earnings growth rate, taken from next-year over this-year consensus EPS) is below 1.5. About 1 is often seen as fair (Peter Lynch's rule of thumb). Source: the community DoltHub earnings database for the estimates, updated weekly. Backtest history: the community DoltHub databases, earnings, from 2017-10-26.", zh: "PEG（Forward PE 除以预期盈利增速，增速取下一年对今年的一致预期 EPS）低于 1.5 时通过。约等于 1 常被视为合理（Peter Lynch 的经验）。数据来源：预期取自社区 DoltHub 盈利数据库，周更。回测历史：社区 DoltHub 数据库，earnings，自 2017-10-26 起。"}
    indicator: "peg_ratio"
    operator: "less_than"
    value: 1.5
    legacy_id: []
  - rule_id: VAL-08
    name: {en: "FCF yield at least 5%", zh: "自由现金流收益率不低于 5%"}
    description: {en: "Passes when the FCF yield is at least 5%. FCF (free cash flow) divided by market value: roughly how much cash you get back each year for buying the whole company. Above 5% is often seen as cheap, below 3% as expensive. Source: Yahoo Finance via yfinance, calculated. Other tier: VAL-10. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "自由现金流收益率不低于 5% 时通过。FCF（自由现金流）除以市值，相当于买下整家公司每年能拿回多少现金。高于 5% 常被视为便宜，低于 3% 偏贵。数据来源：通过 yfinance 取 Yahoo Finance，自行计算。其他分档：VAL-10。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "free_cash_flow_yield_percent"
    operator: "greater_or_equal"
    value: 5
  - rule_id: VAL-10
    name: {en: "FCF yield at least 3%", zh: "自由现金流收益率不低于 3%"}
    description: {en: "Passes when the FCF yield is at least 3%. One of the FCF yield tiers; see VAL-08 for what it measures, the source and typical values. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "自由现金流收益率不低于 3% 时通过。自由现金流收益率分档之一；含义、数据来源和常见数值见 VAL-08。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "free_cash_flow_yield_percent"
    operator: "greater_or_equal"
    value: 3
    band_of: "VAL-08"
    legacy_id: []
  - rule_id: VAL-09
    name: {en: "Safety margin", zh: "安全边际"}
    description: {en: "Passes when the strike of the put you sell is no higher than the price you would be happy to pay for the stock. This is the core safety margin of selling puts. Source: your own answer; no data feed.", zh: "你卖出的 Put 的行权价不高于你愿意买入这只股票的价格时通过，这是卖 Put 最核心的安全边际。数据来源：你自己的回答，没有数据源。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A16"]
  # SEN · Sentiment and positioning
  - rule_id: SEN-01
    name: {en: "VIX at least 15", zh: "VIX 不低于 15"}
    description: {en: "Passes when the VIX is at least 15. The VIX (Cboe Volatility Index) shows how much volatility the options market expects for the S&P 500 over the next 30 days; it is called the fear gauge. Too low and options pay little; too high and the market is panicking, so sellers must be careful. Source: Yahoo Finance symbol ^VIX via yfinance; delayed about 15 minutes during trading. Typical values: long-run average about 19 to 20; below 12 is complacent, 20 to 30 tense, above 30 panic, above 40 extreme (market convention). Other tiers: SEN-10, SEN-11, SEN-12, SEN-13, SEN-14, SEN-15. Backtest history: Cboe free data files, VIX_History, from 1990-01-02.", zh: "VIX 不低于 15 时通过。VIX（Cboe 波动率指数）反映期权市场预期标普 500 未来 30 天的波动，俗称恐慌指数。太低期权不值钱，太高说明市场恐慌，卖方要小心。数据来源：通过 yfinance 取 Yahoo Finance 的 ^VIX，盘中约延迟 15 分钟。常见情形：长期均值约 19–20；低于 12 自满，20–30 紧张，高于 30 恐慌，高于 40 极端（业界惯例）。其他分档：SEN-10、SEN-11、SEN-12、SEN-13、SEN-14、SEN-15。回测历史：Cboe 免费数据文件，VIX_History，自 1990-01-02 起。"}
    indicator: "vix_level"
    operator: "greater_or_equal"
    value: 15
    legacy_id: ["A11"]
    note: {en: "Sellers use the floors (SEN-01, SEN-10), trend and momentum strategies use the caps (SEN-11 to SEN-13), contrarian buyers use SEN-14 and SEN-15", zh: "卖方用下限（SEN-01、SEN-10），趋势和动量策略用上限（SEN-11 到 SEN-13），逆向买方用 SEN-14 和 SEN-15"}
  - rule_id: SEN-10
    name: {en: "VIX at least 12", zh: "VIX 不低于 12"}
