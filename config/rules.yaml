    rule_name: "portfolio_greeks"
    topic: "portfolio_risk"
    description: {en: "Passes when the Delta, Vega, Theta and beta-weighted Delta of your whole option book are each within the range you set.", zh: "整个期权组合的 Delta、Vega、Theta 和 beta 加权 Delta 都在你自己设定的范围内时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["POS-14"]
  - rule_id: R-POS-16
    rule_name: "correlation_and_stress"
    topic: "portfolio_risk"
    description: {en: "Passes when the loss in your stress test, such as a 20% drop with volatility up 50%, is at most the limit you set.", zh: "压力测试（比如标的下跌 20% 且波动率上升 50%）的亏损不高于你自己设定的上限时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["POS-16"]

  # ----------------------------------------------------------------------------
  # THS · Thesis and discipline
  # ----------------------------------------------------------------------------
  # Why you trade, what proves you wrong, and your own limits.
  # Topics, in order: why_trade, discipline.
  # Topic: why_trade
  - rule_id: R-THS-01
    rule_name: "circle_of_competence"
    topic: "why_trade"
    description: {en: "Passes when you can explain in plain words how the company makes money.", zh: "你能用大白话说清这家公司怎么赚钱时通过。"}
    method: "manual"
    quantifiable: "no"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-01"]
  - rule_id: R-THS-02
    rule_name: "written_thesis"
    topic: "why_trade"
    description: {en: "Passes when you wrote down why you trade and what you expect before opening.", zh: "开仓前已把为什么做、预期什么写下来时通过。"}
    method: "manual"
    quantifiable: "no"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-02"]
  - rule_id: R-THS-03
    rule_name: "willing_to_hold"
    topic: "why_trade"
    description: {en: "Passes when you are willing to hold the stock for the long term if assigned.", zh: "如果被行权，你愿意长期持有这只股票时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-03", "A15", "E01"]
  - rule_id: R-THS-04
    rule_name: "trade_purpose"
    topic: "why_trade"
    description: {en: "Passes when you know whether the trade is to earn rent (the premium) or to buy the stock.", zh: "你清楚这笔交易是想收租金（权利金）还是想接盘买股时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-04", "E16"]

  # Topic: discipline
  - rule_id: R-THS-05
    rule_name: "falsification"
    topic: "discipline"
    description: {en: "Passes when you wrote down what would prove you wrong, as a price or indicator such as a close below a moving average.", zh: "已把什么情况证明你错了写下来，并写成价格或指标（比如收盘跌破某条均线）时通过。"}
    method: "manual"
    quantifiable: "part"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-05"]
  - rule_id: R-THS-06
    rule_name: "sleep_test"
    topic: "discipline"
    description: {en: "Passes when you could still sleep if the stock fell to its 52-week low, with the loss counted in dollars and as a share of net value.", zh: "股价跌到 52 周低点时你仍睡得着觉（亏损已换算成金额和占净值的比例）时通过。"}
    method: "manual"
    quantifiable: "part"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-06", "A24"]
  - rule_id: R-THS-07
    rule_name: "trade_frequency"
    topic: "discipline"
    description: {en: "Passes when you made at most 2 trades in the last 30 days.", zh: "最近 30 天出手不高于 2 次时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["THS-07", "D04"]

  # ----------------------------------------------------------------------------
  # EXT · Management and exit
  # ----------------------------------------------------------------------------
  # Take profit, stop loss, time stop, roll and Wheel management.
  # Topics, in order: profit_stop, time_rolling, covered_call_exit.
  # Topic: profit_stop
  - rule_id: R-EXT-01
    rule_name: "seller_take_profit"
    topic: "profit_stop"
    description: {en: "Passes when your plan buys the option back once 50% or 70% of the premium is earned.", zh: "已定好赚到 50% 或 70% 的权利金就买回平仓的计划时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-01", "B16", "B17"]
  - rule_id: R-EXT-02
    rule_name: "buyer_take_profit"
    topic: "profit_stop"
    description: {en: "Passes when your plan takes profit on a bought option once it is up 60% or 100%.", zh: "已定好买入的期权上涨 60% 或 100% 就止盈的计划时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-02", "D12", "D13"]
  - rule_id: R-EXT-03
    rule_name: "stop_loss"
    topic: "profit_stop"
    description: {en: "Passes when your plan closes the trade once the loss reaches 2 times the premium collected.", zh: "已定好亏损达到所收权利金 2 倍就平仓的计划时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-03", "Z01"]
  - rule_id: R-EXT-04
    rule_name: "buyer_stop"
    topic: "profit_stop"
    description: {en: "Passes when your plan exits a bought option that still loses money after the stock reached your target.", zh: "已定好股票到达目标位而期权仍亏损就离场的计划时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-04", "D14"]

  # Topic: time_rolling
  - rule_id: R-EXT-05
    rule_name: "time_stop_or_roll"
    topic: "time_rolling"
    description: {en: "Passes when your plan closes or rolls the position (closes and reopens further out in time) with about 21 days left.", zh: "已定好剩 21 天左右时平仓或展期（平掉后在更远的到期日重新开仓）的计划时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-05", "Z02"]
  - rule_id: R-EXT-06
    rule_name: "holding_period"
    topic: "time_rolling"
    description: {en: "Passes when you decided in advance how long to hold: 3 to 10 days for buyers, at least six months for the SPMO rotation.", zh: "事先已定好持有多久（买方 3–10 天，SPMO 轮动不少于半年）时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-06", "D11", "C04"]
  - rule_id: R-EXT-07
    rule_name: "rebalance_execution"
    topic: "time_rolling"
    description: {en: "Passes when you trade at the closing price on the SPMO rebalance day.", zh: "在 SPMO 换仓日用收盘价执行时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-07", "C02"]

  # Topic: covered_call_exit
  - rule_id: R-EXT-08
    rule_name: "covered_call_plan"
    topic: "covered_call_exit"
    description: {en: "Passes when you planned the covered calls in advance once you hold the shares.", zh: "持股后已提前计划好卖 Covered Call 时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-08", "E10"]
  - rule_id: R-EXT-09
    rule_name: "covered_call_strike_floor"
    topic: "covered_call_exit"
    description: {en: "Passes when the covered call strike is at or above your cost basis (what you paid for the shares).", zh: "Covered Call 的行权价不低于你的成本价（买入股票时的成本）时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-09", "E14"]
  - rule_id: R-EXT-10
    rule_name: "cost_basis_check"
    topic: "covered_call_exit"
    description: {en: "Passes when the cost basis is at most 1.15 times the current price.", zh: "成本价不高于现价的 1.15 倍时通过。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["EXT-10", "E15", "F12"]

# ------------------------------------------------------------------------------
# ACC · Accounting quality (added after the renumbering, so no legacy_id)
# ------------------------------------------------------------------------------
# Kept at the end of the file on purpose: indicator ids must rise along the rule order, and I-123 to I-125 are the newest.
  - rule_id: R-ACC-01
    rule_name: "accruals_below_5pct"
    topic: "accruals"
    description: {en: "Passes when accruals (profit not backed by cash) are below 5% of average total assets.", zh: "应计项目（没有现金支撑的利润）占平均总资产低于 5% 时通过。"}
    indicator: "I-123"
    operator: "less_than"
    value: 5
  - rule_id: R-ACC-02
    rule_name: "fcf_after_stock_pay_positive"
    topic: "accruals"
    description: {en: "Passes when free cash flow is still positive after deducting stock-based compensation.", zh: "扣除股票薪酬后自由现金流仍为正时通过。"}
    indicator: "I-124"
    operator: "greater_than"
    value: 0
  - rule_id: R-ACC-03
    rule_name: "piotroski_at_least_7"
    topic: "accruals"
    description: {en: "Passes when the Piotroski F-score is 7 or more of 9 tests.", zh: "Piotroski F 分数达到 9 项中的 7 项或以上时通过。"}
    indicator: "I-125"
    operator: "greater_or_equal"
    value: 7

