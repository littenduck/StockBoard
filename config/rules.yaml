  - rule_id: SEN-05
    name: {en: "AAII bulls minus bears below 0", zh: "AAII 看多减看空小于 0"}
    description: {en: "Passes when, in the weekly AAII (American Association of Individual Investors) survey, the bullish share minus the bearish share is below 0. Retail pessimism is often used as a contrarian signal. Long-run averages are about 37.5% bullish, 31% bearish and 31.5% neutral. Source: aaii.com sentiment.xls, updated every Thursday; parsing needs the xlrd package. Backtest history: the AAII sentiment survey file, sentiment, from 1987.", zh: "AAII（美国个人投资者协会）每周问卷里，看多比例减看空比例小于 0 时通过。散户悲观常被当作反向信号。长期平均大约是看多 37.5%、看空 31%、中性 31.5%。数据来源：aaii.com 的 sentiment.xls，每周四更新；解析需要 xlrd 包。回测历史：AAII 问卷数据文件，sentiment，自 1987 起。"}
    indicator: "aaii_bullish_minus_bearish_percent"
    operator: "less_than"
    value: 0
  - rule_id: SEN-20
    name: {en: "AAII bulls below 50%", zh: "AAII 看多低于 50%"}
    description: {en: "Passes when the AAII bullish share is below 50%. Above 50% is an extreme, so this is the looser line; see SEN-05 for what the survey is. Source: aaii.com sentiment.xls, updated every Thursday. Backtest history: the AAII sentiment survey file, sentiment, from 1987.", zh: "AAII 看多比例低于 50% 时通过。高于 50% 属于极端，所以这是较宽松的一条线；问卷的含义见 SEN-05。数据来源：aaii.com 的 sentiment.xls，每周四更新。回测历史：AAII 问卷数据文件，sentiment，自 1987 起。"}
    indicator: "aaii_bullish_percent"
    operator: "less_than"
    value: 50
    band_of: "SEN-05"
    legacy_id: []
  - rule_id: SEN-06
    name: {en: "NAAIM below 80", zh: "NAAIM 低于 80"}
    description: {en: "Passes when the NAAIM exposure index is below 80 (managers are not crowded into stocks). The NAAIM (National Association of Active Investment Managers) Exposure Index: the average stock exposure reported weekly by active fund managers. It typically ranges from 0 to 100 (it can go below 0 or above 100); very high means everyone is bullish and the trade is crowded. Source: naaim.org, the embedded table (2024 onward) and Wayback Machine copies of the old Excel files (2006 to 2024), updated every Thursday. The 80 and 40 lines are rules of thumb to tune on history. Backtest history: NAAIM data (Wayback Machine archive plus the embedded table), exposure-index, from 2006.", zh: "NAAIM 仓位指数低于 80（经理人没有挤在股票里）时通过。NAAIM（美国主动投资经理协会）仓位指数：主动型基金经理每周自报的平均股票仓位，常见范围 0–100（也可能低于 0 或高于 100）。极高说明大家都很乐观、交易拥挤。数据来源：naaim.org 的嵌入表格（2024 年起）和 Wayback 保存的旧 Excel 文件（2006 到 2024），每周四更新。80 和 40 这两条线是经验值，要用历史数据校准。回测历史：NAAIM 数据（Wayback 存档加嵌入表格），exposure-index，自 2006 起。"}
    indicator: "naaim_exposure_index"
    operator: "less_than"
    value: 80
  - rule_id: SEN-21
    name: {en: "NAAIM below 40", zh: "NAAIM 低于 40"}
    description: {en: "Passes when the NAAIM exposure index is below 40 (managers are defensive). The stricter line of SEN-06, which explains the measure. Source: naaim.org. Backtest history: NAAIM data (Wayback Machine archive plus the embedded table), exposure-index, from 2006.", zh: "NAAIM 仓位指数低于 40（经理人偏防守）时通过。这是 SEN-06 较严格的一条线，含义见 SEN-06。数据来源：naaim.org。回测历史：NAAIM 数据（Wayback 存档加嵌入表格），exposure-index，自 2006 起。"}
    indicator: "naaim_exposure_index"
    operator: "less_than"
    value: 40
    band_of: "SEN-06"
    legacy_id: []
  - rule_id: SEN-07
    name: {en: "Put/Call at least 0.7", zh: "Put/Call 不低于 0.7"}
    description: {en: "Passes when the 5-day average of the total put/call ratio is at least 0.7. Ratio of put option volume to call option volume. A high ratio means fear, a low one means complacency. Cboe's old CSV file covers 2006 to 2019 and its daily market statistics files cover 2019 onward, so the whole market is covered. Source: Cboe free data files. Typical values: a total Cboe put/call ratio of 0.7 to 1.0 is common; above 1.1 is fear and below 0.6 complacency (rule of thumb). Backtest history: Cboe free data files, putcall, from 2006-11-01.", zh: "总 Put/Call 比率的 5 日均值不低于 0.7 时通过。看跌期权（Put）成交量与看涨期权（Call）成交量的比值。偏高说明恐慌，偏低说明自满。Cboe 的旧 CSV 文件覆盖 2006 到 2019 年，每日市场统计文件覆盖 2019 年至今，所以能覆盖全市场。数据来源：Cboe 免费数据文件。常见情形：Cboe 总 Put/Call 比率 0.7–1.0 常见；高于 1.1 是恐慌，低于 0.6 是自满（经验）。回测历史：Cboe 免费数据文件，putcall，自 2006-11-01 起。"}
    indicator: "put_call_ratio_total_five_day_average"
    operator: "greater_or_equal"
    value: 0.7
  - rule_id: SEN-22
    name: {en: "Put/Call at least 1.0", zh: "Put/Call 不低于 1.0"}
    description: {en: "Passes when the 5-day average of the total put/call ratio is at least 1.0, a sign of fear. The stricter line of SEN-07, which explains the measure. Source: Cboe free data files. Backtest history: Cboe free data files, putcall, from 2006-11-01.", zh: "总 Put/Call 比率的 5 日均值不低于 1.0 时通过，这是恐惧的迹象。这是 SEN-07 较严格的一条线，含义见 SEN-07。数据来源：Cboe 免费数据文件。回测历史：Cboe 免费数据文件，putcall，自 2006-11-01 起。"}
    indicator: "put_call_ratio_total_five_day_average"
    operator: "greater_or_equal"
    value: 1.0
    band_of: "SEN-07"
    legacy_id: []
  - rule_id: SEN-08
    name: {en: "Mega IPO", zh: "超大型 IPO"}
    description: {en: "Passes when no IPO (initial public offering, a company's first stock sale) of $10 billion or more was priced in the last 30 trading days. Huge new issues soak up cash and often appear near market peaks. Source: a hand-kept list of such IPOs (from Jay Ritter's IPO data and SEC 424B4 filings), topped up by an AI reading news. Backtest history: Jay Ritter's IPO data and SEC filings, ipo-data, from 1990.", zh: "最近 30 个交易日内没有 ≥ $100 亿的 IPO（首次公开募股，公司第一次卖股票）定价时通过。超大额新股会抽走资金，常出现在市场热度的高点。数据来源：手工维护的这类 IPO 清单（来自 Jay Ritter 的 IPO 数据和 SEC 424B4 文件），由 AI 读新闻补充。回测历史：Ritter 的 IPO 数据和 SEC 文件，ipo-data，自 1990 起。"}
    indicator: "no_mega_ipo_in_last_30_trading_days"
    operator: "is_true"
    legacy_id: ["A05"]
  - rule_id: SEN-09
    name: {en: "Short interest below 10%", zh: "空头比例低于 10%"}
    description: {en: "Passes when short interest (shares sold short) is below 10% of the shares outstanding. The float (shares available to trade) has no point-in-time history, so total shares outstanding are used. A high figure means many people bet against the stock, and can also fuel a short squeeze (a sharp rise as shorts rush to buy back). Above 10% is high, above 20% very high (rule of thumb). Source: FINRA bi-weekly short interest files and SEC EDGAR share counts. Updated twice a month. Backtest history: FINRA bi-weekly short interest files, short-interest, from 2018-01-31.", zh: "空头（被卖空的股数）占总股数的比例低于 10% 时通过。流通股（可交易股数）没有时点历史，所以改用总股数。偏高说明很多人在看空，也可能引发逼空（空头抢着回补导致股价急涨）。高于 10% 偏高，高于 20% 很高（经验）。数据来源：FINRA 每半月空头文件和 SEC EDGAR 的股数。每月更新两次。回测历史：FINRA 每半月空头数据文件，short-interest，自 2018-01-31 起。"}
    indicator: "short_interest_percent_of_shares_outstanding"
    operator: "less_than"
    value: 10
  - rule_id: SEN-19
    name: {en: "Short interest below 20%", zh: "空头比例低于 20%"}
    description: {en: "Passes when short interest is below 20% of the shares outstanding. One of the short interest tiers; see SEN-09 for what it measures and the source. Backtest history: FINRA bi-weekly short interest files, short-interest, from 2018-01-31.", zh: "空头占总股数的比例低于 20% 时通过。空头比例分档之一；含义和数据来源见 SEN-09。回测历史：FINRA 每半月空头数据文件，short-interest，自 2018-01-31 起。"}
    indicator: "short_interest_percent_of_shares_outstanding"
    operator: "less_than"
    value: 20
    band_of: "SEN-09"
    legacy_id: []
  # TRD · Trend and momentum
  - rule_id: TRD-01
    name: {en: "Market above 200-day", zh: "大盘在 200 日线上"}
    description: {en: "Passes when the S&P 500 closes above its 200-day moving average (the average close of the last 200 days), which marks an uptrend for the whole market. Source: Yahoo Finance symbol ^GSPC via yfinance, already wired in. Backtest history: Yahoo Finance via yfinance, ^GSPC, from 1927-12-30.", zh: "标普 500 收盘价在 200 日均线（最近 200 天收盘价的平均值）之上时通过，表示整个市场处于上升趋势。数据来源：通过 yfinance 取 Yahoo Finance 的 ^GSPC，已接入。回测历史：通过 yfinance 取 Yahoo Finance，^GSPC，自 1927-12-30 起。"}
    indicator: "spx_above_two_hundred_day_average"
    operator: "is_true"
    legacy_id: ["Z18"]
  - rule_id: TRD-02
    name: {en: "Breadth at least 60%", zh: "广度不低于 60%"}
    description: {en: "Passes when at least 60% of the S&P 500 members at that time are above their 200-day average. How many stocks are above their own 200-day average, and new 52-week highs minus lows. If the index rises while fewer stocks join, the rally is narrow. Needs prices for all 500 S&P 500 stocks. Source: Yahoo Finance via yfinance, calculated; Yahoo has no ready-made breadth index. Typical values: more than 60% of stocks above their 200-day average is strong, less than 40% weak (rule of thumb). Updated daily. A backtest uses the point-in-time list of S&P 500 members, so delisted stocks are included where Yahoo still has their prices. Backtest history: the open-source S&P 500 historical members list with Yahoo prices, sp500-components, from 1996-01-02.", zh: "当时的标普 500 成分股中，至少 60% 站在自己的 200 日线上方时通过。有多少股票站在自己的 200 日均线之上，以及 52 周新高减新低的数量。指数上涨但参与的股票变少，说明行情偏窄。需要标普 500 全部 500 只股票的价格。数据来源：通过 yfinance 取 Yahoo Finance 后自行计算，Yahoo 没有现成的广度指数。常见情形：超过 60% 的股票站上 200 日线算强，低于 40% 算弱（经验）。每日更新。回测使用标普 500 的历史成分股名单，所以已退市的股票在 Yahoo 仍有价格时也会计入。回测历史：开源的标普 500 历史成分股名单加 Yahoo 价格，sp500-components，自 1996-01-02 起。"}
    indicator: "sp500_share_above_two_hundred_day_average_percent"
    operator: "greater_or_equal"
    value: 60
    note: {en: "Difficulty 5, not planned yet: it needs the daily closes of all 500 index members and the list of members.", zh: "难度 5，暂不实现：需要 500 只成分股的每日收盘价和成分股名单。"}
  - rule_id: TRD-21
    name: {en: "Breadth at least 40%", zh: "广度不低于 40%"}
    description: {en: "Passes when at least 40% of the S&P 500 members at that time are above their 200-day average. The looser line of TRD-02, which explains what breadth is. Backtest history: the open-source S&P 500 historical members list with Yahoo prices, sp500-components, from 1996-01-02.", zh: "当时的标普 500 成分股中，至少 40% 站在自己的 200 日线上方时通过。这是 TRD-02 较宽松的一条线，广度的含义见 TRD-02。回测历史：开源的标普 500 历史成分股名单加 Yahoo 价格，sp500-components，自 1996-01-02 起。"}
    indicator: "sp500_share_above_two_hundred_day_average_percent"
    operator: "greater_or_equal"
    value: 40
    band_of: "TRD-02"
    legacy_id: []
    note: {en: "Difficulty 5, not planned yet: same data as TRD-02 (all 500 index members).", zh: "难度 5，暂不实现：数据同 TRD-02（500 只成分股）。"}
  - rule_id: TRD-22
    name: {en: "Equal weight leads", zh: "等权跑赢市值加权"}
    description: {en: "Passes when the ratio of RSP (the equal-weight S&P 500 fund) to SPY (the market-weight fund) is above its own 200-day average. When the average stock keeps up with the biggest stocks, the rally is broad. A cheap stand-in for breadth (TRD-02). Source: Yahoo Finance via yfinance (RSP since 2003). Updated daily. Backtest history: Yahoo Finance via yfinance, RSP, from 2003.", zh: "RSP（等权标普 500 基金）与 SPY（市值加权基金）的比值站在自己的 200 日均线上方时通过。当普通股票能跟上最大的几只，行情就比较宽。这是市场广度（TRD-02）的低成本替代。数据来源：通过 yfinance 取 Yahoo Finance（RSP 自 2003 年起）。每日更新。回测历史：通过 yfinance 取 Yahoo Finance，RSP，自 2003 起。"}
    indicator: "rsp_to_spy_ratio_above_two_hundred_day_average"
    operator: "is_true"
    legacy_id: []
  - rule_id: TRD-03
    name: {en: "Stock above 200-day", zh: "个股在 200 日线上"}
    description: {en: "Passes when the stock closes above its own 200-day average. Selling puts on stocks in a downtrend means catching a falling knife. Source: Yahoo Finance via yfinance, already wired in. The no-new-52-week-low half of the old rule is TRD-23. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "这只股票收盘价在自己的 200 日均线之上时通过。去给下跌趋势里的股票卖 Put，等于接下坠的飞刀。数据来源：通过 yfinance 取 Yahoo Finance，已接入。旧规则里“未创 52 周新低”这一半是 TRD-23。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "price_above_two_hundred_day_average"
    operator: "is_true"
    legacy_id: ["Z20"]
    note: {en: "The old rule also required no new 52-week low; that half is TRD-23", zh: "旧规则还要求未创 52 周新低；这一半是 TRD-23"}
  - rule_id: TRD-23
    name: {en: "No new 52-week low", zh: "未创 52 周新低"}
    description: {en: "Passes when the stock made no new 52-week low in the last 20 trading days. This is the second half of the old rule 'above the 200-day average and no new 52-week low' (the first half is TRD-03). A stock that keeps making lows is still falling. Source: Yahoo Finance via yfinance, calculated. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "该股在最近 20 个交易日没有创 52 周新低时通过。这是旧规则“在 200 日线上方且未创 52 周新低”的后一半（前一半是 TRD-03）。不断创新低的股票还在下跌。数据来源：通过 yfinance 取 Yahoo Finance 后计算。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "no_new_fifty_two_week_low_in_last_20_days"
    operator: "is_true"
    legacy_id: ["Z20"]
  - rule_id: TRD-04
    name: {en: "Golden cross state", zh: "黄金交叉状态"}
    description: {en: "Passes when the 50-day moving average is above the 200-day moving average, called the golden cross state, the most common trend confirmation. Source: Yahoo Finance via yfinance, already wired in. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "50 日均线在 200 日均线之上时通过，称为黄金交叉状态，是最常见的趋势确认。数据来源：通过 yfinance 取 Yahoo Finance，已接入。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "fifty_day_average_above_two_hundred_day_average"
    operator: "is_true"
    legacy_id: ["T02"]
  - rule_id: TRD-05
    name: {en: "Above 50-day", zh: "在 50 日线上"}
    description: {en: "Passes when the close is above the 50-day average, showing the medium-term trend is healthy. Source: Yahoo Finance via yfinance, already wired in. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "收盘价在 50 日均线之上时通过，说明中期走势健康。数据来源：通过 yfinance 取 Yahoo Finance，已接入。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "price_above_fifty_day_average"
    operator: "is_true"
    legacy_id: ["T03"]
  - rule_id: TRD-06
    name: {en: "Within 5% of 52-week high", zh: "距 52 周高点 5% 以内"}
    description: {en: "Passes when the price is within 5% of its 52-week high. How far the price is below its 52-week high. The closer it is, the stronger the stock, and breaking a new high has no trapped sellers above. Source: Yahoo Finance via yfinance, already wired in. Typical values: within 5% means near a new high and within 15% is still strong (rule of thumb; George and Hwang 2004 used the 52-week-high ratio). Other tier: TRD-17. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格距 52 周高点不超过 5% 时通过。价格离 52 周最高价有多远。越近说明股票越强，突破新高时上方没有套牢盘。数据来源：通过 yfinance 取 Yahoo Finance，已接入。常见情形：5% 以内算接近新高，15% 以内仍算强势（经验；George 与 Hwang 2004 年的研究用了 52 周高点比）。其他分档：TRD-17。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "distance_from_fifty_two_week_high_percent"
    operator: "less_or_equal"
    value: 5
    legacy_id: ["M02"]
  - rule_id: TRD-17
    name: {en: "Within 15% of 52-week high", zh: "距 52 周高点 15% 以内"}
    description: {en: "Passes when the price is within 15% of its 52-week high. One of the 52-week high distance tiers; see TRD-06 for what it measures, the source and typical values. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格距 52 周高点不超过 15% 时通过。距 52 周高点的距离分档之一；含义、数据来源和常见数值见 TRD-06。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "distance_from_fifty_two_week_high_percent"
    operator: "less_or_equal"
    value: 15
    band_of: "TRD-06"
    legacy_id: ["T05"]
  - rule_id: TRD-07
    name: {en: "52-week position at most 25", zh: "52 周位置不高于 25"}
    description: {en: "Passes when the price sits in the lowest quarter of its 52-week range (position 25 or below). Where the price sits within its 52-week low-to-high range, from 0 (at the low) to 100 (at the high). Low suits the Wheel strategy (sell puts, get assigned, then sell covered calls); high suits momentum strategies. Source: Yahoo Finance via yfinance, already wired in. Other tier: TRD-18. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格处于 52 周区间的最低四分之一（位置不高于 25）时通过。价格在过去 52 周最低到最高区间中的位置，0 表示在最低点，100 表示在最高点。位置低适合 Wheel 策略（卖 Put、被行权后再卖 Covered Call），位置高适合动量策略。数据来源：通过 yfinance 取 Yahoo Finance，已接入。其他分档：TRD-18。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "fifty_two_week_range_percentile"
    operator: "less_or_equal"
    value: 25
    legacy_id: ["F02"]
    note: {en: "Low zone is the Wheel view; momentum strategies want the opposite and use TRD-06", zh: "低位是 Wheel 的视角；动量策略方向相反，用 TRD-06"}
  - rule_id: TRD-18
    name: {en: "52-week position at most 50", zh: "52 周位置不高于 50"}
    description: {en: "Passes when the price sits in the lower half of its 52-week range (position 50 or below). One of the 52-week position tiers; see TRD-07 for what it measures, the source and typical values. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格处于 52 周区间的下半部分（位置不高于 50）时通过。52 周位置分档之一；含义、数据来源和常见数值见 TRD-07。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "fifty_two_week_range_percentile"
    operator: "less_or_equal"
    value: 50
    band_of: "TRD-07"
    legacy_id: ["F03"]
  - rule_id: TRD-08
    name: {en: "6-month gain", zh: "6 个月涨幅"}
    description: {en: "Passes when the stock is up more than 10% over the last 6 months. Winners tend to keep winning for a while (momentum effect). Source: Yahoo Finance via yfinance, already wired in. Typical values: above 10% is a common line; academic momentum uses 3 to 12 months (Jegadeesh and Titman 1993). Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "股票最近 6 个月涨幅超过 10% 时通过。涨得好的股票往往会在一段时间内继续跑赢（动量效应）。数据来源：通过 yfinance 取 Yahoo Finance，已接入。常见情形：10% 是常用线；学术上的动量用 3–12 个月（Jegadeesh 与 Titman 1993）。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "return_six_month_percent"
    operator: "greater_than"
    value: 10
    legacy_id: ["M01"]
  - rule_id: TRD-09
    name: {en: "Beats SPY", zh: "跑赢 SPY"}
    description: {en: "Passes when the stock's 126-day return is higher than SPY's. Whether the stock has beaten or lagged the market (SPY, the S&P 500 fund) or its sector over recent months. Source: Yahoo Finance via yfinance, calculated. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1993-01-29.", zh: "该股 126 日收益高于 SPY 时通过。这只股票最近几个月跑赢还是跑输大盘（SPY，标普 500 基金）或所在板块。数据来源：通过 yfinance 取 Yahoo Finance，自行计算。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1993-01-29 起。"}
    indicator: "return_one_hundred_twenty_six_day_minus_spy_percent"
    operator: "greater_than"
    value: 0
  - rule_id: TRD-10
    name: {en: "Volume surge", zh: "放量"}
    description: {en: "Passes when the latest day's volume is at least 1.5 times the 20-day average volume. A breakout on heavy volume is more believable than one on thin volume. Source: Yahoo Finance via yfinance, already wired in. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "最近一天的成交量至少是 20 日平均成交量的 1.5 倍时通过。放量突破比缩量突破更可信。数据来源：通过 yfinance 取 Yahoo Finance，已接入。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "volume_ratio_to_twenty_day_average"
    operator: "greater_or_equal"
    value: 1.5
    legacy_id: ["M03"]
  - rule_id: TRD-11
    name: {en: "RSI(14) 40 to 70", zh: "RSI(14) 介于 40 和 70 之间"}
    description: {en: "Passes when the 14-day RSI is between 40 and 70. RSI (Relative Strength Index) over 14 days measures the strength of recent gains versus losses on a 0 to 100 scale. Above 70 is conventionally overbought, below 30 oversold; 40 to 70 means a healthy trend. Source: Yahoo Finance via yfinance, calculated, already wired in. Other tier: TRD-19. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "14 日 RSI 介于 40 和 70 之间时通过。14 日 RSI（相对强弱指数）用 0–100 衡量近期涨幅与跌幅的力度。习惯上高于 70 为超买，低于 30 为超卖，40–70 代表趋势健康。数据来源：通过 yfinance 取 Yahoo Finance 后计算，已接入。其他分档：TRD-19。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "relative_strength_index_fourteen_day"
    operator: "between"
    value: [40, 70]
    legacy_id: ["T04"]
  - rule_id: TRD-19
    name: {en: "RSI(14) below 80", zh: "RSI(14) 低于 80"}
    description: {en: "Passes when the 14-day RSI is below 80. One of the RSI(14) tiers; see TRD-11 for what it measures, the source and typical values. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "14 日 RSI 低于 80 时通过。RSI(14) 分档之一；含义、数据来源和常见数值见 TRD-11。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "relative_strength_index_fourteen_day"
    operator: "less_than"
    value: 80
    band_of: "TRD-11"
    legacy_id: ["M04"]
  - rule_id: TRD-12
    name: {en: "RSI(2) below 5", zh: "RSI(2) 低于 5"}
    description: {en: "Passes when the 2-day RSI is below 5. RSI over just 2 days (the Larry Connors method) is very sensitive. Below 10 means the stock has dropped too far too fast, a classic buy point for short-term mean reversion (the idea that prices snap back). Source: Yahoo Finance via yfinance, calculated, already wired in. Other tier: TRD-20. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "2 日 RSI 低于 5 时通过。只看 2 天的 RSI（Larry Connors 方法）非常敏感。低于 10 说明短期跌得过快过多，是短线均值回归（价格会弹回均值的想法）的经典买点。数据来源：通过 yfinance 取 Yahoo Finance 后计算，已接入。其他分档：TRD-20。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "relative_strength_index_two_day"
    operator: "less_than"
    value: 5
    legacy_id: ["R02"]
  - rule_id: TRD-20
    name: {en: "RSI(2) below 10", zh: "RSI(2) 低于 10"}
    description: {en: "Passes when the 2-day RSI is below 10. One of the RSI(2) tiers; see TRD-12 for what it measures, the source and typical values. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "2 日 RSI 低于 10 时通过。RSI(2) 分档之一；含义、数据来源和常见数值见 TRD-12。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "relative_strength_index_two_day"
    operator: "less_than"
    value: 10
    band_of: "TRD-12"
    legacy_id: ["R01"]
  - rule_id: TRD-13
    name: {en: "Below 5-day", zh: "跌破 5 日线"}
    description: {en: "Passes when the close is below the 5-day average, confirming a short-term pullback is under way. Source: Yahoo Finance via yfinance, already wired in. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "收盘价低于 5 日均线时通过，确认正处于短期回调中。数据来源：通过 yfinance 取 Yahoo Finance，已接入。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "price_below_five_day_average"
    operator: "is_true"
    legacy_id: ["R03"]
  - rule_id: TRD-14
    name: {en: "Near 60-day low", zh: "靠近 60 日低点"}
    description: {en: "Passes when the price is within 3% above its lowest close of the last 60 trading days. Near a recent low the downside is more limited. The old idea of a support level is hard to define, so a recent low is used. Source: Yahoo Finance via yfinance, calculated. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格在最近 60 个交易日最低收盘价上方 3% 以内时通过。靠近近期低点时，下跌空间更有限。原来“支撑位”的概念很难定义，所以改用近期低点。数据来源：通过 yfinance 取 Yahoo Finance 后计算。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "distance_above_sixty_day_low_close_percent"
    operator: "less_or_equal"
    value: 3
    legacy_id: ["B06", "F04"]
  - rule_id: TRD-24
    name: {en: "Near 200-day average", zh: "靠近 200 日线"}
    description: {en: "Passes when the price is within 3% of its 200-day average, another common support level. See TRD-14. Source: Yahoo Finance via yfinance, calculated. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "价格距 200 日均线不超过 3% 时通过，这是另一个常见的支撑位。见 TRD-14。数据来源：通过 yfinance 取 Yahoo Finance 后计算。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "absolute_distance_from_two_hundred_day_average_percent"
    operator: "less_or_equal"
    value: 3
    legacy_id: []
  - rule_id: TRD-15
    name: {en: "ATR at most 3%", zh: "ATR 不高于 3%"}
    description: {en: "Passes when the 14-day ATR is at most 3% of the price. ATR (Average True Range) over 14 days as a share of price: how much the stock normally moves in a day. Used to set stop distance and judge risk. Large blue chips are usually about 1% to 3%. Source: Yahoo Finance via yfinance, calculated. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "14 日 ATR 不超过价格的 3% 时通过。14 日 ATR（平均真实波幅）占价格的比例：这只股票平时一天大概波动多少，用来设置止损距离、判断风险。大型蓝筹股通常在 1%–3%。数据来源：通过 yfinance 取 Yahoo Finance 后计算。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "average_true_range_fourteen_day_percent"
    operator: "less_or_equal"
    value: 3
  - rule_id: TRD-16
    name: {en: "SPMO top 20", zh: "SPMO 前 20 大"}
    description: {en: "Passes when the stock ranks in the top 20 holdings of SPMO. Whether the stock is held by SPMO (the Invesco S&P 500 Momentum ETF), which picks momentum stocks and rebalances every March and September, so its holdings work as a momentum list. The rule asks for the largest holding or the top 20. Source: the fund's SEC N-PORT quarterly reports (published about 60 days after quarter end), plus yfinance's top 10 for the latest view. Backtest history: SEC N-PORT fund holdings reports, n-port, from 2019-11-30.", zh: "该股排在 SPMO 持仓的前 20 名时通过。这只股票是否被 SPMO（景顺标普 500 动量 ETF）持有。SPMO 按动量选股，每年 3 月和 9 月换仓，所以它的持仓可以当作一份动量名单。规则要求是最大一只或前 20 名。数据来源：该基金的 SEC N-PORT 季度报告（季末约 60 天后公布），最新情况用 yfinance 的前 10 名补充。回测历史：SEC N-PORT 基金持仓报告，n-port，自 2019-11-30 起。"}
    indicator: "spmo_holding_rank"
    operator: "less_or_equal"
    value: 20
    legacy_id: ["C03", "C05"]
    note: {en: "Depends on an external holdings list", zh: "依赖外部持仓名单"}
  - rule_id: TRD-25
    name: {en: "SPMO largest holding", zh: "SPMO 第一大持仓"}
    description: {en: "Passes when the stock is the largest holding of SPMO. The stricter line of TRD-16, which explains the measure. Source: SEC N-PORT quarterly reports. Backtest history: SEC N-PORT fund holdings reports, n-port, from 2019-11-30.", zh: "该股是 SPMO 的第一大持仓时通过。这是 TRD-16 较严格的一条线，含义见 TRD-16。数据来源：SEC N-PORT 季度报告。回测历史：SEC N-PORT 基金持仓报告，n-port，自 2019-11-30 起。"}
    indicator: "spmo_holding_rank"
    operator: "less_or_equal"
    value: 1
    band_of: "TRD-16"
    legacy_id: []
  # EVT · Events
  - rule_id: EVT-01
    name: {en: "No earnings", zh: "无财报"}
    description: {en: "Passes when there is no earnings report before the option expires. Earnings make the stock gap up or down, the most common veto for option sellers. Source: Yahoo Finance via yfinance calendar, already wired in; the date is an estimate until the company confirms it. Backtest history: SEC EDGAR filings (valued as of the filing date), submissions, from 2004.", zh: "期权到期前没有财报时通过。财报会让股价跳空，是期权卖方最常见的否决项。数据来源：通过 yfinance 取 Yahoo Finance 的财报日历，已接入；公司确认之前日期只是估计。回测历史：SEC EDGAR 披露文件（按披露日期取值），submissions，自 2004 起。"}
    indicator: "no_earnings_before_expiration"
    operator: "is_true"
    legacy_id: ["A22", "F05"]
  - rule_id: EVT-02
    name: {en: "No FOMC", zh: "无 FOMC"}
    description: {en: "Passes when no FOMC (Federal Open Market Committee, the Fed committee that sets US interest rates) meeting falls inside the option's life. Volatility rises around the meeting. Source: the Fed's published calendar at federalreserve.gov; today kept by hand in config/settings.yaml. Backtest history: the Federal Reserve meeting calendars, fomc-calendar, from 1936.", zh: "期权存续期内没有 FOMC（联邦公开市场委员会，美联储负责定利率的委员会）会议时通过。会议前后波动会放大。数据来源：美联储官网 federalreserve.gov 公布的日程；目前手工维护在 config/settings.yaml 里。回测历史：美联储会议日程，fomc-calendar，自 1936 起。"}
    indicator: "no_fomc_meeting_inside_option_life"
    operator: "is_true"
    legacy_id: ["F06"]
  - rule_id: EVT-03
    name: {en: "No CPI/PCE", zh: "无 CPI/PCE"}
    description: {en: "Passes when no CPI (Consumer Price Index) or PCE (Personal Consumption Expenditures price index) inflation release falls inside the option's life, and no new position is opened on a release day. Release days move markets. Source: the release dates FRED keeps for the CPIAUCSL and PCEPILFE series (through the FRED API, which needs a free key); the BLS page blocks scripts. Backtest history: FRED (Federal Reserve Economic Data), release-dates, from 1959.", zh: "期权存续期内没有 CPI（消费者物价指数）或 PCE（个人消费支出物价指数）通胀数据公布，并且不在公布日开新仓时通过。公布日市场波动较大。数据来源：FRED 为 CPIAUCSL 和 PCEPILFE 序列保存的发布日期（通过 FRED API，需要免费 key）；BLS 网页拦截脚本。回测历史：FRED（美联储经济数据库），release-dates，自 1959 起。"}
    indicator: "no_cpi_or_pce_release_inside_option_life"
    operator: "is_true"
    legacy_id: ["F07", "Z14"]
  - rule_id: EVT-04
    name: {en: "No election", zh: "无选举日"}
    description: {en: "Passes when no election day falls inside the option's life. Uncertainty rises around elections. Source: computed from the calendar (the Tuesday after the first Monday in November of even years). Backtest history: a calendar rule, us-election-calendar, from 1900.", zh: "期权存续期内没有选举日时通过。选举前后市场不确定性上升。数据来源：由日历规则计算（偶数年 11 月第一个周一之后的周二）。回测历史：日历规则，us-election-calendar，自 1900 起。"}
    indicator: "no_election_day_inside_option_life"
    operator: "is_true"
    legacy_id: ["F07"]
  - rule_id: EVT-05
    name: {en: "No jobs report", zh: "避开非农"}
    description: {en: "Do not open a new position within 1 day of the monthly jobs report (nonfarm payrolls, the number of jobs added, usually released on the first Friday of the month). Surprises cause gaps. Source: the release dates FRED keeps for the PAYEMS series (through the FRED API, which needs a free key); the BLS page blocks scripts. Backtest history: FRED (Federal Reserve Economic Data), PAYEMS-release-dates, from 1939.", zh: "不在月度非农就业报告（新增非农就业人数，通常在每月第一个周五公布）前后 1 天开新仓。数据意外会引起跳空。数据来源：FRED 为 PAYEMS 序列保存的发布日期（通过 FRED API，需要免费 key）；BLS 网页拦截脚本。回测历史：FRED（美联储经济数据库），PAYEMS-release-dates，自 1939 起。"}
    indicator: "no_jobs_report_within_one_day"
    operator: "is_true"
    legacy_id: ["Z13"]
  - rule_id: EVT-06
    name: {en: "No ex-dividend", zh: "无除息日"}
    description: {en: "Passes when no ex-dividend date (the first day the stock trades without its next dividend) falls inside the window. When selling covered calls, there is a risk of early assignment just before it. Source: Yahoo Finance via yfinance calendar and dividends. Backtest history: Yahoo Finance via yfinance, dividends, from 1987.", zh: "窗口内没有除息日（股票不再包含下一次分红的第一天）时通过。卖 Covered Call 时，除息前有被提前行权的风险。数据来源：通过 yfinance 取 Yahoo Finance 的日历和分红记录。回测历史：通过 yfinance 取 Yahoo Finance，dividends，自 1987 起。"}
    indicator: "no_ex_dividend_date_inside_option_life"
    operator: "is_true"
    legacy_id: ["Z08"]
  - rule_id: EVT-07
    name: {en: "Trade uncertainty low", zh: "贸易不确定性低"}
    description: {en: "Passes when the trade policy uncertainty index (EPU, Economic Policy Uncertainty, built from newspaper coverage) is below its 90th percentile of the past 10 years. A stand-in for the risk of tariff and policy shocks. Monthly data with a lag of 1 to 2 months. Source: FRED series EPUTRADE. Backtest history: FRED (Federal Reserve Economic Data), EPUTRADE, from 1985.", zh: "贸易政策不确定性指数（EPU，经济政策不确定性指数，由报纸报道量编制）低于它过去 10 年的第 90 百分位时通过。这是关税和政策冲击风险的代理指标。月度数据，滞后 1–2 个月。数据来源：FRED 的 EPUTRADE 序列。回测历史：FRED（美联储经济数据库），EPUTRADE，自 1985 起。"}
    indicator: "trade_policy_uncertainty_ten_year_percentile"
    operator: "less_than"
    value: 90
    legacy_id: ["Z09"]
  - rule_id: EVT-08
    name: {en: "Geopolitical risk low", zh: "地缘风险低"}
    description: {en: "Passes when the 30-day average of the GPR (Geopolitical Risk Index by Caldara and Iacoviello, built from newspaper coverage) is below its 90th percentile of the past 5 years. A stand-in for escalating conflict. Source: the GPR daily data file (Excel, needs the xlrd package), updated about weekly. Backtest history: the Geopolitical Risk Index files, daily, from 1985.", zh: "GPR（Caldara 和 Iacoviello 编制的地缘政治风险指数，由报纸报道量编制）的 30 日均值低于它过去 5 年的第 90 百分位时通过。这是冲突升级的代理指标。数据来源：GPR 每日数据文件（Excel，需要 xlrd 包），约每周更新。回测历史：地缘政治风险指数文件，daily，自 1985 起。"}
    indicator: "geopolitical_risk_index_thirty_day_average_percentile_five_year"
    operator: "less_than"
    value: 90
    legacy_id: ["Z10"]
  - rule_id: EVT-14
    name: {en: "Policy uncertainty low", zh: "政策不确定性低"}
    description: {en: "Passes when the 30-day average of the daily US EPU (Economic Policy Uncertainty index) is below its 90th percentile of the past 5 years. It replaces the old regulation-event rule, which could not be measured. Source: FRED series USEPUINDXD, updated daily. Backtest history: FRED (Federal Reserve Economic Data), USEPUINDXD, from 1985.", zh: "美国每日 EPU（经济政策不确定性指数）的 30 日均值低于它过去 5 年的第 90 百分位时通过。它取代了无法量化的旧“监管事件”规则。数据来源：FRED 的 USEPUINDXD 序列，每日更新。回测历史：FRED（美联储经济数据库），USEPUINDXD，自 1985 起。"}
    indicator: "us_epu_thirty_day_average_percentile_five_year"
    operator: "less_than"
    value: 90
    legacy_id: []
  - rule_id: EVT-10
    name: {en: "Industry leader earnings", zh: "同业龙头财报"}
    description: {en: "Passes when the industry leader listed for the stock reports no earnings inside the option's life. The leader's report moves the whole sector. The leader comes from a list kept in config/settings.yaml (not built yet); earnings dates are the filing dates of 8-K Item 2.02 on SEC EDGAR. A backtest uses today's list, so it leaks a little hindsight. Backtest history: SEC EDGAR filings (valued as of the filing date), submissions, from 2004.", zh: "期权存续期内，该股所列的行业龙头没有财报时通过。龙头的财报会带动整个板块。龙头来自 config/settings.yaml 里维护的名单（尚未实现）；财报日期取自 SEC EDGAR 上 8-K 第 2.02 项的披露日。回测使用今天的名单，所以有一点事后诸葛亮。回测历史：SEC EDGAR 披露文件（按披露日期取值），submissions，自 2004 起。"}
    indicator: "industry_leader_has_no_earnings_inside_option_life"
    operator: "is_true"
    legacy_id: ["Z15"]
  - rule_id: EVT-11
    name: {en: "Customer and supplier earnings", zh: "客户与供应商财报"}
    description: {en: "Passes when the major customers and suppliers listed for the stock report no earnings inside the option's life. Their reports spill over to this company. The lists come from config/settings.yaml (not built yet); earnings dates are the filing dates of 8-K Item 2.02 on SEC EDGAR. A backtest uses today's lists, so it leaks a little hindsight. Backtest history: SEC EDGAR filings (valued as of the filing date), submissions, from 2004.", zh: "期权存续期内，该股所列的主要客户和供应商没有财报时通过。它们的财报会连带影响这家公司。名单来自 config/settings.yaml（尚未实现）；财报日期取自 SEC EDGAR 上 8-K 第 2.02 项的披露日。回测使用今天的名单，所以有一点事后诸葛亮。回测历史：SEC EDGAR 披露文件（按披露日期取值），submissions，自 2004 起。"}
    indicator: "customers_and_suppliers_have_no_earnings_inside_option_life"
    operator: "is_true"
    legacy_id: ["Z16"]
  - rule_id: EVT-12
    name: {en: "SPMO rebalance window", zh: "SPMO 换仓窗口"}
    description: {en: "True when now is the March or September rebalance window of SPMO (the Invesco S&P 500 Momentum ETF), the time the momentum rotation strategy trades. Source: a fixed date rule. Backtest history: a calendar rule, spmo-rebalance-calendar, from 2015-10.", zh: "现在处于 SPMO（景顺标普 500 动量 ETF）3 月或 9 月的换仓窗口时为真，这是动量轮动策略的交易时点。数据来源：固定的日期规则。回测历史：日历规则，spmo-rebalance-calendar，自 2015-10 起。"}
    indicator: "is_spmo_rebalance_window"
    operator: "is_true"
    legacy_id: ["C01"]
  - rule_id: EVT-13
    name: {en: "No witching soon", zh: "近期无四巫日"}
    description: {en: "Passes when no quadruple witching day (the third Friday of March, June, September or December) falls within the next 5 trading days. Calendar effects around option expiration: the monthly expiration is the third Friday, and quadruple witching (stock options, index options and futures all expire) falls on the third Friday of March, June, September and December. Trading and prices behave oddly then. Source: computed from the calendar. Backtest history: a calendar rule, option-expiration-calendar, from 1990.", zh: "未来 5 个交易日内没有四巫日（3、6、9、12 月的第三个周五）时通过。期权到期前后的日历效应：月度到期日是每月第三个周五，四巫日（个股期权、指数期权和期货同时到期）是 3、6、9、12 月的第三个周五。这些日子的成交和价格会比较特殊。数据来源：由日历计算。回测历史：日历规则，option-expiration-calendar，自 1990 起。"}
    indicator: "no_quadruple_witching_in_next_five_trading_days"
    operator: "is_true"
  # LIQ · Liquidity
  - rule_id: LIQ-01
    name: {en: "Market cap above $200B", zh: "市值高于 2,000 亿美元"}
    description: {en: "Passes when market capitalization (share price times shares outstanding) is above $200 billion. Big companies trade freely and are less likely to be hit by extreme moves. Source: Yahoo Finance via yfinance. Other tier: LIQ-06. The rule value is in billions of dollars. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "市值（股价乘以总股数）超过 $2,000 亿时通过。大公司交易顺畅，不容易被极端行情冲击。数据来源：通过 yfinance 取 Yahoo Finance。其他分档：LIQ-06。规则数值以十亿美元为单位。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "market_capitalization_billion_usd"
    operator: "greater_than"
    value: 200
    legacy_id: ["E02"]
  - rule_id: LIQ-06
    name: {en: "Market cap above $10B", zh: "市值高于 100 亿美元"}
    description: {en: "Passes when market capitalization is above $10 billion (the rule value is in billions of dollars). One of the market cap tiers; see LIQ-01 for what it measures, the source and typical values. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "市值高于 100 亿美元（规则数值以十亿美元为单位）时通过。市值分档之一；含义、数据来源和常见数值见 LIQ-01。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "market_capitalization_billion_usd"
    operator: "greater_than"
    value: 10
    band_of: "LIQ-01"
    legacy_id: []
  - rule_id: LIQ-07
    name: {en: "Market cap above $100B", zh: "市值高于 1000 亿美元"}
    description: {en: "Passes when market capitalization is above $100 billion (the rule value is in billions of dollars). A fixed size line that replaces the old 'top 100' rule, whose ranking line drifts over time. See LIQ-01. Source: SEC EDGAR share counts times the price from Yahoo Finance. Backtest history: SEC EDGAR filings (valued as of the filing date), companyfacts, from 2009.", zh: "市值高于 1000 亿美元时通过（规则数值以十亿美元为单位）。这是一条固定的规模线，取代了旧的“前 100 大”规则，因为排名的分界线会随时间漂移。见 LIQ-01。数据来源：SEC EDGAR 的股数乘以 Yahoo Finance 的价格。回测历史：SEC EDGAR 披露文件（按披露日期取值），companyfacts，自 2009 起。"}
    indicator: "market_capitalization_billion_usd"
    operator: "greater_than"
    value: 100
    band_of: "LIQ-01"
    legacy_id: ["D01"]
  - rule_id: LIQ-03
    name: {en: "Daily value at least $100M", zh: "日成交额不低于 1 亿美元"}
    description: {en: "Passes when the 20-day average daily trading value is at least $100 million. Average money traded in the stock per day (average volume times price). The more active it is, the easier it is to get in and out. Above about $50 million to $100 million a day is enough for an option seller. Source: Yahoo Finance via yfinance. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "20 日平均日成交额不低于 1 亿美元时通过。这只股票平均每天成交多少钱（平均成交量乘以价格）。越活跃，进出越容易。对期权卖方来说，每天超过约 $5,000 万到 $1 亿通常够用。数据来源：通过 yfinance 取 Yahoo Finance。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "average_daily_trading_value_twenty_day_usd"
    operator: "greater_or_equal"
    value: 100000000
  - rule_id: LIQ-08
    name: {en: "Daily value at least $50M", zh: "日成交额不低于 5000 万美元"}
    description: {en: "Passes when the 20-day average daily trading value is at least $50 million. The looser line of LIQ-03, which explains the measure. Source: Yahoo Finance via yfinance. Backtest history: Yahoo Finance via yfinance, daily-prices, from 1980-12-12.", zh: "20 日平均日成交额不低于 5000 万美元时通过。这是 LIQ-03 较宽松的一条线，含义见 LIQ-03。数据来源：通过 yfinance 取 Yahoo Finance。回测历史：通过 yfinance 取 Yahoo Finance，daily-prices，自 1980-12-12 起。"}
    indicator: "average_daily_trading_value_twenty_day_usd"
    operator: "greater_or_equal"
    value: 50000000
    band_of: "LIQ-03"
    legacy_id: []
  - rule_id: LIQ-04
    name: {en: "Bid-ask spread", zh: "买卖价差"}
    description: {en: "Passes when the bid-ask spread (the gap between the best buy and sell quotes) is at most 5% of the mid price (the average of the two). A wide spread means a high real trading cost. For cheap options also check the dollar gap. Source: Yahoo Finance option chain via yfinance; bid and ask are often 0 when the market is closed. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "买卖价差（最优买价与卖价的差距）不超过中间价（两者的平均）的 5% 时通过。价差越大，实际成交成本越高；便宜的期权还要看绝对金额的差距。数据来源：通过 yfinance 取 Yahoo Finance 的期权链；休市时买价和卖价常为 0。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_bid_ask_spread_percent_of_mid"
    operator: "less_or_equal"
    value: 5
    legacy_id: ["Z06"]
  - rule_id: LIQ-05
    name: {en: "Open interest and volume", zh: "持仓量与成交量"}
    description: {en: "Passes when open interest (contracts still open) is at least 500 and the day's volume at least 100. Thinly traded contracts are hard to open and close. Source: Yahoo Finance option chain via yfinance; open interest updates once a day, volume builds up during trading. No free history yet: the app records it every day once the history store runs, and Alpha Vantage's free key is the one more source to test.", zh: "未平仓量（仍未了结的合约数）至少 500，且当日成交量至少 100 时通过。成交稀少的合约很难开仓和平仓。数据来源：通过 yfinance 取 Yahoo Finance 的期权链；未平仓量每天更新一次，成交量盘中累计。目前没有免费历史：历史存储上线后，应用会每天自己记录；Alpha Vantage 的免费 key 是另一个待测试的来源。"}
    indicator: "selected_put_open_interest"
    operator: "greater_or_equal"
    value: 500
    legacy_id: ["Z07"]
  - rule_id: LIQ-09
    name: {en: "Volume at least 100", zh: "成交量不低于 100"}
    description: {en: "Passes when the option's volume for the day is at least 100 contracts. Thinly traded contracts are hard to open and close. See LIQ-05. Source: Yahoo Finance option chain via yfinance. No free history yet: the app records it every day once the history store runs.", zh: "期权当日成交量至少 100 张时通过。成交稀少的合约很难开仓和平仓。见 LIQ-05。数据来源：通过 yfinance 取 Yahoo Finance 的期权链。目前没有免费历史：历史存储上线后，应用会每天自己记录。"}
    indicator: "selected_put_volume"
    operator: "greater_or_equal"
    value: 100
    band_of: "LIQ-05"
    legacy_id: []
  # VOL · Volatility
  - rule_id: VOL-01
    name: {en: "IV percentile at least 70", zh: "IV 百分位不低于 70"}
    description: {en: "Passes when the IV percentile is at least 70. Where today's IV (implied volatility, the volatility priced into options) sits within the past year, as a percentile. A high reading means options are expensive, which favors sellers. Needs a year of daily IV history that no free source provides, so it has to be recorded daily and builds up over a year. VIX percentile can be a stopgap. Other tiers: VOL-06, VOL-07. Backtest history: the community DoltHub databases, volatility_history, from 2020-02.", zh: "IV 百分位不低于 70 时通过。当前 IV（隐含波动率，期权价格里包含的波动率）在过去一年中处于什么百分位。数值高说明期权偏贵，对卖方有利。需要一年的每日 IV 历史，免费数据源都没有，只能自己每天记录，攒满一年才可用。VIX 的百分位可以做临时替代。其他分档：VOL-06、VOL-07。回测历史：社区 DoltHub 数据库，volatility_history，自 2020-02 起。"}
    indicator: "implied_volatility_percentile"
    operator: "greater_or_equal"
    value: 70
    legacy_id: ["A14"]
  - rule_id: VOL-06
    name: {en: "IV percentile at least 50", zh: "IV 百分位不低于 50"}
    description: {en: "Passes when the IV percentile is at least 50. One of the IV percentile tiers; see VOL-01 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, volatility_history, from 2020-02.", zh: "IV 百分位不低于 50 时通过。IV 百分位分档之一；含义、数据来源和常见数值见 VOL-01。回测历史：社区 DoltHub 数据库，volatility_history，自 2020-02 起。"}
    indicator: "implied_volatility_percentile"
    operator: "greater_or_equal"
    value: 50
    band_of: "VOL-01"
    legacy_id: ["A13"]
  - rule_id: VOL-07
    name: {en: "IV percentile at least 40", zh: "IV 百分位不低于 40"}
    description: {en: "Passes when the IV percentile is at least 40. One of the IV percentile tiers; see VOL-01 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, volatility_history, from 2020-02.", zh: "IV 百分位不低于 40 时通过。IV 百分位分档之一；含义、数据来源和常见数值见 VOL-01。回测历史：社区 DoltHub 数据库，volatility_history，自 2020-02 起。"}
    indicator: "implied_volatility_percentile"
    operator: "greater_or_equal"
    value: 40
    band_of: "VOL-01"
    legacy_id: ["A12"]
  - rule_id: VOL-02
    name: {en: "VIX above its average", zh: "VIX 高于均值"}
    description: {en: "Passes when the VIX is above its own 20-day average, meaning volatility is on the rise. The single-stock version is VOL-08. Source: Cboe VIX history, updated daily. Backtest history: Cboe free data files, VIX_History, from 1990-01-02.", zh: "VIX 高于它自己的 20 日均值，即波动在抬升时通过。个股版本是 VOL-08。数据来源：Cboe 的 VIX 历史数据，每日更新。回测历史：Cboe 免费数据文件，VIX_History，自 1990-01-02 起。"}
    indicator: "vix_to_twenty_day_average_ratio"
    operator: "greater_than"
    value: 1.0
    legacy_id: ["B01"]
  - rule_id: VOL-08
    name: {en: "IV above last month", zh: "IV 高于一个月前"}
    description: {en: "Passes when the stock's IV (implied volatility, the volatility priced into options) is higher than it was one month ago. The single-stock version of VOL-02. Source: the community DoltHub options database (volatility_history). Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "该股的 IV（隐含波动率，期权价格里包含的波动率）比一个月前高时通过。这是 VOL-02 的个股版本。数据来源：社区 DoltHub 期权数据库的 volatility_history。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "implied_volatility_to_one_month_ago_ratio"
    operator: "greater_than"
    value: 1.0
    legacy_id: []
  - rule_id: VOL-03
    name: {en: "IV vs realized", zh: "IV 对实际波动"}
    description: {en: "Passes when ATM (at-the-money, strike near the current price) IV for 30 to 45 days is above RV30, the 30-day realized volatility. The gap is the volatility risk premium, the extra the seller is paid. Source: Yahoo Finance option chain and prices via yfinance, already wired in. Typical values: IV above RV is the normal state. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "30–45 天的 ATM（平值，行权价接近现价）IV 高于 RV30，即 30 天实际波动率时通过。两者的差就是波动率风险溢价，也就是卖方额外拿到的补偿。数据来源：通过 yfinance 取 Yahoo Finance 的期权链和价格，已接入。常见情形：IV 高于 RV 是常态。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_implied_volatility_exceeds_realized"
    operator: "is_true"
    legacy_id: ["Z05"]
  - rule_id: VOL-04
    name: {en: "Expected move below 10%", zh: "预期波动低于 10%"}
    description: {en: "Passes when the 30-day 1-sigma expected move implied by the options (price times IV times the square root of days to expiration over 365) is below 10% of the price. A smaller expected move means calmer options. The comparison of IV before and after earnings is dropped because it cannot be rebuilt. Source: the community DoltHub options database. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "期权隐含的 30 天 1σ 预期波动（价格 × IV × √(到期天数 ÷ 365)）低于价格的 10% 时通过。预期波动越小，期权越平静。“财报前后 IV 对比”那部分无法重建，已删除。数据来源：社区 DoltHub 期权数据库。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "one_sigma_expected_move_thirty_day_percent"
    operator: "less_than"
    value: 10
  - rule_id: VOL-05
    name: {en: "Put skew at most 5 points", zh: "Put 偏斜不超过 5 点"}
    description: {en: "Passes when the IV of puts about 10% below the price minus the ATM IV is at most 5 volatility points (a first guess, to be tuned on history). Put skew: how much more expensive downside protection is than at-the-money options (IV of puts about 10% below the price minus ATM IV). A larger gap means the market fears a fall. Source: Yahoo Finance option chain via yfinance. Typical values: put skew is usually positive. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "价格下方约 10% 的 Put 的 IV 减平值 IV 不超过 5 个波动率点（第一版猜测，要用历史数据校准）时通过。Put 偏斜：下跌保护比平值期权贵多少（价格下方约 10% 的 Put 的 IV 减去平值 IV）。差距越大，说明市场越担心下跌。数据来源：通过 yfinance 取 Yahoo Finance 的期权链。常见情形：Put 偏斜通常为正。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "put_skew_ten_percent_otm_minus_atm_iv_points"
    operator: "less_or_equal"
    value: 5
  # CTR · Contract selection
  - rule_id: CTR-01
    name: {en: "Delta 0.15 to 0.20", zh: "Delta 介于 0.15 和 0.20 之间"}
    description: {en: "Passes when the option's absolute Delta is between 0.15 and 0.20. Delta of the option you sell is roughly the chance it ends up in the money (gets assigned). A smaller |Delta| is safer but collects less premium. Sellers often use 0.15 to 0.30. Calculated with the Black-Scholes model from the option chain. Source: Yahoo Finance via yfinance, already wired in. Other tiers: CTR-11, CTR-12. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "期权 Delta 的绝对值介于 0.15 和 0.20 之间时通过。卖出期权的 Delta 近似于它最终价内（被行权）的概率。|Delta| 越小越安全，但收到的权利金也越少。卖方常用 0.15–0.30。用 Black-Scholes 模型根据期权链计算。数据来源：通过 yfinance 取 Yahoo Finance，已接入。其他分档：CTR-11、CTR-12。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_absolute_delta"
    operator: "between"
    value: [0.15, 0.2]
    legacy_id: ["B04"]
  - rule_id: CTR-11
    name: {en: "Delta 0.15 to 0.30", zh: "Delta 介于 0.15 和 0.30 之间"}
    description: {en: "Passes when the option's absolute Delta is between 0.15 and 0.30. One of the Delta tiers; see CTR-01 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "期权 Delta 的绝对值介于 0.15 和 0.30 之间时通过。Delta 分档之一；含义、数据来源和常见数值见 CTR-01。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_absolute_delta"
    operator: "between"
    value: [0.15, 0.3]
    band_of: "CTR-01"
    legacy_id: ["B03"]
  - rule_id: CTR-12
    name: {en: "Delta at most 0.30", zh: "Delta 不高于 0.30"}
    description: {en: "Passes when the option's absolute Delta is at most 0.30. One of the Delta tiers; see CTR-01 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "期权 Delta 的绝对值不高于 0.30 时通过。Delta 分档之一；含义、数据来源和常见数值见 CTR-01。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_absolute_delta"
    operator: "less_or_equal"
    value: 0.3
    band_of: "CTR-01"
    legacy_id: ["F08"]
  - rule_id: CTR-02
    name: {en: "DTE 30 to 45", zh: "DTE 介于 30 和 45 之间"}
    description: {en: "Passes when days to expiration (DTE) is between 30 and 45. Days to expiration (DTE). 30 to 45 days is a common sweet spot where time value decays quickly without the option being too short. Source: option expiration dates from Yahoo Finance via yfinance, already wired in. Typical values: 45 DTE is a common choice among options sellers (the tastytrade standard). Other tiers: CTR-13, CTR-14. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "到期天数（DTE）介于 30 和 45 之间时通过。到期天数（DTE）。30–45 天是常见的甜区：时间价值衰减较快，又不至于太短。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日，已接入。常见情形：期权卖方常用 45 DTE（tastytrade 的标准做法）。其他分档：CTR-13、CTR-14。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_days_to_expiration"
    operator: "between"
    value: [30, 45]
    legacy_id: ["B07", "E05"]
  - rule_id: CTR-13
    name: {en: "DTE 14 to 45", zh: "DTE 介于 14 和 45 之间"}
    description: {en: "Passes when days to expiration (DTE) is between 14 and 45. One of the DTE tiers; see CTR-02 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "到期天数（DTE）介于 14 和 45 之间时通过。DTE 分档之一；含义、数据来源和常见数值见 CTR-02。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_days_to_expiration"
    operator: "between"
    value: [14, 45]
    band_of: "CTR-02"
    legacy_id: ["A23"]
  - rule_id: CTR-14
    name: {en: "DTE above 30", zh: "DTE 高于 30"}
    description: {en: "Passes when days to expiration (DTE) is above 30. One of the DTE tiers; see CTR-02 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "到期天数（DTE）高于 30 时通过。DTE 分档之一；含义、数据来源和常见数值见 CTR-02。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_days_to_expiration"
    operator: "greater_than"
    value: 30
    band_of: "CTR-02"
    legacy_id: ["F09"]
  - rule_id: CTR-03
    name: {en: "Buyer DTE 60 to 90", zh: "买方 DTE 60–90"}
    description: {en: "Passes when the days to expiration of the option you buy are between 60 and 90. Expiration of the option you buy. Buyers prefer 60 to 90 days so time decay does not eat the premium too fast. Source: option expiration dates from Yahoo Finance via yfinance. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "你买入期权的到期天数在 60 到 90 之间时通过。买方期权的到期时间。买方偏好 60–90 天，避免时间损耗太快吃掉权利金。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_option_days_to_expiration"
    operator: "between"
    value: [60, 90]
    legacy_id: ["D06"]
  - rule_id: CTR-04
    name: {en: "Monthly expiration", zh: "月度期权"}
    description: {en: "Whether the option is a monthly one (expires on the third Friday of the month), which usually has better liquidity than weeklies. Source: computed from the expiration date. Backtest history: a calendar rule, option-expiration-calendar, from 1990.", zh: "是不是月度期权（每月第三个周五到期），通常比周期权流动性更好。数据来源：由到期日计算。回测历史：日历规则，option-expiration-calendar，自 1990 起。"}
    indicator: "selected_expiration_is_third_friday"
    operator: "is_true"
    legacy_id: ["B08"]
  - rule_id: CTR-05
    name: {en: "Strike 10% to 15% below", zh: "行权价低 10%–15%"}
    description: {en: "Passes when the strike is 10% to 15% below the current price. How far the strike is below the current price. The Wheel strategy often picks a strike 10% to 15% (or up to 20%) below the price, where it is happy to be assigned. Source: price from Yahoo Finance via yfinance, calculated. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "行权价比现价低 10% 到 15% 时通过。行权价比现价低多少。Wheel 策略常选低于现价 10%–15%（最多 20%）的位置，也就是愿意接盘的价位。数据来源：价格通过 yfinance 取 Yahoo Finance 后计算。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_strike_discount_percent"
    operator: "between"
    value: [10, 15]
    legacy_id: ["E03", "E04"]
  - rule_id: CTR-06
    name: {en: "Strike vs support", zh: "行权价对支撑位"}
    description: {en: "Passes when the strike is below the nearest support, so a drop must break support before the put is in the money. The support level is the 60-day low of TRD-14. Source: Yahoo Finance via yfinance, calculated. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "行权价低于最近的支撑位时通过，这样股价要先跌破支撑才会进入价内。支撑位取 TRD-14 的 60 日低点。数据来源：通过 yfinance 取 Yahoo Finance 后计算。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_strike_below_support"
    operator: "is_true"
    legacy_id: ["B05"]
  - rule_id: CTR-07
    name: {en: "Round strike", zh: "整数行权价"}
    description: {en: "Passes when the strike is a multiple of 5, a round number. Round strikes are easier to trade; the volume side is handled by LIQ-09. Source: Yahoo Finance option chain via yfinance. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "行权价是 5 的整数倍时通过。整数行权价更容易成交；成交量那一方面由 LIQ-09 负责。数据来源：通过 yfinance 取 Yahoo Finance 的期权链。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_strike_is_multiple_of_five"
    operator: "is_true"
    legacy_id: ["D07"]
  - rule_id: CTR-08
    name: {en: "Call strike 8% to 12% above", zh: "Call 行权价高 8%–12%"}
    description: {en: "Passes when the covered call strike is 8% to 12% above the current price. Strike of the covered call (a call sold against shares you own) set about 10% above the current price. Source: price from Yahoo Finance via yfinance, calculated. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "Covered Call 的行权价比现价高 8% 到 12% 时通过。Covered Call（对自己持有的股票卖出的看涨期权）的行权价设在现价上方约 10%。数据来源：价格通过 yfinance 取 Yahoo Finance 后计算。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_call_strike_premium_percent"
    operator: "between"
    value: [8, 12]
    legacy_id: ["E11"]
  - rule_id: CTR-09
    name: {en: "Call DTE 25 to 35", zh: "Call DTE 25–35"}
    description: {en: "Passes when the covered call has 25 to 35 days to expiration. Covered call expiration, usually about 30 days. Source: option expiration dates from Yahoo Finance via yfinance. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "Covered Call 距到期 25 到 35 天时通过。Covered Call 的到期时间，通常选约 30 天。数据来源：通过 yfinance 取 Yahoo Finance 的期权到期日。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_call_days_to_expiration"
    operator: "between"
    value: [25, 35]
    legacy_id: ["E12"]
  - rule_id: CTR-10
    name: {en: "Strike vs expected move", zh: "行权价对预期波动"}
    description: {en: "Passes when the strike is outside the 1-sigma expected move implied by options (see VOL-04), so the stock must fall further than the market expects before the put is assigned. Source: Yahoo Finance option chain via yfinance, calculated. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "行权价在期权隐含的 1σ 预期波动幅度之外（见 VOL-04）时通过，也就是股价要跌得比市场预期还多才会被行权。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_strike_outside_one_sigma_move"
    operator: "is_true"
  # RET · Return and payoff
  - rule_id: RET-01
    name: {en: "Annualized return at least 20%", zh: "年化收益不低于 20%"}
    description: {en: "Passes when the annualized return is at least 20%. The premium collected converted to an annual return (bid divided by strike, scaled to 365 days). Too low is not worth the risk; too high usually means high risk. Source: Yahoo Finance option chain via yfinance, already wired in; no bid when the market is closed. Typical values: 8% to 20% a year is the range used here for put sellers. Other tier: RET-06. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "年化收益不低于 20% 时通过。把收到的权利金换算成年化收益（买价除以行权价，折算到 365 天）。太低不值得冒风险，太高往往说明风险也高。数据来源：通过 yfinance 取 Yahoo Finance 的期权链，已接入；休市时没有买价。常见情形：这里对卖 Put 采用的范围是年化 8%–20%。其他分档：RET-06。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_annualized_return_percent"
    operator: "greater_or_equal"
    value: 20
    legacy_id: ["E08"]
  - rule_id: RET-06
    name: {en: "Annualized return at least 8%", zh: "年化收益不低于 8%"}
    description: {en: "Passes when the annualized return is at least 8%. One of the annualized return tiers; see RET-01 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "年化收益不低于 8% 时通过。年化收益分档之一；含义、数据来源和常见数值见 RET-01。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_annualized_return_percent"
    operator: "greater_or_equal"
    value: 8
    band_of: "RET-01"
    legacy_id: ["A21", "B09"]
  - rule_id: RET-02
    name: {en: "Monthly premium at least 4%", zh: "月化权利金不低于 4%"}
    description: {en: "Passes when the monthly premium is at least 4% of the strike. The premium as a share of the strike, scaled to one month. Monthly 2% to 4% is common for put sellers. Source: Yahoo Finance option chain via yfinance, calculated. Other tier: RET-07. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "月化权利金不低于行权价的 4% 时通过。权利金占行权价的比例，折算成每月。卖 Put 常见的月化是 2%–4%。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。其他分档：RET-07。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_monthly_premium_percent"
    operator: "greater_or_equal"
    value: 4
    legacy_id: ["B11", "E07"]
  - rule_id: RET-07
    name: {en: "Monthly premium at least 2%", zh: "月化权利金不低于 2%"}
    description: {en: "Passes when the monthly premium is at least 2% of the strike. One of the monthly premium tiers; see RET-02 for what it measures, the source and typical values. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "月化权利金不低于行权价的 2% 时通过。月化权利金分档之一；含义、数据来源和常见数值见 RET-02。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_monthly_premium_percent"
    operator: "greater_or_equal"
    value: 2
    band_of: "RET-02"
    legacy_id: ["B10", "E06"]
  - rule_id: RET-03
    name: {en: "Implied leverage", zh: "隐含杠杆"}
    description: {en: "Passes when the implied leverage of the option you buy (Delta times stock price divided by the premium, meaning how much stock exposure each dollar buys) is at least 10 times. Source: the community DoltHub options database. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "你买入期权的隐含杠杆（Delta × 股价 ÷ 权利金，也就是每一块钱能买到多少股票敞口）不低于 10 倍时通过。数据来源：社区 DoltHub 期权数据库。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_option_implied_leverage"
    operator: "greater_or_equal"
    value: 10
    legacy_id: ["D05"]
  - rule_id: RET-04
    name: {en: "Breakeven 10% below", zh: "盈亏平衡价低 10%"}
    description: {en: "Passes when the breakeven price (strike minus premium for a put) is at least 10% below the current price. Know the worst case before opening; the maximum loss is (strike minus premium) times 100 per contract. Source: the community DoltHub options database. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "盈亏平衡价（Put 为行权价减权利金）比现价低至少 10% 时通过。开仓前先算清最坏的情况；最大亏损是每张合约（行权价减权利金）× 100。数据来源：社区 DoltHub 期权数据库。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_breakeven_discount_percent"
    operator: "greater_or_equal"
    value: 10
  - rule_id: RET-05
    name: {en: "Win probability at least 75%", zh: "盈利概率不低于 75%"}
    description: {en: "Passes when the probability of profit, approximated as 1 minus |Delta|, is at least 0.75. POP (probability of profit), roughly the chance the trade makes money, often approximated as 1 minus |Delta|. Source: Yahoo Finance option chain via yfinance, calculated. Backtest history: the community DoltHub databases, options, from 2019-02-09.", zh: "盈利概率（用 1 减 |Delta| 近似）不低于 0.75 时通过。POP（盈利概率），这笔交易赚钱的大致概率，常用 1 减 |Delta| 近似。数据来源：通过 yfinance 取 Yahoo Finance 的期权链后计算。回测历史：社区 DoltHub 数据库，options，自 2019-02-09 起。"}
    indicator: "selected_put_probability_of_profit"
    operator: "greater_or_equal"
    value: 0.75
  # POS · Position, account and portfolio
  - rule_id: POS-01
    name: {en: "Option level", zh: "期权权限"}
    description: {en: "Your brokerage account must have enough option permission: level 2 allows cash-secured puts and covered calls, level 3 allows spreads (the exact levels depend on the broker). Without it the order is rejected. Source: your brokerage account; not public data.", zh: "你的券商账户必须有足够的期权权限：2 级可以做现金担保 Put 和 Covered Call，3 级可以做价差（具体级别因券商而异）。没有权限，下单会被拒绝。数据来源：你的券商账户，不是公开数据。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["B14", "B15"]
  - rule_id: POS-02
    name: {en: "No leverage", zh: "零杠杆"}
    description: {en: "No borrowed money, and every short put is backed by enough cash (cash-secured). Source: your brokerage account.", zh: "不借钱，并且每个卖出的 Put 都有足够现金担保（现金担保）。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A20", "F11"]
  - rule_id: POS-03
    name: {en: "Cash reserve", zh: "现金储备"}
    description: {en: "Keep at least 30% of net value in cash to handle assignment and swings. Source: your brokerage account.", zh: "账户里至少保留净值 30% 的现金，用来应对被行权和行情波动。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A19"]
  - rule_id: POS-04
    name: {en: "Cash to cover assignment", zh: "覆盖行权的现金"}
    description: {en: "If assigned you must pay strike times 100 per contract to buy the shares, so cash must be at least that amount. Without it do not open the trade. Source: your brokerage account.", zh: "被行权时每张合约要拿出行权价 × 100 的现金买入股票，所以现金至少要有这个数。现金不够就不该开仓。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E09", "F10"]
  - rule_id: POS-05
    name: {en: "Total put exposure", zh: "Put 总敞口"}
    description: {en: "Notional exposure (strike times 100 times contracts) of all your short puts, including the new one, must not exceed 70% of net value. It is the amount you would have to buy if everything were assigned. Source: your brokerage account.", zh: "你所有卖出的 Put（含新仓）的名义敞口（行权价 × 100 × 张数）不能超过净值的 70%。这是全部被行权时需要买入的总金额。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A17"]
  - rule_id: POS-06
    name: {en: "Single-stock exposure", zh: "单股敞口"}
    description: {en: "Notional exposure to any one stock must stay under 35% of net value, to avoid concentration. Source: your brokerage account.", zh: "对任何一只股票的名义敞口不能超过净值的 35%，避免过度集中。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A18"]
  - rule_id: POS-07
    name: {en: "Sector exposure", zh: "板块敞口"}
    description: {en: "One sector must not exceed 50% of total exposure, so one sector's trouble does not hurt everything. Source: your brokerage account.", zh: "同一板块的敞口不能超过总敞口的 50%，避免一个板块出事时全线受损。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["Z04"]
  - rule_id: POS-08
    name: {en: "Max loss per trade", zh: "单笔最大亏损"}
    description: {en: "The worst loss on one trade, measured to the stop, must not exceed 2% of net value. This is the most basic risk control. Source: your brokerage account.", zh: "单笔交易到止损为止的最大亏损不能超过净值的 2%，这是最基本的风控。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["Z03"]
  - rule_id: POS-09
    name: {en: "Single option size", zh: "单只期权仓位"}
    description: {en: "A single option position you buy must be at most 10% of net value, because it can go to zero. Source: your brokerage account.", zh: "你买入的单只期权仓位不能超过净值的 10%，因为它可能归零。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D08"]
  - rule_id: POS-10
    name: {en: "Long premium total", zh: "多头权利金总额"}
    description: {en: "Total premium paid for long options must stay under 20% of net value, so many small bets cannot add up to a large loss. Source: your brokerage account.", zh: "买入期权支付的权利金总额不能超过净值的 20%，防止多笔小额亏损累计成大额亏损。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D10"]
  - rule_id: POS-11
    name: {en: "Spread switch", zh: "改用价差"}
    description: {en: "When one leg ties up more than 20% of net value, switch to a spread (buying a farther option to cap the risk). Source: your brokerage account.", zh: "单腿占用的资金超过净值的 20% 时，改用价差（再买一张更远的期权把风险封顶）。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["B13"]
  - rule_id: POS-12
    name: {en: "Scale in", zh: "分批建仓"}
    description: {en: "Build the position in 2 or more steps instead of all at once, so you do not buy at the worst price. A trade plan item.", zh: "分 2 批或更多批建仓，不要一次买满，避免买在最差的价位。这是交易计划里的一项。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D09"]
  - rule_id: POS-13
    name: {en: "Covered Call size", zh: "Covered Call 张数"}
    description: {en: "Covered call contracts must equal shares owned divided by 100, never more; otherwise the extra calls are naked (uncovered). Source: your brokerage account.", zh: "Covered Call 的张数必须等于持股数除以 100，不能多；多出的部分就成了裸卖（没有股票覆盖）。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E13"]
  - rule_id: POS-14
    name: {en: "Portfolio Greeks", zh: "组合希腊字母"}
    description: {en: "The Greeks of the whole option book: Delta (direction), Vega (sensitivity to volatility), Theta (daily time decay) and beta-weighted Delta (everything converted to S&P 500 equivalent). Thresholds differ by person. Source: your brokerage account, or computed from positions and option chains.", zh: "整个期权组合的希腊字母：Delta（方向敞口）、Vega（对波动率的敏感度）、Theta（每日时间损耗）和 beta 加权 Delta（统一折算成标普 500 的等价敞口）。阈值因人而异。数据来源：你的券商账户，或由持仓和期权链计算。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
  - rule_id: POS-15
    name: {en: "Margin usage", zh: "保证金占用"}
    description: {en: "How much of your margin or buying power is already used. If it is too full, a market swing can force the broker to close positions. Many traders stay under half. Source: your brokerage account.", zh: "已经用掉多少保证金或购买力。用得太满，行情一波动，券商可能强制平仓。很多交易者控制在一半以内。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
  - rule_id: POS-16
    name: {en: "Correlation and stress", zh: "相关性与压力测试"}
    description: {en: "Whether your positions move together (correlation), and how much you would lose in a stress test such as a 20% drop with volatility up 50%. Thresholds differ by person. Source: your brokerage account, calculated.", zh: "你的持仓是否同涨同跌（相关性），以及压力测试下会亏多少，比如标的下跌 20% 且波动率上升 50%。阈值因人而异。数据来源：你的券商账户，自行计算。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
  # THS · Thesis and discipline
  - rule_id: THS-01
    name: {en: "Circle of competence", zh: "能力圈"}
    description: {en: "You can explain in plain words how the company makes money. If you cannot, stay away. Source: your own judgment.", zh: "你能用大白话说清这家公司怎么赚钱。说不清的公司不要碰。数据来源：你自己的判断。"}
    method: "manual"
    quantifiable: "no"
    backtestable: "no"
    status: "no_data"
  - rule_id: THS-02
    name: {en: "Written thesis", zh: "书面逻辑"}
    description: {en: "Write down the reason before you open: why you trade and what you expect. If you cannot write it, it is probably an impulse. Source: your own notes.", zh: "开仓前把理由写下来：为什么做、预期什么。写不出来多半是冲动。数据来源：你自己的记录。"}
    method: "manual"
    quantifiable: "no"
    backtestable: "no"
    status: "no_data"
  - rule_id: THS-03
    name: {en: "Willing to hold", zh: "愿意持有"}
    description: {en: "Selling a put may leave you owning the stock, so you must be willing to hold it for the long term. Source: your own answer.", zh: "卖 Put 可能让你被行权接下股票，所以你必须愿意长期持有它。数据来源：你自己的回答。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A15", "E01"]
  - rule_id: THS-04
    name: {en: "Trade purpose", zh: "交易目的"}
    description: {en: "Be clear whether the trade is to earn rent (the premium) or to buy the stock. The purpose changes how you manage it. Source: your own answer.", zh: "要清楚这笔交易是想收租金（权利金），还是想接盘买股。目的不同，处理方式也不同。数据来源：你自己的回答。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E16"]
  - rule_id: THS-05
    name: {en: "Falsification", zh: "证伪条件"}
    description: {en: "Write down what would prove you wrong, and exit when it happens instead of finding reasons afterwards. For it to be testable, state it as a price or indicator, such as a close below a moving average. Source: your own notes.", zh: "写下什么情况证明你的判断错了，发生时就认错离场，不要事后找理由。要能检验，就写成价格或指标，比如收盘跌破某条均线。数据来源：你自己的记录。"}
    method: "manual"
    quantifiable: "part"
    backtestable: "no"
    status: "no_data"
  - rule_id: THS-06
    name: {en: "Sleep test", zh: "睡眠测试"}
    description: {en: "Ask whether you could still sleep if the stock fell to its 52-week low. Convert the loss into dollars and a share of net value. Source: your own answer.", zh: "问自己：股价跌到 52 周低点时，你还睡得着觉吗？把亏损换算成金额和占净值的比例。数据来源：你自己的回答。"}
    method: "manual"
    quantifiable: "part"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["A24"]
  - rule_id: THS-07
    name: {en: "Trade frequency", zh: "出手频率"}
    description: {en: "Passes when you made at most 2 trades in the last 30 days. Trading too often usually means chasing prices. Source: your trade records.", zh: "近 30 天出手不超过 2 次时通过。出手过于频繁通常说明在追涨杀跌。数据来源：你的成交记录。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D04"]
  # EXT · Management and exit
  - rule_id: EXT-01
    name: {en: "Seller take profit", zh: "卖方止盈"}
    description: {en: "Sellers buy the option back once half (50%) or 70% of the premium is earned, to lock in the profit and free the capital. Source: a trade plan, with prices from the option chain. It could be backtested later in a trade simulator.", zh: "卖方赚到一半（50%）或七成权利金时买回平仓，把利润落袋，释放资金。数据来源：交易计划，价格来自期权链。将来可以在交易模拟器中回测。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["B16", "B17"]
  - rule_id: EXT-02
    name: {en: "Buyer take profit", zh: "买方止盈"}
    description: {en: "Buyers take profit once the option is up 60% or 100%, so gains do not melt away. Source: a trade plan, with prices from the option chain.", zh: "买方在期权上涨 60% 或 100% 时止盈，避免利润回吐。数据来源：交易计划，价格来自期权链。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D12", "D13"]
  - rule_id: EXT-03
    name: {en: "Stop loss", zh: "止损"}
    description: {en: "Close the trade when the loss reaches 2 times the premium collected. Source: a trade plan, with prices from the option chain. It could be backtested later in a trade simulator.", zh: "亏损达到收取权利金的 2 倍时平仓离场。数据来源：交易计划，价格来自期权链。将来可以在交易模拟器中回测。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["Z01"]
  - rule_id: EXT-04
    name: {en: "Buyer stop", zh: "买方止损"}
    description: {en: "For buyers: if the stock has reached your target but the option still loses money, time decay or falling volatility is hurting you, so exit. Source: a trade plan.", zh: "买方：正股已经到了目标位，但期权仍然亏损，说明时间损耗或波动率下降在拖累你，应该离场。数据来源：交易计划。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D14"]
  - rule_id: EXT-05
    name: {en: "Time stop or roll", zh: "时间止损或展期"}
    description: {en: "With 21 days left, either close early or roll (close and reopen further out in time), to avoid the sharp swings near expiration. Source: a trade plan, with dates from the option chain. It could be backtested later in a trade simulator.", zh: "剩 21 天左右时，要么提前平仓，要么展期（平掉后在更远的到期日重新开仓），避免临近到期的剧烈波动。数据来源：交易计划，日期来自期权链。将来可以在交易模拟器中回测。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["Z02"]
  - rule_id: EXT-06
    name: {en: "Holding period", zh: "持有期"}
    description: {en: "Decide how long you will hold in advance: 3 to 10 days for buyers, at least six months for the SPMO rotation. Source: a trade plan.", zh: "事先定好持有多久：买方 3–10 天，SPMO 轮动至少半年。数据来源：交易计划。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["D11", "C04"]
  - rule_id: EXT-07
    name: {en: "Rebalance execution", zh: "换仓执行"}
    description: {en: "On the SPMO rebalance day, trade at the closing price so execution stays consistent. Source: a trade plan.", zh: "在 SPMO 换仓日用收盘价执行，保持执行方式一致。数据来源：交易计划。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["C02"]
  - rule_id: EXT-08
    name: {en: "Covered Call plan", zh: "Covered Call 计划"}
    description: {en: "Once you hold the shares, plan the covered calls in advance rather than just holding. Source: a trade plan.", zh: "持股后要提前计划卖 Covered Call，而不是被动持有。数据来源：交易计划。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E10"]
  - rule_id: EXT-09
    name: {en: "Covered Call strike floor", zh: "Covered Call 行权价下限"}
    description: {en: "The covered call strike must be at or above your cost basis (what you paid for the shares), so assignment does not lock in a loss. Source: your brokerage account.", zh: "Covered Call 的行权价必须不低于你的成本价（买入股票时的成本），这样被行权不会锁定亏损。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E14"]
  - rule_id: EXT-10
    name: {en: "Cost basis check", zh: "成本价检查"}
    description: {en: "Passes when cost basis is at most 1.15 times the current price; if it is much higher, pause covered calls so you are not assigned at a low price and lock in a loss. Source: your brokerage account.", zh: "成本价不超过现价的 1.15 倍时通过；成本比现价高很多时，先暂停卖 Covered Call，避免在低价被行权而锁定亏损。数据来源：你的券商账户。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["E15", "F12"]

retired_rule_list:
  - {rule_id: "VAL-02", legacy_id: [], reason: {en: "No free history and not a well-known indicator; market valuation is covered by VAL-01, VAL-11 and VAL-12.", zh: "没有免费历史，也不是知名指标；大盘估值由 VAL-01、VAL-11 和 VAL-12 覆盖。"}}
  - {rule_id: "EVT-09", legacy_id: ["Z11"], reason: {en: "Could not be measured: a pending regulation event is news, not a number. EVT-14 (policy uncertainty) measures the nearest thing.", zh: "无法量化：待决的监管事件是新闻，不是数字。EVT-14（政策不确定性）度量最接近的东西。"}}
  - {rule_id: "LIQ-02", legacy_id: [], reason: {en: "A ranking line drifts over time and needs point-in-time data for 500 stocks. Replaced by the fixed size line LIQ-07; its old id D01 moved there.", zh: "排名分界线会随时间漂移，还要 500 只股票的时点数据。已由固定的规模线 LIQ-07 取代，旧编号 D01 已移到那里。"}}

# Old rules that did not become a rule here (strategy choices or strategy-level checks, move them into strategy files):
