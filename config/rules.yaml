    description: {en: "Passes when the implied leverage of the option you buy (Delta times stock price divided by the premium, meaning how much stock exposure each dollar buys) is at least 10 times.", zh: "你买入期权的隐含杠杆（Delta × 股价 ÷ 权利金，也就是每一块钱能买到多少股票敞口）不低于 10 倍时通过。"}
    indicator: "I-120"
    operator: "greater_or_equal"
    value: 10
    legacy_id: ["D05"]
  - rule_id: RET-04
    rule_name: "breakeven_10pct_below"
    description: {en: "Passes when the breakeven price (strike minus premium for a put) is at least 10% below the current price.", zh: "盈亏平衡价（Put 为行权价减权利金）比现价低至少 10% 时通过。"}
    indicator: "I-118"
    operator: "greater_or_equal"
    value: 10
  - rule_id: RET-05
    rule_name: "win_probability_at_least_75pct"
    description: {en: "Passes when the probability of profit, approximated as 1 minus |Delta|, is at least 0.75.", zh: "盈利概率（用 1 减 |Delta| 近似）不低于 0.75 时通过。"}
    indicator: "I-119"
    operator: "greater_or_equal"
    value: 0.75
  # POS · Position, account and portfolio
  - rule_id: POS-01
    rule_name: "option_level"
    description: {en: "Your brokerage account must have enough option permission: level 2 allows cash-secured puts and covered calls, level 3 allows spreads (the exact levels depend on the broker). Without it the order is rejected. Source: your brokerage account; not public data.", zh: "你的券商账户必须有足够的期权权限：2 级可以做现金担保 Put 和 Covered Call，3 级可以做价差（具体级别因券商而异）。没有权限，下单会被拒绝。数据来源：你的券商账户，不是公开数据。"}
    method: "manual"
    quantifiable: "yes"
    backtestable: "no"
    status: "no_data"
    legacy_id: ["B14", "B15"]
  - rule_id: POS-02
    rule_name: "no_leverage"
    description: {en: "No borrowed money, and every short put is backed by enough cash (cash-secured). Source: your brokerage account.", zh: "不借钱，并且每个卖出的 Put 都有足够现金担保（现金担保）。数据来源：你的券商账户。"}
    method: "manual"
