    name: {en: "Fear and Greed at most 55", zh: "恐惧贪婪不高于 55"}
    description: {en: "Passes when the CNN Fear and Greed Index is at most 55 (not in greed). One of the Fear and Greed tiers; see SEN-04 for what it measures, the source and typical values. Backtest history: CNN Fear and Greed data (unofficial), fear-and-greed, from 2021-01-04.", zh: "CNN 恐惧贪婪指数不高于 55（没有进入贪婪）时通过。恐惧贪婪分档之一；含义、数据来源和常见数值见 SEN-04。回测历史：CNN 恐惧贪婪数据（非官方），fear-and-greed，自 2021-01-04 起。"}
