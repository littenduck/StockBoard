  - indicator_id: I-010
    indicator_name: "consumer_price_index_year_over_year_percent"
    description: {en: "CPI (Consumer Price Index) inflation, the change from a year earlier. High inflation forces the Fed to keep rates high, which holds valuations down. A backtest uses the value as first published at the time, so it sees only what was known then. Source: FRED series CPIAUCSL (first-published values from ALFRED, FRED's archive), published with a lag of 2 to 6 weeks. Typical values: the Fed targets 2% inflation (PCE); CPI above 3% is high.", zh: "CPI（消费者价格指数）通胀，即与一年前相比的涨幅。通胀高会迫使美联储把利率维持在高位，压低估值。回测使用当时首次公布的数值，只看到当时已知的信息。数据来源：FRED 的 CPIAUCSL 序列（首次公布值来自 ALFRED，即 FRED 的存档），滞后 2 到 6 周。常见情形：美联储的目标是 2% 通胀（按 PCE）；CPI 高于 3% 算偏高。"}
    unit: "%"
