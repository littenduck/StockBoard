  - indicator_id: I-007
    indicator_name: "high_yield_credit_spread_basis_points"
    description: {en: "The extra yield junk bonds (HY, high-yield bonds rated below investment grade) pay over Treasuries, measured as OAS (option-adjusted spread), in bp. A widening spread signals rising credit risk and usually leads stock stress. Source: FRED series BAMLH0A0HYM2 (ICE BofA US High Yield OAS); FRED now keeps only about 3 years of history. Typical values: long-run average about 500bp; below 350bp is tight, above 500bp is stress, above 800bp is crisis (market convention).", zh: "垃圾债（HY，评级低于投资级的高收益债券）比国债多付的收益率，用 OAS（期权调整利差）衡量，单位 bp。利差走阔说明信用风险上升，通常领先股市压力。数据来源：FRED 的 BAMLH0A0HYM2 序列（ICE BofA 美国高收益债 OAS）；FRED 现在只保留约 3 年历史。常见情形：长期均值约 500bp；低于 350bp 偏紧，高于 500bp 是压力，高于 800bp 是危机（市场惯例）。"}
    unit: "bp"
    scope: market
    method: "api_fetch"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:BAMLH0A0HYM2"
    history_start: "2023-10-24"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
    display_name: {en: "HY spread", zh: "HY 利差"}
    is_higher_value_risky: true
  - indicator_id: I-008
    indicator_name: "high_yield_credit_spread_twenty_day_change_basis_points"
    description: {en: "How much the HY credit spread has widened over the last 20 trading days, in bp. A quick widening is an early sign of credit stress. Source: FRED series BAMLH0A0HYM2. Typical values: a rise of 50bp or more in 20 days is often read as credit stress (rule of thumb).", zh: "HY 信用利差在最近 20 个交易日里走阔了多少，单位 bp。快速走阔是信用压力的早期信号。数据来源：FRED 的 BAMLH0A0HYM2 序列。常见情形：20 天内升 50bp 以上常被看作信用压力（经验）。"}
    unit: "bp"
    scope: market
