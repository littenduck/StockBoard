# Indicator catalog: every measured quantity the app can use, defined once. A rule (config/rules.yaml) points at an indicator by id and adds
# the line to test (operator and value); a strategy (config/strategies/*.yaml) weights rules. Several rules can share one indicator.
#
# Fields of every indicator:
#   indicator_id    the short id people write, I-001 onward
#   indicator_name  the long name the code uses, lower case words joined by underscores
#   unit            the unit shown after the number of a rule line (%, bp, pp, USD ...); "" for a pure ratio or index. Required for every indicator a rule tests with a number
#   scope           market (same for every symbol), symbol (one value per stock) or window (one value per option expiration window)
#   method          how the value is obtained, the hardest step wins: api_fetch (a stable API or CSV), scrape (an unofficial endpoint, page or file that
#                   needs parsing), computed (worked out from fetched prices, series or option chains), ai_search (an AI reads pages or news)
#   quantifiable    yes, part or no (English only): whether it is a number or a yes/no test
#   backtestable    yes or no (English only): whether free history can rebuild what it would have said on a past date; history_source is
#                   "source:detail" of that history and history_start its first year, month or day. Left out when no rule uses the indicator.
#   status          built (the app computes it) or todo (the data is free, the code is not written yet)
#   fetch_group, fetch_every, max_age   given only to built indicators (a todo one gets them when it is written)
#   fetch_group     the family of requests it comes from; indicators of one group are fetched together (see fetch_group_list)
#   fetch_every     how often the source is asked again: 10m, 1h, 6h, 1d, 7d ... A value that is not due is not fetched again.
#                   The interval of a group is the shortest fetch_every among its indicators.
#   max_age         how old the newest observation may be; past it the value reads unknown. Never shorter than fetch_every.
#   display_name, is_higher_value_risky   only for the indicators on the sidebar (config/settings.yaml lists which); a rising value is colored as bad
#
# fetch_group_list: market_hours_only groups are fetched only while the US market is open; fetch_at lists New York times of day at which the
# group is also fetched once even if fetch_every has not passed (prices after the close, slow data before the open). A group that changes only
# while the market trades (prices, option quotes, company estimates, Fear and Greed) is market_hours_only, so nothing is asked overnight except at its fetch_at time.

fetch_group_list:
  - {fetch_group_id: yahoo_history, market_hours_only: false, fetch_at: ["16:30"], fetch_every: "1d", note: "Daily price history of every symbol (an internal job, no indicator): loaded once a day and again after the close"}
  - {fetch_group_id: yahoo_quote, market_hours_only: true, fetch_at: ["16:20"], note: "Prices and everything computed from them; the latest price of every symbol comes from one batched request and replaces today's bar of the daily history"}
  - {fetch_group_id: yahoo_options, market_hours_only: true, fetch_at: [], note: "Option chains: expiration list and one chain per expiry"}
  - {fetch_group_id: yahoo_company, market_hours_only: true, fetch_at: ["06:00"], note: "Company figures, estimates, ratings, insider trades, dividends and earnings dates: one request per symbol"}
  - {fetch_group_id: fred, market_hours_only: false, fetch_at: ["06:00"], note: "FRED CSV series"}
  - {fetch_group_id: cboe_put_call, market_hours_only: false, fetch_at: ["06:00"], note: "Cboe total put/call ratio"}
  - {fetch_group_id: cnn, market_hours_only: true, fetch_at: ["16:30"], note: "CNN Fear and Greed"}
  - {fetch_group_id: aaii, market_hours_only: false, fetch_at: ["06:00"], note: "AAII survey through the Internet Archive"}
  - {fetch_group_id: reference_files, market_hours_only: false, fetch_at: ["06:00"], note: "Shiller CAPE, Damodaran premium and GPR files"}
  - {fetch_group_id: calendar, market_hours_only: false, fetch_at: [], note: "Release calendar and date arithmetic"}
  - {fetch_group_id: dolthub_iv, market_hours_only: false, fetch_at: ["06:00"], note: "DoltHub implied volatility history"}
  - {fetch_group_id: finra, market_hours_only: false, fetch_at: ["06:00"], note: "FINRA short interest"}
  - {fetch_group_id: spmo_holdings, market_hours_only: false, fetch_at: ["06:00"], note: "SPMO top holdings"}
  - {fetch_group_id: edgar, market_hours_only: false, fetch_at: ["06:00"], note: "SEC EDGAR filings (needs the EDGAR_CONTACT setting)"}

indicator_list:
  - indicator_id: I-001
    indicator_name: "federal_funds_target_rate_not_raised_in_182_days"
    description: {en: "Whether the Fed has left its federal funds target rate (the upper bound) unchanged or lower than it was 182 days ago. Rising rates push stock valuations down and make selling puts riskier. Source: FRED series DFEDTARU (2008 onward) joined to DFEDTAR (1982 to 2008). Typical values: a hiking cycle is a run of increases of 25bp (basis points) or more.", zh: "美联储的联邦基金目标利率（上限）与 182 天前相比，是不是没有上调。利率上升会压低股票估值，让卖 Put 更危险。数据来源：FRED 的 DFEDTARU 序列（2008 年起）接 DFEDTAR（1982 到 2008）。常见情形：加息周期指连续上调 25bp（基点）或以上。"}
    scope: market
    method: "computed"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:DFEDTAR+DFEDTARU"
    history_start: "1982"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
  - indicator_id: I-002
    indicator_name: "six_month_treasury_bill_yield_minus_federal_funds_rate"
    description: {en: "The 6-month Treasury bill yield minus the federal funds rate, a free stand-in for the CME FedWatch odds of a hike at the next FOMC (the Federal Open Market Committee that sets US interest rates). When bills yield more than the policy rate, the market expects a hike. Source: FRED series DGS6MO and DFF.", zh: "6 个月期国库券收益率减联邦基金利率，是 CME FedWatch（下次 FOMC 会议加息概率）的免费替代。国库券收益率高于政策利率，说明市场预期加息。FOMC 是制定美国利率的联邦公开市场委员会。数据来源：FRED 的 DGS6MO 和 DFF 序列。"}
    unit: "pp"
    scope: market
    method: "computed"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:DGS6MO+DFF"
    history_start: "1981"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
  - indicator_id: I-003
    indicator_name: "treasury_ten_year_yield"
    description: {en: "Yield on the 10-year US Treasury note, the benchmark rate the market uses to discount future earnings. The higher it is, the harder it is for stocks to hold their valuations. Source: FRED series DGS10, published with a lag of about 1 business day. Typical values: about 0.5% to 5.0% over the last 20 years; above 4.5% is often seen as pressure on stocks (rule of thumb).", zh: "10 年期美国国债收益率，是市场给未来盈利折现的基准利率。越高，股票越难守住估值。数据来源：FRED 的 DGS10 序列，约滞后 1 个工作日。常见情形：过去 20 年大致在 0.5%–5.0%；高于 4.5% 常被视为对股市有压力（经验）。"}
    unit: "%"
    scope: market
    method: "api_fetch"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:DGS10"
    history_start: "1962-01-02"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
    display_name: {en: "10Y", zh: "10Y"}
    is_higher_value_risky: true
  - indicator_id: I-004
    indicator_name: "treasury_ten_year_yield_twenty_day_change_basis_points"
    description: {en: "How much the 10-year Treasury yield has risen over the last 20 trading days, in bp (basis points; 1bp = 0.01 percentage point). A fast rise hurts stocks more than a high level. Source: FRED series DGS10. Typical values: ±25bp over 20 days is a clear move; a rise of 50bp or more in a month is fast (rule of thumb).", zh: "10 年期国债收益率在最近 20 个交易日里上升了多少，单位 bp（基点；1bp = 0.01 个百分点）。上升得快比水平高更伤股市。数据来源：FRED 的 DGS10 序列。常见情形：20 天内 ±25bp 就算明显波动；一个月升 50bp 以上算快（经验）。"}
    unit: "bp"
    scope: market
    method: "computed"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:DGS10"
    history_start: "1962-01-02"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
  - indicator_id: I-005
    indicator_name: "treasury_ten_year_minus_two_year_spread"
    description: {en: "The 10-year Treasury yield minus the 2-year yield. A negative value is an inverted curve (short rates above long rates), a common recession warning. Source: FRED series T10Y2Y. Typical values: inversions have often come months to two years before recessions (rule of thumb).", zh: "10 年期国债收益率减 2 年期收益率。为负就是收益率曲线倒挂（短期利率高于长期），是常见的衰退预警。数据来源：FRED 的 T10Y2Y 序列。常见情形：倒挂常出现在衰退前几个月到两年（经验）。"}
    unit: "pp"
    scope: market
    method: "api_fetch"
    quantifiable: "yes"
    backtestable: "yes"
    history_source: "fred:T10Y2Y"
    history_start: "1976"
    status: built
    fetch_group: fred
    fetch_every: 1d
    max_age: 10d
  - indicator_id: I-006
    indicator_name: "treasury_ten_year_minus_three_month_spread"
    description: {en: "The 10-year Treasury yield minus the 3-month yield, the curve slope the New York Fed uses in its recession-probability model. A negative value means the curve is inverted. Source: FRED series T10Y3M.", zh: "10 年期国债收益率减 3 个月期收益率，是纽约联储衰退概率模型使用的曲线斜率。为负表示曲线倒挂。数据来源：FRED 的 T10Y3M 序列。"}
    unit: "pp"
    scope: market
    method: "api_fetch"
    quantifiable: "yes"
