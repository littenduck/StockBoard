    max_age: 10d
  - indicator_id: I-009
    indicator_name: "moodys_baa_minus_ten_year_treasury_spread"
    description: {en: "Moody's seasoned Baa corporate bond yield minus the 10-year Treasury yield, in percentage points. It is a long-history stand-in for the HY credit spread, which FRED only keeps for about 3 years; a wider gap means rising credit risk. Source: FRED series BAA10Y. Typical values: since 1986, 2.8 is the 80th percentile of the spread and 3.3 the 95th.", zh: "穆迪 Baa 级公司债收益率减 10 年期国债收益率，单位是百分点。它是 HY 信用利差的长历史替代（FRED 只保留 HY 利差约 3 年）；差距越大，信用风险越高。数据来源：FRED 的 BAA10Y 序列。常见情形：1986 年以来，2.8 是该利差的第 80 百分位，3.3 是第 95 百分位。"}
